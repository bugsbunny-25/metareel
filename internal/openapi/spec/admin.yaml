openapi: 3.0.3
info:
  title: metareel Admin API
  version: "1.0.0"
  description: >
    The admin console's API. When the server runs with
    AUTH_REQUIRE_ADMIN_LOGIN=true, every route needs a signed-in user with the
    admin role (the metareel_session cookie from POST /api/v1/auth/login, or
    "Authorization: Bearer mrs_..."): 401 without a valid session, 403 for
    other roles. API keys never open the admin API. Without that setting the
    admin API is open (keep it off the public internet). Browser requests that
    change data must come from the same origin.
servers:
  - url: /
security:
  - SessionCookie: []
  - BearerSession: []
paths:
  /api/v1/admin/task-schedules:
    get:
      operationId: listTaskSchedules
      summary: List task schedules
      parameters:
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
        - name: task_type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of task schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskScheduleListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTaskSchedule
      summary: Create a task schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskScheduleInput"
      responses:
        "200":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}:
    get:
      operationId: getTaskScheduleById
      summary: Get task schedule by ID
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "200":
          description: Task schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchTaskSchedule
      summary: Update a task schedule
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskScheduleInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/run-now:
    post:
      operationId: runTaskScheduleNow
      summary: Enqueue a schedule to run immediately
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A run of this schedule is already queued, running or retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/runs:
    get:
      operationId: listTaskRunsByScheduleId
      summary: List task runs for a schedule (paged)
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Task runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/flixpatrol-targets:
    post:
      operationId: addFlixPatrolTargets
      summary: Add FlixPatrol targets to a schedule
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFlixPatrolTargetsInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs:
    get:
      operationId: listTaskRuns
      summary: List task runs (paged, newest first; the total is in the X-Total-Count header)
      parameters:
        - name: task_type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [started, succeeded, partial, failed]
        - name: schedule_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Task runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs/{run_id}:
    get:
      operationId: getTaskRunById
      summary: Get task run by ID
      parameters:
        - $ref: "#/components/parameters/RunIdParam"
      responses:
        "200":
          description: Task run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs/{run_id}/logs:
    get:
      operationId: listTaskRunLogsByRunId
      summary: List task run logs
      parameters:
        - $ref: "#/components/parameters/RunIdParam"
      responses:
        "200":
          description: Task run logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunLogResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: Dashboard summary (run counts, schedule health, mapping coverage)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                description: >
                  schedules {total, enabled}; runs {running, last_24h, last_7d}
                  (counts by status), runs.daily [{date, succeeded, partial,
                  failed, started}] for the last 14 UTC days (oldest first, days
                  without runs are zero); schedule_health [{schedule_id, name,
                  enabled, utc_runtimes, next_run_at, last_run, last_success_at}];
                  titles {total, missing_tmdb, missing_imdb, missing_rt};
                  rankings {total, latest_date}

  /api/v1/admin/task-types:
    get:
      operationId: listTaskTypes
      summary: Job types a schedule can run, with descriptions
      responses:
        "200":
          description: Task types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    label: { type: string }
                    description: { type: string }
                    has_targets: { type: boolean }

  /api/v1/admin/jobs/{type}/run:
    post:
      operationId: runJob
      summary: Run a job now, outside its schedule
      description: >
        Any task type except flixpatrol.top10.scrape (use a schedule's run-now
        or /backfill). title_ids limits titles.enrich (FlixPatrol title IDs)
        or netflix.titles.match (Netflix title IDs) to those titles and
        ignores their retry backoff; force re-imports unchanged files.
        mapping.refresh is queued automatically after mapping changes; run by
        hand it first recomputes every linked title's mapping.
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, example: titles.enrich }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title_ids: { type: array, items: { type: integer, format: int64 }, maxItems: 500 }
                force: { type: boolean }
                url: { type: string, description: "netflix.engagement.import only: an https report (.xlsx) to add to the list" }
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The same job is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/backfill:
    post:
      operationId: backfill
      summary: Scrape FlixPatrol charts for past dates
      description: >
        One ad-hoc run over every date in [from, to] (at most 60 days) for a
        schedule's targets or the given targets. Charts already stored are
        skipped unless force.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_id: { type: integer, format: int64 }
                targets:
                  type: array
                  items:
                    $ref: "#/components/schemas/FlixPatrolTargetPayload"
                from: { type: string, format: date }
                to: { type: string, format: date }
                force: { type: boolean }
              required: [from]
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/titles/{id}/rematch:
    post:
      operationId: rematchTitle
      summary: Match a title again now
      description: >
        Clears the retry backoff (and a manual lock) and queues titles.enrich
        for the title. Its own earlier match applies again (or, if it has
        none, the lifted fix stays as its match) until matching finds another.
        clear=true forgets its mapping instead (wrong match),
        along with Netflix matches made through it; linked titles that had
        taken it fall back to their own.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clear: { type: boolean }
      responses:
        "202":
          description: Queued; returns the title and the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { $ref: "public.yaml#/components/schemas/TitleResponse" }
                  job: { $ref: "#/components/schemas/RunTaskNowResponse" }
        "404":
          description: Title not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/data-quality:
    get:
      operationId: getDataQuality
      summary: How complete and fresh the data is
      description: >
        Match status counts (FlixPatrol and Netflix titles), Netflix season
        titles by how their season number was found (netflix_season_mapping,
        "unmapped" = none yet), TMDB metadata and
        IMDb dataset coverage, last imports, weekly share of chart entries
        with a TMDB / RT match, unmatched titles by country, stale charts and
        missing dates in the last 30 days per scheduled chart, and mapped
        titles whose deciding match or fix came with an IMDb ID other than
        their TMDB title's (imdb_mismatches, up to 200; each with
        subject_type flixpatrol | netflix, subject_id, name, tmdb_kind,
        tmdb_id, imdb_id = what the match / fix came with, tmdb_imdb_id =
        the TMDB title's, evidence_kind manual | netflix_id | match and its
        source), and Netflix titles whose own Netflix ID (Tudum) differs from
        their TMDB title's from a stronger source than a copy
        (netflix_id_mismatches, up to 200; each with netflix_title_id,
        show_title, list, tmdb_kind, tmdb_id, tmdb_title, netflix_id = the
        title's own, tmdb_netflix_id and tmdb_netflix_source, match_status,
        match_source, and other_title_has_id = another Netflix title mapped
        to the same TMDB title has its ID, i.e. a special or season of that
        show; likely wrong mappings first, titles fixed by hand last).
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/admin/titles/{id}:
    patch:
      operationId: patchTitle
      summary: Correct a title's kind and external IDs
      description: >
        Admin only. A title corrected here is marked as a manual match, so
        scheduled scrapes and remap jobs never overwrite it; linked Netflix
        titles follow. IMDb, Wikidata, Rotten Tomatoes and JustWatch IDs
        belong to the TMDB title (shown here for convenience), so moving the
        title to another TMDB title shows that title's IDs (its details are
        fetched if missing). imdb_id / rt_url given here are stored as the
        TMDB title's, set by hand (TMDB, Wikidata and matching never replace
        them; "" hands them back). The rest follows in a mapping.refresh
        job.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTitleIDsInput"
      responses:
        "200":
          description: Updated title
          content:
            application/json:
              schema:
                $ref: "public.yaml#/components/schemas/TitleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/titles/{id}/candidates:
    get:
      operationId: getTitleCandidates
      summary: Suggest TMDB / IMDb / Rotten Tomatoes matches for a title
      description: Searches JustWatch, TMDB (needs TMDB_API_KEY) and Rotten Tomatoes by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: name
          in: query
          required: false
          schema: { type: string, description: "Default: the title's name" }
        - name: year
          in: query
          required: false
          schema: { type: integer, description: "Default: the slug's year suffix" }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [movie, tv_show] }
      responses:
        "200":
          description: Candidates per provider (justwatch, tmdb, rotten_tomatoes) and any provider errors
        "404":
          description: Title not found

  /api/v1/admin/netflix/titles:
    get:
      operationId: listNetflixTitles
      summary: List Netflix official Top 10 titles and their mapping
      description: >
        One row per Netflix show / film name (seasons are listed per title),
        with its TMDB / IMDb match, match status, global Top 10 stats and how
        many of its season titles have no season number yet. Newest charting
        week first by default.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, description: Show title substring or an exact TMDB ID }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [movie, tv_show] }
        - name: match_status
          in: query
          required: false
          schema: { type: string, enum: [pending, matched, unmatched, manual] }
        - name: missing
          in: query
          required: false
          schema: { type: string, enum: [tmdb, season], description: "tmdb: no TMDB ID; season: a season title without a season number" }
        - name: flag
          in: query
          required: false
          schema: { type: string, enum: [cross_kind, linked], description: "cross_kind: mapped to the other TMDB kind than Netflix's list; linked: has linked FlixPatrol titles" }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [last_week_desc, last_week_asc, name_asc, name_desc, weeks_desc, weeks_asc, best_rank_asc, id_desc]
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NetflixTitle" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/netflix/titles/{id}:
    get:
      operationId: getNetflixTitle
      summary: A Netflix title with its seasons and chart history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixTitleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchNetflixTitle
      summary: Correct a Netflix title's TMDB / IMDb IDs
      description: >
        Marks the title as a manual match, so automatic matching never
        overwrites it, fetches the TMDB details (season list), remaps the
        title's seasons and shares the mapping with linked FlixPatrol titles
        that are not fixed by hand. Omitted fields are unchanged; an empty
        string clears an ID. tmdb_kind is the TMDB namespace (default: the
        current one, else Netflix's list); a special in Netflix's TV list can
        be a TMDB movie. Without a TMDB ID, an IMDb or Wikidata ID is resolved
        to one through TMDB's /find, then Wikidata. IMDb / Wikidata IDs
        belong to the TMDB title: imdb_id / wikidata_id given here are stored
        as the TMDB title's, set by hand (TMDB, Wikidata and matching never
        replace them; "" hands them back). Linked FlixPatrol titles follow;
        TMDB details, IDs and seasons follow in a mapping.refresh job.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tmdb_kind: { type: string, enum: [movie, tv] }
                tmdb_id: { type: string, description: Numeric TMDB ID }
                imdb_id: { type: string, example: tt1234567 }
                wikidata_id: { type: string, example: Q141461750, description: Resolved to a TMDB ID when tmdb_id is empty; stored on the TMDB title }
      responses:
        "200":
          description: Updated title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixTitleDetail"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/netflix/titles/{id}/rematch:
    post:
      operationId: rematchNetflixTitle
      summary: Match a Netflix title again now
      description: >
        Clears the retry backoff (and a manual lock) and queues
        netflix.titles.match for the title. Its own earlier match applies
        again (or, if it has none, the lifted fix stays as its match) until
        matching finds another. clear=true forgets its mapping
        instead (wrong match); linked titles that had taken it fall back to
        their own.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clear: { type: boolean }
      responses:
        "202":
          description: Queued; returns the title and the job (null if one is already queued)
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { $ref: "#/components/schemas/NetflixTitleDetail" }
                  job: { $ref: "#/components/schemas/RunTaskNowResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/netflix/titles/{id}/candidates:
    get:
      operationId: getNetflixTitleCandidates
      summary: Suggest TMDB / IMDb / Rotten Tomatoes matches for a Netflix title
      description: Same search as /titles/{id}/candidates; Netflix gives no year, so pass one to search Rotten Tomatoes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: name
          in: query
          required: false
          schema: { type: string, description: "Default: the show title" }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [movie, tv_show] }
      responses:
        "200":
          description: Candidates per provider (justwatch, tmdb, rotten_tomatoes) and any provider errors
        "404":
          description: Not found

  /api/v1/admin/mappings:
    get:
      operationId: listMappings
      summary: The TMDB-keyed mapping across FlixPatrol and Netflix titles
      description: >
        Every TMDB title that FlixPatrol or Netflix official Top 10 titles map
        to, newest activity first, with all its IDs (IMDb, Wikidata, Rotten
        Tomatoes, Netflix, JustWatch, FlixPatrol slugs, Netflix Top 10 names),
        the titles of each source and their links.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [movie, tv] }
        - name: q
          in: query
          required: false
          schema: { type: string, description: "TMDB title, FlixPatrol name / slug or Netflix name substring, or an exact TMDB / IMDb ID" }
        - name: flag
          in: query
          required: false
          schema:
            type: string
            enum: [conflict, cross_kind, both, netflix_only, flixpatrol_only, manual]
            description: "conflict: a linked title is mapped elsewhere; cross_kind: a source lists it as the other kind"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: A page of TMDB titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TmdbMapping" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mappings/review:
    get:
      operationId: reviewMappings
      summary: Automatic mappings scored by how likely they are wrong
      description: >-
        Scores every automatic mapping (FlixPatrol and Netflix titles not
        fixed by hand) 0-100 and lists those at or above min_risk, riskiest
        (then most charted) first. Reasons and their points: weak_source
        (the match rule, up to 35), not_on_provider (35; TMDB shows no offer
        of the service it charted on in any country, checked when it charted
        there within 60 days of the offers being fetched), released_later
        (40), imdb_mismatch (30), year_mismatch (25, films), no_offers (15),
        name_differs (15), no_details (5). `reasons` counts mappings per
        reason before the reason filter.
      parameters:
        - name: subject
          in: query
          schema: { type: string, enum: [flixpatrol, netflix] }
        - name: reason
          in: query
          schema: { type: string, enum: [weak_source, not_on_provider, no_offers, released_later, year_mismatch, name_differs, imdb_mismatch, no_details] }
        - name: min_risk
          in: query
          schema: { type: integer, minimum: 0, maximum: 100, default: 25 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer, description: Automatic mappings scored }
                  total: { type: integer }
                  reasons: { type: object, additionalProperties: { type: integer } }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        subject: { type: string, enum: [flixpatrol, netflix] }
                        id: { type: integer }
                        name: { type: string }
                        kind: { type: string }
                        tmdb_kind: { type: string }
                        tmdb_id: { type: string }
                        tmdb_title: { type: string }
                        tmdb_year: { type: integer }
                        match_source: { type: string }
                        providers: { type: array, items: { type: string } }
                        first_charted: { type: string, format: date }
                        points: { type: integer, description: "chart points (FlixPatrol) or weeks in the global Top 10 (Netflix)" }
                        risk: { type: integer }
                        reasons:
                          type: array
                          items:
                            type: object
                            properties:
                              code: { type: string }
                              text: { type: string }
                              points: { type: integer }
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mappings/review/{subject}/{id}/suggestions:
    get:
      operationId: getReviewSuggestions
      summary: Other TMDB titles a mapping in the review queue could be, ranked
      description: >-
        Searches JustWatch and TMDB (live) for the chart title's name (and
        its base name without a season), in its kind and the other, and ranks
        TMDB titles other than the current mapping: same name (+40) or a
        similar one (+15), the chart's kind (+10), when it came out against
        when it first charted (TMDB's release date: up to 18 months before
        +15, up to three years +5, after it -50; without a date by year: the
        year before +15, the same year or up to three years +5, later -50),
        FlixPatrol's premiere year (+20), and, for the best five, an offer of
        the service it charted on in any country (+35; `on_provider`). Up to
        five suggestions. Apply one (or keep the current mapping) with
        PATCH /api/v1/admin/titles/{id} (`kind`, `tmdb_id`) or
        PATCH /api/v1/admin/netflix/titles/{id} (`tmdb_kind`, `tmdb_id`); both
        are manual fixes, so the title leaves the queue. `errors` names
        searches that failed. Calls run one at a time (searches 500 ms
        apart); a result without errors is kept for 5 minutes.
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string, enum: [flixpatrol, netflix] }
        - name: id
          in: path
          required: true
          description: The FlixPatrol title id or Netflix title id (as in the queue)
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string, enum: [flixpatrol, netflix] }
                  id: { type: integer }
                  name: { type: string }
                  kind: { type: string, enum: [movie, tv_show] }
                  tmdb_kind: { type: string, description: The current mapping }
                  tmdb_id: { type: string }
                  first_charted: { type: string, format: date }
                  providers: { type: array, items: { type: string } }
                  errors: { type: object, additionalProperties: { type: string } }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        tmdb_kind: { type: string, enum: [movie, tv] }
                        tmdb_id: { type: string }
                        title: { type: string }
                        year: { type: integer, nullable: true }
                        on_provider: { type: boolean, nullable: true, description: An offer of the charted service on TMDB (null = not checked) }
                        score: { type: integer }
                        reasons: { type: array, items: { type: string } }
                        url: { type: string }
        "400":
          description: Invalid subject or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not an automatic mapping (unmapped, or fixed by hand)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mappings/sync:
    post:
      operationId: syncMappings
      summary: Recompute links and share mappings now
      description: >
        Links Netflix titles to FlixPatrol titles (same normalized name, same
        Netflix list, on Netflix's charts in the same or an adjacent week) and
        recomputes the mapping of every linked title (and of titles that lost
        a link) from evidence: what matching, Netflix IDs and fixes by hand
        say each title is. Each title weighs its own evidence and that of its
        directly linked titles that are linked to nothing else; a fix by hand
        wins, then a Netflix ID match, then FlixPatrol's match, then
        Netflix's. Nothing is copied, so withdrawn evidence withdraws what was
        shared from it. Every change is recorded (GET
        /api/v1/admin/mapping-events). The matching jobs do this too; TMDB
        details, IDs and seasons of what changed follow in a mapping.refresh
        job.
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema:
                type: object
                properties:
                  links: { type: integer }
                  links_added: { type: integer }
                  links_removed: { type: integer }
                  netflix_titles_updated: { type: integer, description: "Netflix titles that took a linked title's mapping" }
                  flixpatrol_titles_updated: { type: integer, description: "FlixPatrol titles that took a linked title's mapping" }
                  conflicts: { type: integer, description: "Titles whose directly linked titles disagree (they keep their own match or fix)" }

  /api/v1/admin/mappings/{kind}/{id}:
    get:
      operationId: getMapping
      summary: One TMDB title, its IDs and everything mapped to it
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [movie, tv] }
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: Mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbMapping"
        "404":
          description: Nothing is mapped to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mappings/{kind}/{id}/remap:
    post:
      operationId: remapMapping
      summary: Move everything mapped to a TMDB title to another
      description: >
        Every FlixPatrol and Netflix title mapped to {kind}/{id} moves to the
        target (marked as fixed by hand); linked titles follow. Give the
        target as tmdb_kind + tmdb_id, or as imdb_id / wikidata_id, resolved
        through TMDB's /find and then Wikidata (tmdb_kind breaks a tie between
        a movie and a show); an ID given this way is stored as the target's,
        set by hand. TMDB details, IDs and seasons follow in a mapping.refresh
        job.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [movie, tv] }
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tmdb_kind: { type: string, enum: [movie, tv] }
                tmdb_id: { type: string }
                imdb_id: { type: string, example: tt1234567 }
                wikidata_id: { type: string, example: Q141461750 }
      responses:
        "200":
          description: The target's mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TmdbMapping"
        "400":
          description: Bad request (invalid or unresolvable ID, or the current title)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Nothing is mapped to {kind}/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mapping-events:
    get:
      operationId: listMappingEvents
      summary: History of mapping changes
      description: >
        Every change to what a FlixPatrol or Netflix title is mapped to,
        newest first, recorded with the change by the mapping writer: action
        (match, manual, adopt, remap, clear, unshare, requeue), the TMDB title
        before and after, the match source and who made it (a job type,
        mapping.sync for sharing over links, or admin). Filter by subject
        and/or by TMDB title (as the old or the new mapping).
      parameters:
        - name: subject
          in: query
          schema: { type: string, example: "flixpatrol:12", pattern: "^(flixpatrol|netflix):[0-9]+$" }
        - name: tmdb
          in: query
          schema: { type: string, example: "movie:550", pattern: "^(movie|tv):[0-9]+$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MappingEvent"
        "400":
          description: Bad subject, tmdb or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mapping-refs:
    get:
      operationId: listMappingRefs
      summary: The mapping reference (every chart title with every ID)
      description: >
        The database view mapping_refs: one row per chart title (a FlixPatrol
        title, paired with the Netflix Top 10 title linked to it when both map
        to the same TMDB title, or a Netflix title on its own) with its TMDB
        title and every external ID. Unmapped titles have null TMDB fields.
        Derived from the mappings and tmdb_titles; never written. Mapped
        titles first, by TMDB title.
      parameters:
        - name: tmdb_kind
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: mapped
          in: query
          description: true leaves out unmapped titles
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MappingRef"
        "400":
          description: Bad tmdb_kind or mapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/netflix/seasons/{id}:
    patch:
      operationId: patchNetflixSeason
      summary: Set a Netflix season title's season number
      description: >
        season_number fixes it by hand (automatic mapping then leaves it
        alone); auto=true hands it back to automatic mapping. FlixPatrol
        Netflix rankings of the show are re-tagged. Returns the title.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                season_number: { type: integer, minimum: 0, maximum: 999 }
                auto: { type: boolean }
      responses:
        "200":
          description: The title, with its seasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixTitleDetail"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Season not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/webhooks:
    get:
      operationId: listWebhooks
      summary: Webhooks with delivery counts, and the event types
      description: >-
        Webhooks receive a signed POST per event: chart.updated (a chart
        stored or changed, with its entries), title.entered (a title not on
        the chart's previous date; `first_time` when never on it before),
        title.number_one (a new #1), availability.added / availability.removed
        (a title arrived on / left a service in a country), title.breakout (a
        title rising in 2+ countries at once that wasn't the day before, as in
        GET /api/v1/breakouts with the defaults; only for the current chart
        date and the two before it). Body: {id, type,
        created_at, data}. Headers: X-Metareel-Event, X-Metareel-Event-Id
        (stable; use it to ignore repeats), X-Metareel-Delivery and
        X-Metareel-Signature "t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">".
        Any 2xx is success; redirects and other answers are retried after 1,
        5 and 30 minutes, 2 and 12 hours, then the delivery fails. Events
        from before metareel started following (first start with this
        version) are not sent.
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_types: { type: array, items: { type: string } }
                  items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
    post:
      operationId: createWebhook
      summary: Add a webhook (returns its signing secret once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created, with `secret`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateWebhook
      summary: Change a webhook's name, URL, events or enabled flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: No such webhook, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook and its delivery log
      responses:
        "204": { description: Deleted }
        "404": { description: No such webhook, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/webhooks/{id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Replace a webhook's signing secret (returned once)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: New secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "404": { description: No such webhook, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a ping event now and record it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Outcome (delivery.status delivered or failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery: { $ref: "#/components/schemas/WebhookDelivery" }
                  status_code: { type: integer }
                  error: { type: string }
                  duration_ms: { type: integer }
        "404": { description: No such webhook, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/webhooks/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: A webhook's latest deliveries, newest first
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "404": { description: No such webhook, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/webhook-deliveries/{id}:
    get:
      operationId: getWebhookDelivery
      summary: The JSON body a delivery sends
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The event body, content: { application/json: { schema: { type: object } } } }
        "404": { description: No such delivery, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/webhook-deliveries/{id}/retry:
    post:
      operationId: retryWebhookDelivery
      summary: Send a delivered or failed delivery again (within 30 seconds)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Queued }
        "400": { description: No finished delivery with that id, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/admin/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys (secrets are never returned)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      summary: Generate an API key for the public API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
              required: [name]
      responses:
        "201":
          description: The new key, including the secret `key` (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"

  /api/v1/admin/api-keys/{id}:
    patch:
      operationId: renameApiKey
      summary: Rename an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        "200":
          description: Renamed key
    delete:
      operationId: deleteApiKey
      summary: Revoke (delete) an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found

  /api/v1/admin/api-keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      summary: Replace a key's secret; the old secret stops working immediately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The key with its new secret (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List users who can sign in
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, description: "2-64 letters, digits, '.', '_' or '-'; unique, case-insensitive" }
                password: { type: string, format: password, minLength: 10 }
                role: { type: string, enum: [admin, reader], default: reader }
              required: [username, password]
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username, password or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateUser
      summary: Change a user's role, status or password
      description: >
        Fields left out are unchanged. A new password ends the user's
        sessions (for your own account: all but the current one); disabling
        ends them too. You can't demote, disable or delete yourself, and the
        last enabled admin can't be demoted, disabled or deleted (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, reader] }
                disabled: { type: boolean }
                password: { type: string, format: password, minLength: 10 }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      summary: Delete a user and their sessions
      responses:
        "204":
          description: Deleted
        "400":
          description: Your own account, or the last enabled admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{username}/logout:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: logoutUser
      summary: End a user's sessions (for yourself, all but the current one)
      responses:
        "200":
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions_ended: { type: integer, format: int64 }
                required: [sessions_ended]
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/sessions:
    get:
      operationId: listSessions
      summary: List active sign-in sessions, most recently used first
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
  /api/v1/admin/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeSession
      summary: End one session
      responses:
        "204":
          description: Ended
        "404":
          description: No such session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Public API access settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiSettings"
    patch:
      operationId: updateSettings
      summary: Update public API access settings (omitted fields are unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicApiSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiSettings"

  /api/v1/admin/watch-formats:
    get:
      operationId: listWatchFormatsAdmin
      tags: [Tracking]
      summary: The premium-format taxonomy, retired formats included
      description: >
        The list users pick from leaves retired formats out; this one keeps
        them, because watches logged with one still carry it.
      responses:
        "200":
          description: Every format, in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  formats:
                    type: array
                    items: { $ref: "public.yaml#/components/schemas/WatchFormat" }
    post:
      operationId: createWatchFormat
      tags: [Tracking]
      summary: Add a premium format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, label, category]
              properties:
                slug:
                  type: string
                  description: >
                    Lowercase words joined by hyphens, e.g. imax-70mm. It
                    never changes once set, because watches reference it.
                label: { type: string }
                category:
                  type: string
                  enum: [brand, projection, sound, motion, dimension, disc, label]
                  description: >
                    The axis this format sits on. Keeping the axes apart is
                    what makes "all my 70mm screenings" or "IMAX hours"
                    answerable, rather than one flat list of names.
                note: { type: string, nullable: true }
                sort_order: { type: integer }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: The new format
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/WatchFormat" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A format with that slug already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/watch-formats/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateWatchFormat
      tags: [Tracking]
      summary: Edit or retire a premium format
      description: >
        The slug is fixed. A format is retired by setting active to false,
        never deleted: it stays on every watch that already carries it, and
        only disappears from the list users pick from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                category: { type: string, enum: [brand, projection, sound, motion, dimension, disc, label] }
                note: { type: string, nullable: true }
                sort_order: { type: integer }
                active: { type: boolean }
                logo_display: { type: string, enum: [original, mono], description: "original colours, or mono: clients draw the logo white" }
      responses:
        "200":
          description: The updated format
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/WatchFormat" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/watch-formats/{id}/logo:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: putWatchFormatLogo
      tags: [Tracking]
      summary: Upload or replace a format's logo
      description: >
        The body is the image itself, at most 512 KB. Its type is worked out
        from the bytes, not the Content-Type header: PNG, JPEG, WebP or GIF of
        at most 4096 pixels a side, or a UTF-8 SVG of drawing elements and
        plain CSS (Illustrator and Inkscape exports pass), with no script,
        embedded image, event handler, CSS @-rule or link outside the file.
        Fully transparent edges of a PNG or single-frame GIF are trimmed (the
        result is stored as PNG), so a logo on a big empty canvas isn't drawn
        tiny.
        The returned format's logo_url carries a content hash, so a new
        upload is a new URL.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The format, with its new logo_url (pointing at the admin copy of the logo route)
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/WatchFormat" }
        "400":
          description: Not an accepted image, or too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteWatchFormatLogo
      tags: [Tracking]
      summary: Remove a format's logo
      responses:
        "200":
          description: The format, without a logo_url
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/WatchFormat" }
        "404":
          description: No such format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues:
    get:
      operationId: listVenuesAdmin
      tags: [Tracking]
      summary: Search cinemas (console Cinemas page)
      description: >
        The admin copy of GET /api/v1/me/venues: the same shared venue list
        users add cinemas to while logging a watch.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Name or city }
        - { name: country, in: query, required: false, schema: { type: string } }
        - { name: include_closed, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Matching cinemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues: { type: array, items: { $ref: "public.yaml#/components/schemas/Venue" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createVenueAdmin
      tags: [Tracking]
      summary: Add a cinema
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "public.yaml#/components/schemas/VenueInput" }
      responses:
        "201":
          description: The cinema
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenuePage" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Already stored under the same outside id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getVenueAdmin
      tags: [Tracking]
      summary: A cinema with its screens, former names, outside ids and watch count
      responses:
        "200":
          description: The cinema
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenuePage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateVenueAdmin
      tags: [Tracking]
      summary: Correct a cinema
      description: >
        Replaces the cinema's optional fields (send them all). Watches keep
        the name and city they were logged with, so a rename never rewrites
        a diary. Close a cinema with status closed and closed_on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "public.yaml#/components/schemas/VenueInput" }
      responses:
        "200":
          description: The cinema
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenuePage" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteVenueAdmin
      tags: [Tracking]
      summary: Delete a cinema nobody has watched at
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Watches happened here; set status closed instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues/{id}/aliases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: addVenueAliasAdmin
      tags: [Tracking]
      summary: Record a former name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                from_date: { type: string, format: date }
                to_date: { type: string, format: date }
      responses:
        "201":
          description: The former name
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenueAlias" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues/{id}/aliases/{alias_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: alias_id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteVenueAliasAdmin
      tags: [Tracking]
      summary: Remove a former name
      responses:
        "204": { description: Removed }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues/{id}/screens:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: createScreenAdmin
      tags: [Tracking]
      summary: Add a screen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "public.yaml#/components/schemas/ScreenInput" }
      responses:
        "201":
          description: The screen
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenueScreen" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/venues/{id}/screens/{screen_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: screen_id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: updateScreenAdmin
      tags: [Tracking]
      summary: Correct a screen (replaces its optional fields)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "public.yaml#/components/schemas/ScreenInput" }
      responses:
        "200":
          description: The screen
          content:
            application/json:
              schema: { $ref: "public.yaml#/components/schemas/VenueScreen" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteScreenAdmin
      tags: [Tracking]
      summary: Delete a screen
      description: Watches logged in it keep their screen size and shape but lose the link.
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: metareel_session
      description: Session cookie set by POST /api/v1/auth/login (admin role)
    BearerSession:
      type: http
      scheme: bearer
      description: 'A session token from POST /api/v1/auth/login (mrs_...), as "Authorization: Bearer <token>"'
  parameters:
    ScheduleIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RunIdParam:
      name: run_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 50
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0

  schemas:
    PatchTitleIDsInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv_show]
          description: What the title is, i.e. the TMDB namespace of tmdb_id
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rt_url:
          type: string
          nullable: true

    NetflixTitle:
      type: object
      properties:
        id: { type: integer, format: int64 }
        show_title: { type: string }
        kind: { type: string, enum: [movie, tv_show], description: "Netflix's list (Films / TV)" }
        tmdb_kind: { type: string, enum: [movie, tv], nullable: true, description: "TMDB namespace of tmdb_id; can differ from the list" }
        netflix_id: { type: string, nullable: true, description: "Netflix's title ID, from Tudum's Top 10 search" }
        tmdb_id: { type: string, nullable: true }
        imdb_id: { type: string, nullable: true }
        match_status: { type: string, enum: [pending, matched, unmatched, manual] }
        match_source: { type: string, nullable: true, description: "e.g. flixpatrol_title, netflix_title, wikidata_netflix, justwatch_netflix, justwatch_netflix_other_kind, tmdb_netflix, tmdb_netflix_alt_title, justwatch_unique_name, manual" }
        match_attempts: { type: integer }
        next_match_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        tmdb_title: { type: string, nullable: true }
        tmdb_year: { type: integer, nullable: true }
        flixpatrol:
          type: object
          nullable: true
          description: The FlixPatrol title it was matched through
          properties:
            title_id: { type: integer, format: int64 }
            slug: { type: string }
            name: { type: string }
        last_week: { type: string, format: date, nullable: true }
        weeks_in_global_top10: { type: integer }
        best_global_rank: { type: integer, nullable: true }
        seasons: { type: integer, description: Season titles (TV) }
        seasons_unmapped: { type: integer, description: "Season titles without a season number (0 when mapped to a TMDB movie)" }
        flixpatrol_links: { type: integer, description: Linked FlixPatrol titles }

    TmdbMappingLink:
      type: object
      description: A title of the other source linked to a mapped title
      properties:
        source: { type: string, enum: [flixpatrol, netflix] }
        id: { type: integer, format: int64 }
        name: { type: string }
        tmdb_kind: { type: string, enum: [movie, tv], nullable: true }
        tmdb_id: { type: string, nullable: true }
        match_status: { type: string }
        conflict: { type: boolean, description: Mapped to a different TMDB title }

    TmdbMapping:
      type: object
      properties:
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        poster_path: { type: string, nullable: true }
        last_seen: { type: string, format: date, nullable: true }
        ids: { $ref: "public.yaml#/components/schemas/TitleExternalIDs" }
        conflicts: { type: integer }
        cross_kind: { type: integer }
        manual: { type: integer }
        flixpatrol_titles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              slug: { type: string }
              name: { type: string }
              page_kind: { type: string, enum: [movie, tv_show], nullable: true }
              match_status: { type: string }
              match_source: { type: string, nullable: true }
              last_ranked_on: { type: string, format: date, nullable: true }
              links: { type: array, items: { $ref: "#/components/schemas/TmdbMappingLink" } }
        netflix_titles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              show_title: { type: string }
              list: { type: string, enum: [movie, tv_show] }
              match_status: { type: string }
              match_source: { type: string, nullable: true }
              last_week: { type: string, format: date, nullable: true }
              links: { type: array, items: { $ref: "#/components/schemas/TmdbMappingLink" } }

    MappingRef:
      type: object
      properties:
        tmdb_kind: { type: string, enum: [movie, tv], nullable: true }
        tmdb_id: { type: string, nullable: true }
        tmdb_title: { type: string, nullable: true }
        imdb_id: { type: string, nullable: true }
        wikidata_id: { type: string, nullable: true }
        rt_slug: { type: string, nullable: true, example: m/bugonia }
        metacritic_slug: { type: string, nullable: true, example: movie/bugonia }
        letterboxd_slug: { type: string, nullable: true }
        justwatch_id: { type: string, nullable: true }
        netflix_id: { type: string, nullable: true, description: "The TMDB title's Netflix ID, else the Netflix title's own" }
        flixpatrol_title_id: { type: integer, format: int64, nullable: true }
        flixpatrol_slug: { type: string, nullable: true }
        flixpatrol_name: { type: string, nullable: true }
        flixpatrol_kind: { type: string, enum: [movie, tv_show], nullable: true, description: "FlixPatrol's title page, else its chart" }
        flixpatrol_match_status: { type: string, nullable: true }
        netflix_title_id: { type: integer, format: int64, nullable: true }
        netflix_title: { type: string, nullable: true }
        netflix_kind: { type: string, enum: [movie, tv_show], nullable: true, description: "Netflix's list: movie (Films) or tv_show (TV)" }
        netflix_title_netflix_id: { type: string, nullable: true, description: "The Netflix title's own Netflix ID (Tudum)" }
        netflix_match_status: { type: string, nullable: true }

    NetflixTitleDetail:
      allOf:
        - $ref: "#/components/schemas/NetflixTitle"
        - type: object
          properties:
            ids:
              allOf: [{ $ref: "public.yaml#/components/schemas/TitleExternalIDs" }]
              nullable: true
              description: Every ID of its TMDB title, with sources (the same as the TMDB mapping's); null while unmapped. netflix_id above is this title's own.
            linked_titles:
              type: array
              description: FlixPatrol titles linked to it (same name, same Netflix list, same or adjacent week); they share one mapping
              items:
                type: object
                properties:
                  title_id: { type: integer, format: int64 }
                  slug: { type: string }
                  name: { type: string }
                  kind: { type: string, enum: [movie, tv_show], description: TMDB namespace }
                  tmdb_id: { type: string, nullable: true }
                  match_status: { type: string }
            season_titles:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, format: int64, description: "For PATCH /netflix/seasons/{id}" }
                  season_title: { type: string, example: "Wednesday: Season 2" }
                  season_number: { type: integer, nullable: true }
                  season_source:
                    type: string
                    nullable: true
                    enum: [parsed, tmdb_name, number, tmdb_air_date, tmdb_single, manual]
                  weeks_in_global_top10: { type: integer }
                  best_global_rank: { type: integer, nullable: true }
                  total_views: { type: integer }
                  total_hours_viewed: { type: integer }
                  first_week: { type: string, format: date, nullable: true }
                  last_week: { type: string, format: date, nullable: true }
                  countries: { type: integer }
                  netflix_id: { type: string, nullable: true, description: The season's own Netflix ID }
            tmdb_seasons:
              type: array
              description: TMDB's seasons of the matched show (season 0 = specials)
              items:
                type: object
                properties:
                  season_number: { type: integer }
                  name: { type: string }
                  air_date: { type: string, format: date }
                  episode_count: { type: integer }
            global_weeks:
              type: array
              items:
                type: object
                properties:
                  week: { type: string, format: date }
                  category: { type: string }
                  rank: { type: integer }
                  season_title: { type: string, nullable: true }
                  season_number: { type: integer, nullable: true }
                  views: { type: integer, nullable: true }
                  hours_viewed: { type: integer, nullable: true }
                  cumulative_weeks: { type: integer, nullable: true }
            countries:
              type: array
              items:
                type: object
                properties:
                  country: { type: string }
                  weeks: { type: integer }
                  best_rank: { type: integer }
                  first_week: { type: string, format: date }
                  last_week: { type: string, format: date }

    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string }, description: 'Event types, or ["*"] for all' }
        enabled: { type: boolean }
        last_delivery_at: { type: string, format: date-time, nullable: true }
