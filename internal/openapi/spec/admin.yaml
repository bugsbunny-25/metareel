openapi: 3.0.3
info:
  title: metareel Admin API
  version: "1.0.0"
servers:
  - url: /
paths:
  /api/v1/admin/task-schedules:
    get:
      operationId: listTaskSchedules
      summary: List task schedules
      parameters:
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
        - name: task_type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of task schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskScheduleListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTaskSchedule
      summary: Create a task schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskScheduleInput"
      responses:
        "200":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}:
    get:
      operationId: getTaskScheduleById
      summary: Get task schedule by ID
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "200":
          description: Task schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchTaskSchedule
      summary: Update a task schedule
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskScheduleInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/run-now:
    post:
      operationId: runTaskScheduleNow
      summary: Enqueue a schedule to run immediately
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A run of this schedule is already queued, running or retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/runs:
    get:
      operationId: listTaskRunsByScheduleId
      summary: List task runs for a schedule (paged)
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Task runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-schedules/{id}/flixpatrol-targets:
    post:
      operationId: addFlixPatrolTargets
      summary: Add FlixPatrol targets to a schedule
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFlixPatrolTargetsInput"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskScheduleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs:
    get:
      operationId: listTaskRuns
      summary: List task runs (paged, newest first; the total is in the X-Total-Count header)
      parameters:
        - name: task_type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [started, succeeded, partial, failed]
        - name: schedule_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Task runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs/{run_id}:
    get:
      operationId: getTaskRunById
      summary: Get task run by ID
      parameters:
        - $ref: "#/components/parameters/RunIdParam"
      responses:
        "200":
          description: Task run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/task-runs/{run_id}/logs:
    get:
      operationId: listTaskRunLogsByRunId
      summary: List task run logs
      parameters:
        - $ref: "#/components/parameters/RunIdParam"
      responses:
        "200":
          description: Task run logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskRunLogResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: Dashboard summary (run counts, schedule health, mapping coverage)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                description: >
                  schedules {total, enabled}; runs {running, last_24h, last_7d}
                  (counts by status); schedule_health [{schedule_id, name,
                  enabled, utc_runtimes, next_run_at, last_run, last_success_at}];
                  titles {total, missing_tmdb, missing_imdb, missing_rt};
                  rankings {total, latest_date}

  /api/v1/admin/task-types:
    get:
      operationId: listTaskTypes
      summary: Job types a schedule can run, with descriptions
      responses:
        "200":
          description: Task types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    label: { type: string }
                    description: { type: string }
                    has_targets: { type: boolean }

  /api/v1/admin/jobs/{type}/run:
    post:
      operationId: runJob
      summary: Run a job now, outside its schedule
      description: >
        Any task type except flixpatrol.top10.scrape (use a schedule's run-now
        or /backfill). title_ids limits titles.enrich to those titles and
        ignores their retry backoff; force re-imports unchanged files.
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, example: titles.enrich }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title_ids: { type: array, items: { type: integer, format: int64 }, maxItems: 500 }
                force: { type: boolean }
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The same job is already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/backfill:
    post:
      operationId: backfill
      summary: Scrape FlixPatrol charts for past dates
      description: >
        One ad-hoc run over every date in [from, to] (at most 60 days) for a
        schedule's targets or the given targets. Charts already stored are
        skipped unless force.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_id: { type: integer, format: int64 }
                targets:
                  type: array
                  items:
                    $ref: "#/components/schemas/FlixPatrolTargetPayload"
                from: { type: string, format: date }
                to: { type: string, format: date }
                force: { type: boolean }
              required: [from]
      responses:
        "202":
          description: Enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTaskNowResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/titles/{id}/rematch:
    post:
      operationId: rematchTitle
      summary: Match a title again now
      description: >
        Clears the retry backoff (and a manual lock) and queues titles.enrich
        for the title. clear=true also forgets its current IDs (wrong match).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clear: { type: boolean }
      responses:
        "202":
          description: Queued; returns the title and the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { $ref: "public.yaml#/components/schemas/TitleResponse" }
                  job: { $ref: "#/components/schemas/RunTaskNowResponse" }
        "404":
          description: Title not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/data-quality:
    get:
      operationId: getDataQuality
      summary: How complete and fresh the data is
      description: >
        Match status counts (FlixPatrol and Netflix titles), TMDB metadata and
        IMDb dataset coverage, last imports, weekly share of chart entries
        with a TMDB / RT match, unmatched titles by country, stale charts and
        missing dates in the last 30 days per scheduled chart.
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/admin/titles/{id}:
    patch:
      operationId: patchTitle
      summary: Correct a title's kind and external IDs
      description: >
        Admin only. A title corrected here is marked as a manual match, so
        scheduled scrapes and remap jobs never overwrite it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTitleIDsInput"
      responses:
        "200":
          description: Updated title
          content:
            application/json:
              schema:
                $ref: "public.yaml#/components/schemas/TitleResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/titles/{id}/candidates:
    get:
      operationId: getTitleCandidates
      summary: Suggest TMDB / IMDb / Rotten Tomatoes matches for a title
      description: Searches JustWatch, TMDB (needs TMDB_API_KEY) and Rotten Tomatoes by name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: name
          in: query
          required: false
          schema: { type: string, description: "Default: the title's name" }
        - name: year
          in: query
          required: false
          schema: { type: integer, description: "Default: the slug's year suffix" }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [movie, tv_show] }
      responses:
        "200":
          description: Candidates per provider (justwatch, tmdb, rotten_tomatoes) and any provider errors
        "404":
          description: Title not found

  /api/v1/admin/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys (secrets are never returned)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      summary: Generate an API key for the public API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
              required: [name]
      responses:
        "201":
          description: The new key, including the secret `key` (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"

  /api/v1/admin/api-keys/{id}:
    patch:
      operationId: renameApiKey
      summary: Rename an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses:
        "200":
          description: Renamed key
    delete:
      operationId: deleteApiKey
      summary: Revoke (delete) an API key
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found

  /api/v1/admin/api-keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      summary: Replace a key's secret; the old secret stops working immediately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The key with its new secret (shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySecret"

  /api/v1/admin/settings:
    get:
      operationId: getSettings
      summary: Public API access settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiSettings"
    patch:
      operationId: updateSettings
      summary: Update public API access settings (omitted fields are unchanged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicApiSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiSettings"

components:
  parameters:
    ScheduleIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RunIdParam:
      name: run_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 50
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0

  schemas:
    PatchTitleIDsInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv_show]
          description: What the title is, i.e. the TMDB namespace of tmdb_id
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rt_url:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

    FlixPatrolTargetPayload:
      type: object
      additionalProperties: false
      properties:
        country_code:
          type: string
        provider_slug:
          type: string
      required: [country_code, provider_slug]

    TaskScheduleResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        task_type:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        max_retries:
          type: integer
          format: int64
        request_delay_seconds:
          type: integer
          format: int64
        respect_robots:
          type: boolean
        user_agent:
          type: string
        backfill_days:
          type: integer
          minimum: 0
          maximum: 60
          description: FlixPatrol schedules only - also scrape charts missing from the previous N days
        recheck_hours:
          type: integer
          minimum: 0
          maximum: 23
          description: >
            FlixPatrol schedules only - when a chart looks unpublished (same as
            the previous stored date) re-check hourly for this many hours
            before storing it anyway
        utc_runtimes:
          type: array
          items:
            type: string
        flixpatrol_targets:
          type: array
          items:
            $ref: "#/components/schemas/FlixPatrolTargetPayload"
      required:
        - id
        - task_type
        - name
        - enabled
        - max_retries
        - request_delay_seconds
        - respect_robots
        - user_agent
        - utc_runtimes

    TaskScheduleListResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        task_type:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        utc_runtimes:
          type: array
          items:
            type: string
      required: [id, task_type, name, enabled, utc_runtimes]

    CreateTaskScheduleInput:
      type: object
      additionalProperties: false
      properties:
        task_type:
          type: string
          enum: [flixpatrol.top10.scrape, titles.enrich, titles.metadata, ratings.prewarm, netflix.top10.import, imdb.ratings.import, maintenance]
          description: See GET /api/v1/admin/task-types
        name:
          type: string
        enabled:
          type: boolean
          nullable: true
        max_retries:
          type: integer
          format: int64
          nullable: true
        request_delay_seconds:
          type: integer
          format: int64
          nullable: true
        respect_robots:
          type: boolean
          nullable: true
        user_agent:
          type: string
          nullable: true
        backfill_days:
          type: integer
          minimum: 0
          maximum: 60
          description: Default 3. FlixPatrol schedules only - also scrape charts missing from the previous N days
        recheck_hours:
          type: integer
          minimum: 0
          maximum: 23
          description: >
            FlixPatrol schedules only - when a chart looks unpublished (same as
            the previous stored date) re-check hourly for this many hours
            before storing it anyway
        utc_runtimes:
          type: array
          items:
            type: string
        task_details:
          nullable: true
          description: 'FlixPatrol schedules: {"targets": [{"country_code": "US", "provider_slug": "netflix"}]}'
      required: [task_type, name, utc_runtimes]

    UpdateTaskScheduleInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        enabled:
          type: boolean
        max_retries:
          type: integer
          format: int64
          nullable: true
        request_delay_seconds:
          type: integer
          format: int64
          nullable: true
        respect_robots:
          type: boolean
          nullable: true
        user_agent:
          type: string
          nullable: true
        backfill_days:
          type: integer
          minimum: 0
          maximum: 60
          description: FlixPatrol schedules only - also scrape charts missing from the previous N days
        recheck_hours:
          type: integer
          minimum: 0
          maximum: 23
          description: >
            FlixPatrol schedules only - when a chart looks unpublished (same as
            the previous stored date) re-check hourly for this many hours
            before storing it anyway
        utc_runtimes:
          type: array
          items:
            type: string
        flixpatrol_targets:
          type: array
          description: Replaces the targets of a FlixPatrol schedule
          items:
            $ref: "#/components/schemas/FlixPatrolTargetPayload"
      required: [name, enabled, utc_runtimes]

    AddFlixPatrolTargetsInput:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              country_code:
                type: string
              provider_slug:
                type: string
            required: [country_code, provider_slug]
      required: [targets]

    RunTaskNowResponse:
      type: object
      additionalProperties: false
      properties:
        schedule_id:
          type: integer
          format: int64
        task_type:
          type: string
        queue:
          type: string
        status:
          type: string
      required: [task_type, queue, status]

    TaskRunResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        schedule_id:
          type: integer
          format: int64
          nullable: true
          description: null for ad-hoc runs (backfills, manual jobs, matching after a scrape)
        task_type:
          type: string
        asynq_task_id:
          type: string
        status:
          type: string
          enum: [started, succeeded, partial, failed]
          description: partial = some targets failed (the task is retried for those)
        retry_count:
          type: integer
          format: int64
        max_retry:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
        targets_total:
          type: integer
          description: FlixPatrol runs - chart pages (target x date) handled
        targets_succeeded:
          type: integer
        targets_failed:
          type: integer
        targets_skipped:
          type: integer
          description: Already stored, or not published yet (re-checked later)
        summary:
          type: object
          additionalProperties: true
          description: Job-specific result, e.g. per-target results of a scrape or counts of an import
      required: [id, schedule_id, task_type, status, retry_count, max_retry, started_at, targets_total, targets_succeeded, targets_failed, targets_skipped]

    TaskRunLogResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        run_id:
          type: integer
          format: int64
        level:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, run_id, level, message, created_at]

    ApiKey:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "First characters of the key, e.g. mr_Ab3dEf…" }
        created_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    ApiKeySecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            key: { type: string, description: The full key. Not stored; copy it now. }

    PublicApiSettings:
      type: object
      properties:
        require_api_key:
          type: boolean
          description: Require a key on every non-admin /api/v1 endpoint (default true)
        rate_limit_per_minute:
          type: integer
          minimum: 0
          description: Requests per minute per key (or per client IP without keys); 0 = off. Default 300.
