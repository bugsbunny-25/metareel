        titles:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [movie, tv] }
              tmdb_id: { type: string }
              title: { type: string }
              year: { type: integer, nullable: true }
              poster_path: { type: string, nullable: true }
              roles: { type: array, items: { type: string } }
              points: { type: integer }
