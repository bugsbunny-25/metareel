openapi: 3.0.3
info:
  title: metareel Public API
  version: "1.0.0"
  description: >
    Every /api/v1 endpoint needs an API key, sent as `X-API-Key: <key>` or
    `Authorization: Bearer <key>` (unless keys are turned off in the admin
    console). Keys are created and rotated in the admin console under
    Settings & API keys. Requests are rate limited per key; over the limit
    the API returns 429 with Retry-After. Missing or invalid keys get 401.
servers:
  - url: /
security:
  - ApiKeyHeader: []
  - BearerKey: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Readiness probe
      description: >
        Checks the database and Redis (required: 503 when either is down) and
        FlixPatrol's fetch backend, e.g. FlareSolverr (reported only: status
        "degraded" when down).
      responses:
        "200":
          description: Ready (status ok or degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "503":
          description: A required dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"

  /api/v1/test:
    get:
      operationId: test
      summary: Test endpoint
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /api/v1/titles:
    get:
      operationId: listTitles
      summary: List titles (paged)
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv_show]
        - name: q
          in: query
          required: false
          schema:
            type: string
            description: Name or slug substring
        - name: missing
          in: query
          required: false
          schema:
            type: string
            enum: [tmdb, imdb, rt]
            description: Only titles without this ID
        - name: match_status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, matched, unmatched, manual]
            description: Only titles in this matching state (the admin review queue uses unmatched)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id_desc, id_asc, name_asc, name_desc, updated_desc, updated_asc, last_ranked_desc, last_ranked_asc, rankings_desc, rankings_asc]
            description: Default id_desc (newest first)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Titles page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlesPageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/{id}:
    get:
      operationId: getTitle
      summary: Get one scraped title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/{id}/rankings:
    get:
      operationId: getTitleRankingsById
      summary: Ranking history of one scraped title (mapped to TMDB or not)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/rankings:
    get:
      operationId: getTitleRankings
      summary: Ranking history of one title, looked up by TMDB ID
      description: >
        Every Top 10 chart appearance of the title, oldest first, plus a
        per-chart summary. All FlixPatrol titles mapped to the TMDB ID are
        included. Returns 404 if no scraped title is mapped to the TMDB ID.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: TMDB ID (numeric)
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No title mapped to this TMDB ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/ratings:
    get:
      operationId: getTitleRatings
      summary: IMDb and Rotten Tomatoes ratings of a title, looked up by TMDB ID
      description: >
        Served from the database when refreshed within RATINGS_TTL (12h by
        default), otherwise refreshed from JustWatch, MDBList (when
        MDBLIST_API_KEY is set) and Rotten Tomatoes' own search index. Rotten
        Tomatoes scores come from RT directly when it has a match (by stored
        slug, MDBList's RT link, or a title + year search), else from MDBList /
        JustWatch. Every rating each provider returned is listed in sources.
        If a refresh fails, the previous ratings are returned with stale=true.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: TMDB ID (numeric)
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            description: Refresh from the providers even if the stored ratings are fresh
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No provider knows this TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Every provider failed and nothing was stored yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/rankings:
    get:
      operationId: getTitleRankingsBatch
      summary: Ranking history of several titles, looked up by TMDB ID
      description: >
        Batch version of getTitleRankings. Items come back in request order;
        IDs with no mapped title are listed in not_found.
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
            example: movie:425,tv:154385
            description: Comma-separated kind:tmdb_id pairs (kind is movie or tv), at most 50
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking histories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsBatchResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/new/{country}/{service}:
    get:
      operationId: getNewTitles
      summary: Titles added to a streaming service, per day (live from JustWatch)
      description: >
        One JustWatch query per day from `from` to `to` (default: the last 7
        days, at most 31). Newest day first. Seasons are listed under their
        show. Nothing is stored.
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            description: ISO country code (e.g. US)
        - name: service
          in: path
          required: true
          schema:
            type: string
            description: >
              FlixPatrol slug (netflix, hbo-max, disney, amazon-prime,
              paramount-plus, peacock, apple-tv; resolved to the country's
              JustWatch code) or any JustWatch package short / technical name
              from /api/v1/services/{country} (e.g. nfx, ppa)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
            description: 2-letter language for titles, descriptions and genres
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Default today (UTC)
      responses:
        "200":
          description: New titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/upcoming/{country}/{service}:
    get:
      operationId: getUpcomingTitles
      summary: Titles announced for a streaming service (live from JustWatch)
      description: >
        Soonest first. date is the title's release date on this service
        (digital release preferred), not its theatrical or original premiere.
        Titles without a date on the service come last, and only when no
        from / to range is given. Nothing is stored.
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            description: ISO country code (e.g. US)
        - name: service
          in: path
          required: true
          schema:
            type: string
            description: >
              FlixPatrol slug (netflix, hbo-max, disney, amazon-prime,
              paramount-plus, peacock, apple-tv; resolved to the country's
              JustWatch code) or any JustWatch package short / technical name
              from /api/v1/services/{country} (e.g. nfx, ppa)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
            description: 2-letter language for titles, descriptions and genres
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Earliest release date on the service
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Latest release date on the service
      responses:
        "200":
          description: Upcoming titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/services/{country}:
    get:
      operationId: listServices
      summary: Streaming services JustWatch knows in a country
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/movies/{country}:
    get:
      operationId: getTop10MoviesAllProviders
      summary: Get Top 10 movies across all providers
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/movies/{country}/{provider}:
    get:
      operationId: getTop10MoviesByProvider
      summary: Get Top 10 movies for a provider
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/tv-shows/{country}:
    get:
      operationId: getTop10TVShowsAllProviders
      summary: Get Top 10 TV shows across all providers
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/tv-shows/{country}/{provider}:
    get:
      operationId: getTop10TVShowsByProvider
      summary: Get Top 10 TV shows for a provider
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/{country}:
    get:
      operationId: getCountryTop10
      summary: Every provider's movie and TV Top 10 of a country in one response
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Charts (each provider's latest chart unless date is given)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Combined"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/top10/global/{provider}:
    get:
      operationId: getGlobalTop10
      summary: A provider's titles ranked across every country by chart points
      description: >
        Points are FlixPatrol-style (rank 1 = 10 points … rank 10 = 1) summed
        over every stored country chart of the day. Titles mapped to the same
        TMDB title are one entry.
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Leaderboard of one day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/top10/movies/{country}/{provider}/history:
    get:
      operationId: getMovieChartHistory
      summary: One movie chart over a date range
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      description: Defaults to the last 7 days; at most 92 days. Only stored dates are listed.
      responses:
        "200":
          description: Chart per stored date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/top10/tv-shows/{country}/{provider}/history:
    get:
      operationId: getTVChartHistory
      summary: One TV chart over a date range
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      description: Defaults to the last 7 days; at most 92 days. Only stored dates are listed.
      responses:
        "200":
          description: Chart per stored date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/charts:
    get:
      operationId: listCharts
      summary: Every stored chart with its date range and freshness
      parameters:
        - name: country
          in: query
          schema: { type: string, description: ISO country code }
        - name: provider
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Chart catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCatalogResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/charts/{country}/{provider}/dates:
    get:
      operationId: listChartDates
      summary: Dates stored for a chart, newest first
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/CategoryQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 366 }
      responses:
        "200":
          description: Stored dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string }
                  provider: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        category: { type: string, enum: [movies, tv_shows] }
                        entries: { type: integer }
                        scraped_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/changes:
    get:
      operationId: listChartChanges
      summary: Charts stored or re-scraped after a time (poll this instead of every chart)
      description: >
        Pass the response's `next` as `since` on the next call. Default since:
        24 hours ago.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time, example: "2026-10-09T12:00:00Z" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Changed charts, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartChangesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/availability/changes:
    get:
      operationId: listAvailabilityChanges
      summary: Titles that arrived on or left a service (across titles)
      description: >-
        Watch provider changes observed since `since` (default: 7 days ago),
        newest first, with the TMDB title. See the per-title
        `/availability/history` for how changes are detected.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time, example: "2026-11-01T00:00:00Z" }
        - name: country
          in: query
          schema: { type: string, example: US }
        - name: event
          in: query
          schema: { type: string, enum: [added, removed] }
        - name: monetization
          in: query
          schema: { type: string, enum: [flatrate, free, ads, rent, buy] }
        - name: provider_id
          in: query
          description: TMDB watch provider ID (e.g. 8 = Netflix)
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Offer changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  since: { type: string, format: date-time }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OfferEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/movers:
    get:
      operationId: getMovers
      summary: Climbers, fallers, debuts, re-entries and exits of a chart
      description: >
        Compares the chart on `date` (default: the latest stored date) with
        the stored date before it. Debuts are titles not on the chart in the
        previous 90 days.
      parameters:
        - name: country
          in: query
          required: true
          schema: { type: string }
        - name: provider
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Movers per category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoversResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/breakouts:
    get:
      operationId: getBreakouts
      summary: Titles rising in the Top 10 in several countries at once
      description: >-
        Compares each chart's latest stored date (on `date`, or the day before
        when today's chart isn't stored yet) with its stored date `window`
        days earlier (or the closest stored date up to 7 days before that). A
        title is rising on a chart when it entered it since then, or climbed
        at least `min_climb` places; per country its best chart counts. A
        breakout rises in at least `min_countries` countries. Sorted by rising
        countries, then score (chart points gained, rank 1 = 10 ... rank 10 =
        1). Stale charts (latest date more than a day before `date`) are left
        out; `countries_checked` lists the countries that could be compared.
        Webhooks can subscribe to `title.breakout` (admin API) to get each new
        breakout with the default settings.
      parameters:
        - $ref: "#/components/parameters/DateParam"
        - name: window
          in: query
          description: Days to compare over (1 to 14)
          schema: { type: integer, minimum: 1, maximum: 14, default: 3 }
        - name: min_countries
          in: query
          description: Countries a title must be rising in
          schema: { type: integer, minimum: 1, maximum: 250, default: 2 }
        - name: min_climb
          in: query
          description: Places a title already on a chart must climb to count as rising
          schema: { type: integer, minimum: 1, maximum: 9, default: 3 }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Breakouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/leaderboards:
    get:
      operationId: getLeaderboard
      summary: Titles ranked by chart points over a period
      description: >
        Points per chart per day: rank 1 = 10 … rank 10 = 1. Omit country /
        provider to sum over all. period=week (default) is the 7 days ending
        on `date` (default: the current chart date); custom uses from/to (at
        most 366 days).
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, custom], default: week }
        - $ref: "#/components/parameters/DateParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/export/rankings:
    get:
      operationId: exportRankings
      summary: Chart entries over a range as CSV or NDJSON
      description: Defaults to the last 30 days; at most 366 days.
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - name: format
          in: query
          schema: { type: string, enum: [csv, ndjson], default: csv }
      responses:
        "200":
          description: >
            Columns / fields: date, country, provider, category, rank,
            season_number, title_id, slug, name, kind, tmdb_id, imdb_id,
            season_source (chart | netflix | tmdb_air_date)
          content:
            text/csv: {}
            application/x-ndjson: {}
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/countries:
    get:
      operationId: listCountries
      summary: Countries FlixPatrol charts can be scraped for
      responses:
        "200":
          description: Countries by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, example: US }
                    slug: { type: string, example: united-states }
                    name: { type: string }

  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Chart providers and the countries they have stored charts in
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string, example: netflix }
                    countries: { type: array, items: { type: string } }

  /api/v1/search:
    get:
      operationId: searchTitles
      summary: Find titles by name
      description: >-
        Searches every title metareel has chart data for (one result per TMDB
        title) by any name it goes by: TMDB's title and original title, and
        the FlixPatrol and Netflix Top 10 names mapped to it. Case, accents
        and punctuation are ignored and words may be prefixes ("strang thin"
        finds Stranger Things). Results are ordered by match quality (`score`:
        100 the whole name, 85 the name starts with the query, 70 / 60 every
        word starts a word of the name in / out of order, 40 the query inside
        the name), then by when the title last charted.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: kind
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching titles, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [movie, tv] }
                        tmdb_id: { type: string }
                        title: { type: string }
                        original_title: { type: string }
                        year: { type: integer }
                        poster_path: { type: string }
                        matched: { type: string, description: The name that matched }
                        sources: { type: array, items: { type: string, enum: [flixpatrol, netflix] } }
                        last_charted: { type: string, format: date }
                        score: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/lookup:
    get:
      operationId: lookupTitle
      summary: Find a title by IMDb ID, TMDB ID, FlixPatrol slug or Netflix ID
      parameters:
        - name: imdb
          in: query
          schema: { type: string, example: tt12300742 }
        - name: tmdb
          in: query
          schema: { type: string, example: "movie:701387" }
        - name: slug
          in: query
          schema: { type: string, example: bugonia }
        - name: netflix
          in: query
          schema: { type: string, example: "81231974", description: "Netflix title ID (netflix.com/title/<id>), from Wikidata or Tudum's Top 10" }
      description: Give exactly one of imdb, tmdb, slug or netflix.
      responses:
        "200":
          description: TMDB titles and FlixPatrol titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [movie, tv] }
                        tmdb_id: { type: string }
                  flixpatrol_titles:
                    type: array
                    items: { $ref: "#/components/schemas/RankedTitle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/ratings:
    get:
      operationId: getTitleRatingsBatch
      summary: Ratings of several titles, looked up by TMDB ID
      description: >
        Stored ratings within RATINGS_TTL are returned as is; up to 10 expired
        or unrated titles per request are refreshed from the providers. Titles
        still without ratings are listed in missing (the ratings pre-warm job
        keeps charting titles fresh).
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string, example: "movie:425,tv:154385", description: At most 50 kind:tmdb_id pairs }
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RatingsResponse" }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/tmdb/{kind}/{id}:
    get:
      operationId: getTitleOverview
      summary: Everything about a title in one call
      description: >
        TMDB metadata, chart stats, current chart positions, ratings, where to
        watch and Netflix's official numbers. `include` picks sections
        (default: all). Ratings may be refreshed from the providers if expired.
        Sections that fail are named in `errors`; the rest are still returned.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: include
          in: query
          schema: { type: string, example: "metadata,stats,current,ratings,availability,netflix" }
        - name: country
          in: query
          schema: { type: string, description: Limit availability and current positions to a country }
      responses:
        "200":
          description: Title overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleOverview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/stats:
    get:
      operationId: getTitleStats
      summary: Chart performance of a title
      description: >
        Points, days on charts, peak rank, days at #1, debut, longest streak
        and how it spread across countries.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleStats"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/availability:
    get:
      operationId: getTitleAvailability
      summary: Where a title can be watched, per country (TMDB, data by JustWatch)
      description: >-
        Watch providers per country, grouped by monetization. Each provider has
        `url`, the title's page on that service (e.g. https://www.netflix.com/title/81231974),
        when JustWatch lists it; `link` per country is TMDB's watch page for the
        title. Stored by the titles.metadata job, refreshed with the providers.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: country
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Offers per country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: TMDB metadata not fetched yet (needs TMDB_API_KEY and the metadata job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/availability/history:
    get:
      operationId: getTitleAvailabilityHistory
      summary: When a title arrived on or left each service, per country
      description: >-
        Watch provider offers that appeared (`added`) or disappeared
        (`removed`) between two TMDB refreshes of the title (titles.metadata,
        charting titles every 3 days). The change happened after
        `previous_check_at` and by `observed_at` (UTC). A title's first
        refresh is the baseline and records nothing. Newest first, up to 500.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: country
          in: query
          schema: { type: string, example: US }
      responses:
        "200":
          description: Offer changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  tmdb_id: { type: string }
                  country: { type: string, nullable: true }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OfferEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/history:
    get:
      operationId: getTitleHistory
      summary: A title's ratings and TMDB popularity over time
      description: >-
        `imdb` (IMDb's daily dataset) and `ratings` (per provider and source,
        from ratings refreshes) hold a point whenever a value changed, so each
        is a step function; the first point may be before `from` (the value in
        effect at `from`). `popularity` has a point per day of TMDB's daily
        export (tmdb.popularity.import), `wikipedia` the English article's daily
        views (wikipedia.pageviews.import, 90 days back on its first import).
        History starts when this version was deployed. Default range: the last 90 days; at most 366 days.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/timeline:
    get:
      operationId: getTitleTimeline
      summary: A title's dated events from every source, newest first
      description: >-
        One feed of what happened to a title. Chart events per chart (country
        x provider x category): `chart_debut`, `chart_peak` (first day at its
        best rank, when after the debut; `days` = days after the debut),
        `chart_number_one` (a run of days at #1; `days` = length) and
        `chart_reentry` (back after at least 7 days away, only when the chart
        was stored without the title in between; `days` = days away).
        `availability_added` / `availability_removed`: watch provider changes,
        one event per day, provider and offer type with every country.
        `rating_changed`: a rating source's displayed value changed (one
        decimal on 0-10 scales, whole numbers on 0-100; the first value is the
        baseline; IMDb from IMDb's dataset when known, other sources from
        Rotten Tomatoes, then MDBList, then JustWatch).
        `pageview_spike`: days in a row with at least 1,000 English Wikipedia
        views and 3x the median of the previous 28 days.
        `netflix_top10_week`: a week (and season) in Netflix's global or
        country Top 10s. `netflix_engagement`: a "What We Watched" report row.
        `season_premiere` (may be upcoming), `release` (movie release / TV
        first air date) and `netflix_premiere` (Netflix originals) from TMDB
        and Netflix's reports. Spans (`end_date`) are kept when they overlap
        `from`..`to`. `country` limits charts, availability and Netflix weeks
        (adding `country_rank`); the other events are worldwide and always
        kept. Exactly one detail object is set per event, by type group.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: types
          in: query
          description: Comma-separated event types (default all)
          schema: { type: string, example: "chart_debut,chart_number_one,availability_added" }
        - name: country
          in: query
          schema: { type: string, example: US }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: Newest events to return (default 200, also used for 0; at most 1000); `total` counts all matches
          schema: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleTimelineResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title (no metadata and no chart entries)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/calendar/{country}:
    get:
      operationId: getCalendar
      summary: Upcoming episodes of shows streamable in a country
      description: >-
        Episodes airing between `from` and `to` (default: today and the next 13
        days; at most 62 days) of the TV shows metareel knows that have a
        subscription, free or ad-supported offer in the country (TMDB, data by
        JustWatch). One entry per show, season and date, so a binge release is
        one entry with every episode. Air dates are TMDB's (usually the
        original network or service release, not per country), and offers are
        the show's current ones in the country. Episodes are refreshed by the
        tmdb.episodes.refresh job (airing shows daily).
      parameters:
        - name: country
          in: path
          required: true
          schema: { type: string, example: US }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: provider_id
          in: query
          description: Only shows with an offer from this TMDB watch provider (e.g. 8 = Netflix)
          schema: { type: integer }
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/tmdb/{kind}/{id}/netflix:
    get:
      operationId: getTitleNetflix
      summary: A title's weeks in Netflix's official Top 10
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
      responses:
        "200":
          description: Global and per-country weeks
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  tmdb_id: { type: string }
                  weeks_in_global_top10: { type: integer }
                  best_global_rank: { type: integer, nullable: true }
                  total_views: { type: integer }
                  total_hours_viewed: { type: integer }
                  countries: { type: array, items: { type: string } }
                  seasons: { type: array, items: { $ref: "#/components/schemas/NetflixSeasonSummary" } }
                  global: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }
                  country_weeks: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }
                  engagement:
                    type: array
                    description: >-
                      The title's rows in Netflix's "What We Watched" engagement reports
                      (every title watched 50k+ hours in a six-month period), newest
                      period first; release_date is given for Netflix originals only.
                    items:
                      type: object
                      properties:
                        period_start: { type: string, format: date }
                        period_end: { type: string, format: date }
                        kind: { type: string, enum: [movie, tv_show] }
                        title: { type: string }
                        available_globally: { type: boolean, nullable: true }
                        release_date: { type: string, format: date }
                        hours_viewed: { type: integer, nullable: true }
                        runtime_minutes: { type: integer, nullable: true }
                        views: { type: integer, nullable: true }
                        season_number: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/top10:
    get:
      operationId: getNetflixGlobalTop10
      summary: Netflix's official global weekly Top 10
      description: >
        Imported from https://www.netflix.com/tudum/top10. Weeks run Monday to
        Sunday; `week` may be any date in the week (default: the latest).
      parameters:
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema: { type: string, enum: ["Films (English)", "Films (Non-English)", "TV (English)", "TV (Non-English)"] }
      responses:
        "200":
          description: Week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixWeekResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/top10/{country}:
    get:
      operationId: getNetflixCountryTop10
      summary: Netflix's official weekly Top 10 of a country
      description: Only countries imported (NETFLIX_TOP10_COUNTRIES) are available.
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema: { type: string, enum: [Films, TV] }
      responses:
        "200":
          description: Week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixWeekResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/most-popular:
    get:
      operationId: getNetflixMostPopular
      summary: Netflix's all-time most popular lists (views in the first 91 days)
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        rank: { type: integer }
                        show_title: { type: string }
                        season_title: { type: string, nullable: true }
                        season_number: { type: integer, nullable: true }
                        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
                        hours_viewed_first_91_days: { type: integer, nullable: true }
                        runtime_hours: { type: number, nullable: true }
                        views_first_91_days: { type: integer, nullable: true }
                        kind: { type: string }
                        tmdb_id: { type: string, nullable: true }
                        imdb_id: { type: string, nullable: true }
                        netflix_title_id: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/analytics/decay:
    get:
      operationId: getDecay
      summary: How titles fade after debuting on a chart
      description: >
        Follows every chart debut in the range (default: last 60 days) for 30
        days: retention (share still charting) and average rank per day since
        debut. Days whose chart was not stored are not counted.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Decay curve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/country-similarity:
    get:
      operationId: getCountrySimilarity
      summary: Which countries watch alike (overlap of charting titles)
      description: Jaccard overlap of each pair of countries' charting titles in the range (default 30 days).
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Country pairs, most similar first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/release-lag:
    get:
      operationId: getReleaseLag
      summary: Days from release to first chart appearance
      description: >
        Uses the title's digital release date in the chart's country from TMDB
        when known, else TMDB's release / first air date. Needs TMDB metadata
        (titles.metadata job). Range default: last 90 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Per-title lags with median / quartiles overall and per provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/ratings-vs-popularity:
    get:
      operationId: getRatingsVsPopularity
      summary: Chart points against IMDb and Rotten Tomatoes ratings
      description: >
        Pearson correlation of points with IMDb rating (IMDb dataset first,
        then stored provider ratings) and RT critics score, plus acclaimed but
        under-watched (IMDb ≥ 7.5, points below median) and popular but poorly
        rated (top-quartile points, IMDb < 6) lists. Only stored ratings are
        used. Range default: last 30 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Titles with points and ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/genres:
    get:
      operationId: getGenres
      summary: Chart points by TMDB genre
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Genres by points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/origins:
    get:
      operationId: getOrigins
      summary: Each service's chart points by origin (original, in-house, licensed)
      description: >-
        Splits every provider's chart points (rank 1 = 10 … rank 10 = 1) by
        where the titles come from: `original` (made for the service: its own
        network, its studio, or a film it released with no theatrical studio
        involved), `in_house` (the parent company's studios and channels,
        e.g. a Marvel film on Disney+, a CBS show on Paramount+), `licensed`
        (another company or an independent) and `unknown` (no TMDB metadata,
        or nothing says who made it). Computed from TMDB networks and
        production companies and Wikidata distributors, per week or month,
        with the owners of licensed titles (`suppliers`) and the top titles of
        each origin. Charts of different providers are separate, so compare
        shares rather than points across providers. Default range: the last
        90 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: interval
          in: query
          schema: { type: string, enum: [week, month], default: week }
      responses:
        "200":
          description: Origin mix per provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/release-patterns:
    get:
      operationId: getReleasePatterns
      summary: How long TV seasons stay in the Top 10 by release pattern (binge, batch, weekly)
      description: >-
        Classifies each TV season premiering between `from` and `to` (default:
        the last 365 days) by its TMDB episode air dates: `binge` (every
        episode on one day), `batch` (2 to 4 drops averaging 2+ episodes, e.g.
        volumes), `weekly` (drops 5 to 9 days apart, median), `daily` (at most
        2 days apart) or `irregular`. Then measures each chart run (season x
        FlixPatrol TV chart) over `window` days from the premiere: days in the
        Top 10, the last day charting, best rank and points, aggregated per
        pattern. A chart counts only when stored from the premiere to the end of
        the window; the window stops before the next season premieres; rankings
        count when tagged with the season or untagged. Seasons with unaired
        episodes, a single episode, no chart run yet (`in_progress`) or none at
        all (`uncharted`) are counted in `excluded`. Only shows metareel knows
        (charting titles) have episodes, and TMDB air dates are the original
        release, not per country.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - name: window
          in: query
          description: Days after each premiere to measure (30 to 180)
          schema: { type: integer, minimum: 30, maximum: 180, default: 60 }
      responses:
        "200":
          description: Release patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasePatternsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/spread-lag:
    get:
      operationId: getSpreadLag
      summary: How quickly titles spread from the country they first chart in to others
      description: >-
        A title's debut is its first FlixPatrol chart appearance in any
        country between `from` and `to` (default: the last 90 days, at most
        180), with none
        from 30 days before `from`; the countries it charted in that day are
        its origins. Every other country is followed for `window` days: the
        lag is the days until the title first charts there. A country counts
        for a title only when its charts were stored for the 30 days before
        the debut, and a title debuting in a country without that history is
        left out (an earlier appearance could be missing). `country` keeps titles that
        debuted there; `provider`, `category` and `kind` filter the charts and
        titles. Countries are only those metareel scrapes.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - name: country
          in: query
          description: Only titles that debuted in this country (ISO 3166-1 alpha-2)
          schema: { type: string }
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: window
          in: query
          description: Days after the debut to follow the other countries (7 to 90)
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        "200":
          description: Spread lag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadLagResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/netflix-calibration:
    get:
      operationId: getNetflixCalibration
      summary: Netflix's official weekly views against FlixPatrol Netflix chart points
      description: >
        For each Netflix global Top 10 entry, the FlixPatrol Netflix chart
        points the same title earned that week (in `country`, or summed over
        countries), with Pearson r and the median views per point. Range
        default: last 84 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Calibration rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    BearerKey:
      type: http
      scheme: bearer
      description: 'The same API key, as "Authorization: Bearer <key>"'
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TmdbIDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: TMDB ID (numeric)
    CategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum: [movies, tv_shows]
        description: Omit for both
    KindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [movie, tv_show]
        description: What the title is (can differ from the chart's category)
    ProviderQuery:
      name: provider
      in: query
      required: false
      schema:
        type: string
        description: Provider slug; omit for all
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Range start (YYYY-MM-DD); ranges are at most 366 days
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Range end (YYYY-MM-DD); default the current chart date
    CountryParam:
      name: country
      in: path
      required: true
      schema:
        type: string
        description: ISO country code (e.g. US)
    ProviderParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        description: Provider slug
    DateParam:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
        description: >
          Chart date in YYYY-MM-DD. Omit for the latest scraped chart; on the
          all-providers endpoints that is each provider's own latest chart
          (see the per-item date).
    TmdbKindParam:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [movie, tv]
        description: TMDB namespace of the ID
    HistoryCountryParam:
      name: country
      in: query
      required: false
      schema:
        type: string
        description: ISO country code (e.g. US); omit for all countries
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        description: First chart date to include (YYYY-MM-DD)
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Last chart date to include (YYYY-MM-DD)

  schemas:
    ChartTitle:
      type: object
      properties:
        title_id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [movie, tv_show] }
        tmdb_id: { type: string, nullable: true }
        imdb_id: { type: string, nullable: true }

    Top10Combined:
      type: object
      properties:
        country: { type: string }
        movies: { type: array, items: { $ref: "#/components/schemas/Top10Result" } }
        tv_shows: { type: array, items: { $ref: "#/components/schemas/Top10Result" } }
        dates:
          type: object
          additionalProperties: { type: string, format: date }
          description: Chart date served per provider

    ChartCatalogResponse:
      type: object
      properties:
        current_chart_date: { type: string, format: date, description: The chart date FlixPatrol shows now }
        items:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              provider: { type: string }
              category: { type: string, enum: [movies, tv_shows] }
              first_date: { type: string, format: date }
              latest_date: { type: string, format: date }
              dates: { type: integer }
              last_scraped_at: { type: string, format: date-time, nullable: true }
              stale: { type: boolean, description: Latest stored date is older than the previous chart date }

    ChartHistoryResponse:
      type: object
      properties:
        country: { type: string }
        provider: { type: string }
        category: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/ChartTitle"
                    - type: object
                      properties:
                        rank: { type: integer }
                        season_number: { type: integer, nullable: true }
                        season_source: { $ref: "#/components/schemas/RankingSeasonSource" }

    ChartChangesResponse:
      type: object
      properties:
        since: { type: string, format: date-time }
        next: { type: string, format: date-time, description: Pass as since to continue }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              date: { type: string, format: date }
              country: { type: string }
              provider: { type: string }
              category: { type: string }
              entries: { type: integer }
              scraped_at: { type: string, format: date-time }
              changed_at: { type: string, format: date-time, description: Last time the chart's content changed }

    Mover:
      allOf:
        - $ref: "#/components/schemas/ChartTitle"
        - type: object
          properties:
            category: { type: string }
            rank: { type: integer, nullable: true, description: null for exits }
            previous_rank: { type: integer, nullable: true, description: null for debuts and re-entries }
            change: { type: integer, description: Positions climbed (negative = fell) }

    MoversResponse:
      type: object
      properties:
        country: { type: string }
        provider: { type: string }
        charts:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              date: { type: string, format: date }
              previous_date: { type: string, format: date, nullable: true }
              climbers: { type: array, items: { $ref: "#/components/schemas/Mover" } }
              fallers: { type: array, items: { $ref: "#/components/schemas/Mover" } }
              debuts: { type: array, items: { $ref: "#/components/schemas/Mover" } }
              re_entries: { type: array, items: { $ref: "#/components/schemas/Mover" } }
              exits: { type: array, items: { $ref: "#/components/schemas/Mover" } }

    BreakoutsResponse:
      type: object
      properties:
        date: { type: string, format: date }
        window: { type: integer }
        min_countries: { type: integer }
        min_climb: { type: integer }
        category: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        countries_checked: { type: array, items: { type: string }, description: Countries with a current chart that could be compared }
        total: { type: integer, description: Breakouts before the limit }
        items:
          type: array
          items: { $ref: "#/components/schemas/Breakout" }
    Breakout:
      allOf:
        - $ref: "#/components/schemas/ChartTitle"
        - type: object
          properties:
            rising_countries: { type: integer }
            charting_countries: { type: array, items: { type: string }, description: Countries where it is on a chart on its latest date, rising or not }
            score: { type: integer, description: Chart points gained over the rising countries }
            countries:
              type: array
              description: Rising countries, biggest gain first (the best chart per country)
              items:
                type: object
                properties:
                  country: { type: string }
                  provider: { type: string }
                  category: { type: string, enum: [movies, tv_shows] }
                  date: { type: string, format: date, description: The chart's latest stored date }
                  base_date: { type: string, format: date, description: The stored date compared with }
                  rank: { type: integer }
                  base_rank: { type: integer, nullable: true, description: null when not on the chart on base_date }
                  movement: { type: string, enum: [entered, climbed] }
                  gain: { type: integer, description: Chart points gained }

    LeaderboardResponse:
      type: object
      properties:
        period: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ChartTitle"
              - type: object
                properties:
                  position: { type: integer }
                  points: { type: integer }
                  days_on_charts: { type: integer }
                  appearances: { type: integer, description: Chart × date entries }
                  best_rank: { type: integer }
                  countries: { type: array, items: { type: string } }
                  providers: { type: array, items: { type: string } }
                  slugs: { type: array, items: { type: string }, description: FlixPatrol titles merged into this TMDB title }

    ChartMoment:
      type: object
      properties:
        date: { type: string, format: date }
        country: { type: string }
        provider: { type: string }
        category: { type: string }
        rank: { type: integer }

    TitleStats:
      type: object
      properties:
        kind: { type: string }
        tmdb_id: { type: string }
        titles: { type: array, items: { $ref: "#/components/schemas/RankedTitle" } }
        total_points: { type: integer }
        days_on_charts: { type: integer }
        appearances: { type: integer }
        peak_rank: { type: integer, nullable: true }
        days_at_number_1: { type: integer }
        debut: { $ref: "#/components/schemas/ChartMoment" }
        last_seen: { $ref: "#/components/schemas/ChartMoment" }
        longest_streak_days: { type: integer }
        countries: { type: array, items: { type: string } }
        providers: { type: array, items: { type: string } }
        spread:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              first_date: { type: string, format: date }
              days_after_debut: { type: integer }
        charts: { type: array, items: { $ref: "#/components/schemas/ChartSummary" } }

    WatchProvider:
      type: object
      properties:
        country: { type: string }
        monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
        provider_id: { type: integer }
        provider_name: { type: string }
        logo_path: { type: string, nullable: true, description: "TMDB image path (https://image.tmdb.org/t/p/w92{logo_path})" }
        display_priority: { type: integer, nullable: true }
        url:
          type: string
          nullable: true
          description: "The title's page on this service (JustWatch's link; may carry JustWatch's affiliate tag). Null when JustWatch has no matching offer."
          example: https://www.netflix.com/title/81231974
        link: { type: string, nullable: true, description: "Always null here; see the country's link" }
        fetched_at: { type: string, format: date-time }

    OriginInfo:
      type: object
      description: >-
        Where a title on this provider's chart comes from (see
        /api/v1/analytics/origins). `owner` is the media group the title
        belongs to (netflix, amazon, apple, disney, wbd, nbcu, paramount,
        sony, lionsgate, a24; absent = independent or not recognised);
        `reason` is the brand that decided it.
      properties:
        origin: { type: string, enum: [original, in_house, licensed, unknown] }
        owner: { type: string, example: wbd }
        reason: { type: string, example: "network: HBO" }
    CalendarResponse:
      type: object
      properties:
        country: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        provider_id: { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              air_date: { type: string, format: date }
              tmdb_id: { type: string }
              title: { type: string }
              poster_path: { type: string, nullable: true }
              season_number: { type: integer }
              season_premiere: { type: boolean, description: Includes episode 1 }
              season_finale: { type: boolean, description: "Includes TMDB's finale episode" }
              episodes:
                type: array
                items:
                  type: object
                  properties:
                    episode_number: { type: integer }
                    name: { type: string }
                    episode_type: { type: string, description: "TMDB: standard | finale | mid_season" }
                    runtime: { type: integer, description: Minutes }
              offers:
                type: array
                description: The show's subscription, free and ad-supported offers in the country
                items:
                  type: object
                  properties:
                    provider_id: { type: integer }
                    provider_name: { type: string }
                    monetization: { type: string, enum: [flatrate, free, ads] }
                    url: { type: string }
    ReleasePatternsResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        window_days: { type: integer }
        patterns:
          type: array
          items:
            type: object
            properties:
              pattern: { type: string, enum: [binge, batch, weekly, daily, irregular] }
              seasons: { type: integer }
              chart_runs: { type: integer, description: Season x chart pairs with at least one day in the Top 10 }
              median_days_in_top10: { type: number }
              mean_days_in_top10: { type: number }
              median_last_day: { type: number, description: Days from the premiere to the last day in the Top 10 }
              share_still_charting_day_28: { type: number, description: Share of chart runs still in the Top 10 on or after day 28 }
              median_best_rank: { type: number }
              median_points: { type: number, description: "Chart points per run (rank 1 = 10 ... rank 10 = 1)" }
        seasons:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [tv] }
              tmdb_id: { type: string }
              title: { type: string }
              season_number: { type: integer }
              pattern: { type: string }
              premiere: { type: string, format: date }
              last_episode: { type: string, format: date }
              episodes: { type: integer }
              drops: { type: integer, description: Release dates }
              charts: { type: integer }
              median_days_in_top10: { type: number }
              median_last_day: { type: number }
              best_rank: { type: integer }
        excluded:
          type: object
          properties:
            unaired: { type: integer }
            single: { type: integer }
            in_progress: { type: integer }
            uncharted: { type: integer }
    LagSummary:
      type: object
      properties:
        titles: { type: integer }
        median_days: { type: number, nullable: true }
        p25_days: { type: number, nullable: true }
        p75_days: { type: number, nullable: true }
    SpreadArrival:
      type: object
      properties:
        country: { type: string }
        provider: { type: string, description: Chart of the first appearance (best rank that day) }
        category: { type: string, enum: [movies, tv_shows] }
        first_date: { type: string, format: date }
        lag_days: { type: integer, description: Days after the debut (0 = an origin) }
        rank: { type: integer }
    SpreadLagResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        window: { type: integer }
        titles: { type: integer, description: Debuts in the range with at least one other country followed }
        multi_country: { type: integer, description: Titles that charted in two or more countries within the window }
        simultaneous: { type: integer, description: Titles that debuted in several countries on the same day }
        summary:
          allOf:
            - $ref: "#/components/schemas/LagSummary"
          description: Lags of every arrival after the first country (0 for the extra origins of a simultaneous debut)
        countries:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              origin: { type: integer, description: Titles that debuted here (alone or with other countries) }
              arrived: { type: integer, description: Titles that charted here after debuting elsewhere, within the window }
              arrival_lag: { $ref: "#/components/schemas/LagSummary" }
              not_reached: { type: integer, description: Titles followed here for the whole window that never charted }
        pairs:
          type: array
          description: Routes from a single-origin debut country to another country
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              reached: { type: integer }
              not_reached: { type: integer }
              lag: { $ref: "#/components/schemas/LagSummary" }
        items_total: { type: integer }
        items:
          type: array
          description: Titles that charted in two or more countries, newest debut first (at most 200)
          items:
            allOf:
              - $ref: "#/components/schemas/ChartTitle"
              - type: object
                properties:
                  debut_date: { type: string, format: date }
                  origins: { type: array, items: { type: string } }
                  arrivals: { type: array, items: { $ref: "#/components/schemas/SpreadArrival" } }
                  not_reached: { type: array, items: { type: string } }
                  pending: { type: array, items: { type: string }, description: Not charted yet; the window is not over }
    OriginsResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        interval: { type: string, enum: [week, month] }
        providers:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              points: { type: integer }
              origins:
                type: object
                description: original, in_house, licensed, unknown
                additionalProperties:
                  type: object
                  properties:
                    points: { type: integer }
                    share: { type: number, description: "of the provider's points" }
                    titles: { type: integer }
              series:
                type: array
                items:
                  type: object
                  properties:
                    period: { type: string, format: date, description: "first day of the week (Monday) or month" }
                    points: { type: integer }
                    shares: { type: object, additionalProperties: { type: number } }
              suppliers:
                type: array
                description: Owners of licensed titles by points
                items:
                  type: object
                  properties:
                    owner: { type: string, description: '"" = independent or not recognised' }
                    name: { type: string }
                    points: { type: integer }
                    share: { type: number, description: "of the provider's licensed points" }
                    titles: { type: integer }
              top:
                type: object
                description: Up to 5 titles per origin
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      kind: { type: string }
                      tmdb_id: { type: string }
                      points: { type: integer }
                      owner: { type: string }
                      reason: { type: string }
    OfferEvent:
      type: object
      properties:
        id: { type: integer }
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, description: "TMDB title (feed only)" }
        release_date: { type: string, description: "feed only" }
        poster_path: { type: string, description: "feed only" }
        country: { type: string }
        monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
        provider_id: { type: integer }
        provider_name: { type: string }
        event: { type: string, enum: [added, removed] }
        previous_check_at: { type: string, description: "UTC YYYY-MM-DD HH:MM:SS; the change happened after this" }
        observed_at: { type: string, description: "UTC YYYY-MM-DD HH:MM:SS; the change was seen at this refresh" }
    RatingPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
        votes: { type: integer, nullable: true }
    TitleTimelineResponse:
      type: object
      properties:
        kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        country: { type: string, nullable: true }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        total: { type: integer, description: Matching events before the limit }
        counts:
          type: object
          description: Matching events per type
          additionalProperties: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
    TimelineEvent:
      type: object
      required: [type, date, summary]
      properties:
        type:
          type: string
          enum: [chart_debut, chart_peak, chart_number_one, chart_reentry, availability_added, availability_removed,
            rating_changed, pageview_spike, netflix_top10_week, netflix_engagement, season_premiere, release, netflix_premiere]
        date: { type: string, format: date, description: "UTC; a span's first day" }
        end_date: { type: string, format: date, description: "A span's last day (#1 runs, spikes, Netflix weeks, report periods)" }
        summary: { type: string, example: "Debuted at #3 on netflix TV shows (US)" }
        chart:
          type: object
          description: chart_* events
          properties:
            country: { type: string }
            provider: { type: string }
            category: { type: string, enum: [movies, tv_shows] }
            rank: { type: integer }
            season_number: { type: integer }
            days: { type: integer, description: "chart_number_one: days at #1; chart_peak: days after the debut; chart_reentry: days away" }
        availability:
          type: object
          description: availability_* events
          properties:
            provider_id: { type: integer }
            provider_name: { type: string }
            monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
            countries: { type: array, items: { type: string } }
        rating:
          type: object
          description: rating_changed
          properties:
            provider: { type: string, example: imdb_dataset }
            source: { type: string, example: imdb }
            value: { type: number }
            previous_value: { type: number, description: The previous displayed (rounded) value }
            votes: { type: integer }
        pageviews:
          type: object
          description: pageview_spike
          properties:
            peak_day: { type: string, format: date }
            peak_views: { type: integer }
            baseline_views: { type: integer, description: Median daily views of the 28 days before the spike }
            ratio: { type: number }
            days: { type: integer }
        netflix:
          type: object
          description: netflix_top10_week (date = Monday, end_date = week = Sunday)
          properties:
            week: { type: string, format: date }
            category: { type: string }
            global_rank: { type: integer, nullable: true, description: null when only in country lists that week }
            season_title: { type: string }
            season_number: { type: integer }
            hours_viewed: { type: integer }
            views: { type: integer }
            cumulative_weeks: { type: integer }
            countries: { type: integer, description: Country Top 10s it was in that week }
            country_rank: { type: integer, description: Rank in the requested country }
        engagement:
          type: object
          description: netflix_engagement
          properties:
            period_start: { type: string, format: date }
            period_end: { type: string, format: date }
            title: { type: string }
            hours_viewed: { type: integer, nullable: true }
            views: { type: integer, nullable: true }
            runtime_minutes: { type: integer, nullable: true }
            season_number: { type: integer }
            available_globally: { type: boolean, nullable: true }
        season:
          type: object
          description: season_premiere
          properties:
            season_number: { type: integer }
            name: { type: string }
            episode_count: { type: integer }
    TitleHistoryResponse:
      type: object
      properties:
        kind: { type: string }
        tmdb_id: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        imdb:
          type: object
          nullable: true
          properties:
            imdb_id: { type: string }
            points:
              type: array
              items: { $ref: "#/components/schemas/RatingPoint" }
        ratings:
          type: array
          items:
            type: object
            properties:
              provider: { type: string, example: rottentomatoes }
              source: { type: string, example: tomatoes }
              points:
                type: array
                items: { $ref: "#/components/schemas/RatingPoint" }
        popularity:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              popularity: { type: number }
        wikipedia:
          type: object
          nullable: true
          description: Daily user views of the title's English Wikipedia article (null without one)
          properties:
            article: { type: string }
            url: { type: string }
            points:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  views: { type: integer }
    AvailabilityResponse:
      type: object
      properties:
        kind: { type: string }
        tmdb_id: { type: string }
        country: { type: string, nullable: true }
        fetched_at: { type: string, format: date-time }
        attribution: { type: string }
        countries:
          type: object
          additionalProperties:
            type: object
            properties:
              link: { type: string, nullable: true, description: "TMDB's watch page for the title in this country" }
              flatrate: { type: array, items: { $ref: "#/components/schemas/WatchProvider" } }
              free: { type: array, items: { $ref: "#/components/schemas/WatchProvider" } }
              ads: { type: array, items: { $ref: "#/components/schemas/WatchProvider" } }
              rent: { type: array, items: { $ref: "#/components/schemas/WatchProvider" } }
              buy: { type: array, items: { $ref: "#/components/schemas/WatchProvider" } }

    TmdbMetadata:
      type: object
      properties:
        tmdb_kind: { type: string }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        original_title: { type: string, nullable: true }
        original_language: { type: string, nullable: true }
        overview: { type: string, nullable: true }
        status: { type: string, nullable: true }
        release_date: { type: string, nullable: true }
        last_air_date: { type: string, nullable: true }
        runtime: { type: integer, nullable: true }
        number_of_seasons: { type: integer, nullable: true }
        number_of_episodes: { type: integer, nullable: true }
        genres: { type: array, items: { type: string } }
        origin_countries: { type: array, items: { type: string } }
        production_companies: { type: array, items: { type: string } }
        networks: { type: array, items: { type: string } }
        poster_path: { type: string, nullable: true }
        backdrop_path: { type: string, nullable: true }
        popularity: { type: number, nullable: true }
        vote_average: { type: number, nullable: true }
        vote_count: { type: integer, nullable: true }
        digital_release_dates: { type: object, additionalProperties: { type: string } }
        imdb_id: { type: string, nullable: true }
        wikidata_id: { type: string, nullable: true }
        rotten_tomatoes_id: { type: string, nullable: true }
        metacritic_id: { type: string, nullable: true }
        letterboxd_id: { type: string, nullable: true }
        netflix_id: { type: string, nullable: true, description: "Netflix title ID (netflix.com/title/<id>)" }
        justwatch_id: { type: string, nullable: true, description: "e.g. tm1504418 / ts475500" }
        details_fetched_at: { type: string, format: date-time, nullable: true }
        seasons:
          type: array
          description: TV only, TMDB's seasons (season 0 = specials)
          items:
            type: object
            properties:
              season_number: { type: integer }
              name: { type: string }
              air_date: { type: string, format: date }
              episode_count: { type: integer }

    TitleOverview:
      type: object
      properties:
        kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        flixpatrol_titles: { type: array, items: { $ref: "#/components/schemas/RankedTitle" } }
        metadata: { $ref: "#/components/schemas/TmdbMetadata" }
        stats: { $ref: "#/components/schemas/TitleStats" }
        current_positions: { type: array, items: { $ref: "#/components/schemas/ChartMoment" } }
        ratings: { $ref: "#/components/schemas/RatingsResponse" }
        availability: { $ref: "#/components/schemas/AvailabilityResponse" }
        netflix:
          type: object
          properties:
            weeks_in_global_top10: { type: integer }
            best_global_rank: { type: integer, nullable: true }
            total_views: { type: integer }
            total_hours_viewed: { type: integer }
            countries: { type: array, items: { type: string } }
            seasons: { type: array, items: { $ref: "#/components/schemas/NetflixSeasonSummary" } }
        ids: { $ref: "#/components/schemas/TitleExternalIDs" }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Sections that could not be loaded

    TitleExternalIDs:
      type: object
      description: >
        Every known ID of a TMDB title, each from the strongest source that
        has one (manual > tmdb > wikidata > match > netflix; see sources),
        plus the FlixPatrol slugs and Netflix Top 10 names mapped to it.
        netflix = the Netflix ID of a Netflix Top 10 title mapped to it
        (Tudum's Top 10 search), used only while no other source has one.
      properties:
        imdb_id: { type: string, nullable: true, example: tt13443470 }
        wikidata_id: { type: string, nullable: true, example: Q105553568 }
        rotten_tomatoes_id: { type: string, nullable: true, example: tv/wednesday }
        netflix_id: { type: string, nullable: true, example: "81231974" }
        justwatch_id: { type: string, nullable: true, example: ts307468 }
        metacritic_id: { type: string, nullable: true }
        letterboxd_id: { type: string, nullable: true }
        flixpatrol_slugs: { type: array, items: { type: string } }
        netflix_top10_titles: { type: array, items: { type: string }, description: "Names in Netflix's official Top 10" }
        sources:
          type: object
          description: "Where each ID came from, keyed by imdb, wikidata, rotten_tomatoes, metacritic, letterboxd, netflix, justwatch (IDs with a recorded source)"
          additionalProperties: { type: string, enum: [manual, tmdb, wikidata, match, netflix] }
          example: { imdb: tmdb, wikidata: wikidata, netflix: wikidata }

    NetflixWeekRow:
      type: object
      properties:
        week: { type: string, format: date, description: Sunday the Monday–Sunday week ends on }
        country: { type: string }
        category: { type: string }
        rank: { type: integer }
        show_title: { type: string }
        season_title: { type: string, nullable: true }
        season_number: { type: integer, nullable: true, description: TMDB season number of season_title (TV) }
        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
        hours_viewed: { type: integer, nullable: true }
        runtime_hours: { type: number, nullable: true }
        views: { type: integer, nullable: true }
        cumulative_weeks: { type: integer, nullable: true }
        kind: { type: string, description: "movie | tv_show: the TMDB namespace of tmdb_id when mapped (a special in the TV list can be a movie), else Netflix's list" }
        tmdb_id: { type: string, nullable: true }
        imdb_id: { type: string, nullable: true }
        netflix_title_id: { type: integer, format: int64 }

    NetflixSeasonSource:
      type: string
      nullable: true
      description: >
        How season_number was found. parsed - the season title says it
        ("Season 2", "S3", "Limited Series"); tmdb_name - it names a TMDB
        season; number - "Part 2", "Volume 4", "Stranger Things 5";
        tmdb_air_date - the TMDB season that aired just before it charted;
        tmdb_single - the show has one season; manual - set by an admin.
      enum: [parsed, tmdb_name, number, tmdb_air_date, tmdb_single, manual]

    RankingSeasonSource:
      type: string
      description: >
        How a TV ranking's season_number was found. chart - the chart name
        said so; netflix - the best-ranked season of the show in Netflix's
        official Top 10 that week (the country's list, else global; Netflix
        charts only); tmdb_air_date - the latest season TMDB lists as aired
        by that date.
      enum: [chart, netflix, tmdb_air_date]

    NetflixSeasonSummary:
      type: object
      properties:
        season_number: { type: integer, nullable: true }
        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
        season_title: { type: string }
        weeks_in_global_top10: { type: integer }
        best_global_rank: { type: integer, nullable: true }
        total_views: { type: integer }
        total_hours_viewed: { type: integer }
        first_week: { type: string, format: date }
        last_week: { type: string, format: date }
        countries: { type: integer, description: Countries whose Top 10 it entered (imported countries only) }

    NetflixWeekResponse:
      type: object
      properties:
        week: { type: string, format: date }
        country: { type: string, nullable: true }
        category: { type: string, nullable: true }
        items: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }

    AnalyticsResult:
      type: object
      description: >
        Every analytics response echoes the resolved filter (from, to, country,
        provider, category, kind) plus endpoint-specific fields; see the
        endpoint description.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
      additionalProperties: true

    ReadinessReport:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, error] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error] }
              error: { type: string }
              required: { type: boolean }

    StatusResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

    TitleResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rt_url:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        last_ranked_on:
          type: string
          format: date
          description: List responses only
        rankings_count:
          type: integer
          description: List responses only
        ids:
          $ref: "#/components/schemas/TitleExternalIDs"
          description: Every ID of its TMDB title, with sources (the same for every title mapped to it); single-title responses of mapped titles only
        netflix_links:
          type: array
          description: Netflix official Top 10 titles linked to it (they share its TMDB mapping); single-title responses only
          items:
            type: object
            properties:
              netflix_title_id: { type: integer, format: int64 }
              show_title: { type: string }
              list: { type: string, enum: [movie, tv_show] }
              tmdb_kind: { type: string, enum: [movie, tv], nullable: true }
              tmdb_id: { type: string, nullable: true }
              match_status: { type: string }
        match_status:
          type: string
          enum: [pending, matched, unmatched, manual]
          description: >
            pending = not tried yet; unmatched = no confident TMDB match (retried
            after 1, 3, 7, then every 30 days); manual = corrected in the admin
            console (never changed automatically)
        match_source:
          type: string
          description: justwatch_path, justwatch_search, tmdb_search, manual or legacy
        matched_name:
          type: string
        matched_year:
          type: integer
        match_attempts:
          type: integer
        next_match_at:
          type: string
          format: date-time
        justwatch_id:
          type: string
        wikidata_id:
          type: string
        flixpatrol:
          type: object
          description: What the FlixPatrol title page said (once read)
          properties:
            name: { type: string, nullable: true }
            kind: { type: string, nullable: true }
            premiere_date: { type: string, nullable: true }
            country: { type: string, nullable: true }
      required: [id, slug, name, kind, updated_at, match_status, match_attempts]

    TitlesPageResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleResponse"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
      required: [items, total, limit, offset]

    Top10Result:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Chart date of this entry
        rank:
          type: integer
          format: int64
        previous_rank:
          type: integer
          format: int64
          nullable: true
          description: >
            Rank on this chart's previous scraped date (not necessarily the
            previous calendar day); null if the title was not on that chart.
        days_in_top10:
          type: integer
          format: int64
          description: Number of dates the title has been on this chart, up to and including date
        provider:
          type: string
        title_id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [movie, tv_show]
          description: >
            What the title is (the TMDB namespace of tmdb_id). It can differ
            from the chart category, e.g. a stand-up special in the TV chart
            is a movie.
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rotten_tomatoes_url:
          type: string
          nullable: true
        season_number:
          type: integer
          description: TV only, when known
        season_source:
          $ref: "#/components/schemas/RankingSeasonSource"
        origin:
          $ref: "#/components/schemas/OriginInfo"
      required: [date, rank, previous_rank, days_in_top10, provider, slug, name, kind]

    Top10Response:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Requested date, or the newest item date when date was omitted
        country:
          type: string
        category:
          type: string
        provider:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Top10Result"
      required: [date, country, category, items]

    TitleRankingsResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv]
        tmdb_id:
          type: string
        titles:
          type: array
          description: FlixPatrol titles mapped to this TMDB ID
          items:
            $ref: "#/components/schemas/RankedTitle"
        charts:
          type: array
          description: One summary per country / provider / category the title charted on
          items:
            $ref: "#/components/schemas/ChartSummary"
        rankings:
          type: array
          description: Every chart appearance in the requested range, oldest first
          items:
            $ref: "#/components/schemas/RankingSnapshot"
      required: [kind, tmdb_id, titles, charts, rankings]

    RankedTitle:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        imdb_id:
          type: string
        rotten_tomatoes_url:
          type: string
      required: [slug, name]

    ChartSummary:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        provider:
          type: string
        category:
          type: string
        days_in_top10:
          type: integer
          format: int64
          description: Dates on this chart within the requested range
        best_rank:
          type: integer
          format: int64
        first_date:
          type: string
          format: date
        last_date:
          type: string
          format: date
        last_rank:
          type: integer
          format: int64
          description: Rank on last_date
      required: [country, provider, category, days_in_top10, best_rank, first_date, last_date, last_rank]

    RankingSnapshot:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        country:
          type: string
        provider:
          type: string
        category:
          type: string
        rank:
          type: integer
          format: int64
        slug:
          type: string
        season_number:
          type: integer
          description: TV only, when known
        season_source:
          $ref: "#/components/schemas/RankingSeasonSource"
      required: [date, country, provider, category, rank, slug]

    TitleRankingsBatchResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleRankingsResponse"
        not_found:
          type: array
          description: Requested kind:tmdb_id pairs with no mapped title
          items:
            type: string
      required: [items, not_found]

    RatingsResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv]
        tmdb_id:
          type: string
        imdb_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        imdb:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IMDbRating"
        rotten_tomatoes:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RottenTomatoesRating"
        sources:
          type: array
          description: Every rating each provider returned
          items:
            $ref: "#/components/schemas/RatingSource"
        refreshed_at:
          type: string
          format: date-time
        cached:
          type: boolean
          description: Served from the database without refreshing
        stale:
          type: boolean
          description: A refresh was due but failed; the data is older than RATINGS_TTL
      required: [kind, tmdb_id, imdb_id, title, year, imdb, rotten_tomatoes, sources, refreshed_at, cached, stale]

    IMDbRating:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: number
          description: 0-10
        votes:
          type: integer
          nullable: true
        url:
          type: string
          nullable: true
        source:
          type: string
          enum: [imdb_dataset, justwatch, mdblist]
          description: >
            Provider the value came from. imdb_dataset (IMDb's own daily
            dataset, imported by the imdb.ratings.import job) wins when present.
      required: [rating, votes, url, source]

    RottenTomatoesRating:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          nullable: true
        critics_score:
          type: integer
          nullable: true
          description: Tomatometer, 0-100
        critics_rating:
          type: string
          nullable: true
          enum: [Certified Fresh, Fresh, Rotten]
        certified_fresh:
          type: boolean
          nullable: true
          description: Movies only
        critics_source:
          type: string
          nullable: true
          enum: [rottentomatoes, justwatch, mdblist]
        audience_score:
          type: integer
          nullable: true
          description: Popcornmeter, 0-100
        audience_rating:
          type: string
          nullable: true
          enum: [Upright, Spilled]
        audience_source:
          type: string
          nullable: true
          enum: [rottentomatoes, justwatch, mdblist]
      required: [url, critics_score, critics_rating, certified_fresh, critics_source, audience_score, audience_rating, audience_source]

    RatingSource:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [justwatch, mdblist, rottentomatoes, imdb_dataset]
        source:
          type: string
          description: >
            e.g. imdb, tomatoes (RT critics), popcorn (RT audience),
            tomatoes_certified (1/0), tmdb, tmdb_popularity, justwatch,
            metacritic, letterboxd, trakt, mdblist, mdblist_average
        value:
          type: number
          description: On the provider's own scale for this source
        votes:
          type: integer
        url:
          type: string
        fetched_at:
          type: string
          format: date-time
      required: [provider, source, value, fetched_at]

    ReleaseService:
      type: object
      additionalProperties: false
      properties:
        requested:
          type: string
        justwatch_package:
          type: string
          example: nfx
        name:
          type: string
          example: Netflix
      required: [requested, justwatch_package, name]

    ServicesResponse:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseService"
      required: [country, services]

    ReleasesResponse:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [new, upcoming]
        country:
          type: string
        service:
          $ref: "#/components/schemas/ReleaseService"
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        count:
          type: integer
        truncated:
          type: boolean
          description: JustWatch had more than 1000 titles for a day (new) or in total (upcoming)
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseItem"
      required: [type, country, service, from, to, count, truncated, items]

    ReleaseItem:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          nullable: true
          description: Date added to the service (new), or release date on the service (upcoming; null if not dated yet)
        kind:
          type: string
          enum: [movie, tv]
        title:
          type: string
          description: Movie title, or the show title for a season
        season_number:
          type: integer
        season_title:
          type: string
        year:
          type: integer
          nullable: true
        original_release_date:
          type: string
          format: date
          nullable: true
        tmdb_id:
          type: string
          nullable: true
          description: Movie or show TMDB ID (use with /api/v1/titles/tmdb/{movie|tv}/{id}/...)
        imdb_id:
          type: string
          nullable: true
        justwatch_id:
          type: string
        justwatch_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        runtime_minutes:
          type: integer
          nullable: true
        genres:
          type: array
          items:
            type: string
        poster_url:
          type: string
          nullable: true
        imdb_rating:
          type: number
          nullable: true
        imdb_votes:
          type: integer
          nullable: true
        tomatometer:
          type: integer
          nullable: true
        certified_fresh:
          type: boolean
          nullable: true
        offer:
          type: object
          description: New titles only
          additionalProperties: false
          properties:
            url:
              type: string
              nullable: true
              description: Deep link on the service
            monetization_type:
              type: string
              nullable: true
              example: FLATRATE
            presentation_type:
              type: string
              nullable: true
              example: HD
        release_type:
          type: string
          description: Upcoming titles only, e.g. DIGITAL
      required: [date, kind, title, year, original_release_date, tmdb_id, imdb_id, justwatch_id, justwatch_url, description, runtime_minutes, genres, poster_url, imdb_rating, imdb_votes, tomatometer, certified_fresh]
