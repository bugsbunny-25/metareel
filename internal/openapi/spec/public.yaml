        networks: { type: array, items: { type: string } }
        poster_path: { type: string, nullable: true }
        backdrop_path: { type: string, nullable: true }
        popularity: { type: number, nullable: true }
        vote_average: { type: number, nullable: true }
        vote_count: { type: integer, nullable: true }
        digital_release_dates: { type: object, additionalProperties: { type: string } }
        imdb_id: { type: string, nullable: true }
        wikidata_id: { type: string, nullable: true }
        rotten_tomatoes_id: { type: string, nullable: true }
        metacritic_id: { type: string, nullable: true }
        letterboxd_id: { type: string, nullable: true }
        netflix_id: { type: string, nullable: true, description: "Netflix title ID (netflix.com/title/<id>)" }
        justwatch_id: { type: string, nullable: true, description: "e.g. tm1504418 / ts475500" }
        details_fetched_at: { type: string, format: date-time, nullable: true }
        seasons:
          type: array
          description: TV only, TMDB's seasons (season 0 = specials)
          items:
            type: object
            properties:
              season_number: { type: integer }
              name: { type: string }
              air_date: { type: string, format: date }
              episode_count: { type: integer }

    TitleOverview:
      type: object
      properties:
        kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        flixpatrol_titles: { type: array, items: { $ref: "#/components/schemas/RankedTitle" } }
        metadata: { $ref: "#/components/schemas/TmdbMetadata" }
        stats: { $ref: "#/components/schemas/TitleStats" }
        current_positions: { type: array, items: { $ref: "#/components/schemas/ChartMoment" } }
        ratings: { $ref: "#/components/schemas/RatingsResponse" }
        availability: { $ref: "#/components/schemas/AvailabilityResponse" }
        netflix:
          type: object
          properties:
            weeks_in_global_top10: { type: integer }
            best_global_rank: { type: integer, nullable: true }
            total_views: { type: integer }
            total_hours_viewed: { type: integer }
            countries: { type: array, items: { type: string } }
            seasons: { type: array, items: { $ref: "#/components/schemas/NetflixSeasonSummary" } }
        ids: { $ref: "#/components/schemas/TitleExternalIDs" }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Sections that could not be loaded

    TitleExternalIDs:
      type: object
      description: >
        Every known ID of a TMDB title, each from the strongest source that
        has one (manual > tmdb > wikidata > match > netflix; see sources),
        plus the FlixPatrol slugs and Netflix Top 10 names mapped to it.
        netflix = the Netflix ID of a Netflix Top 10 title mapped to it
        (Tudum's Top 10 search), used only while no other source has one.
      properties:
        imdb_id: { type: string, nullable: true, example: tt13443470 }
        wikidata_id: { type: string, nullable: true, example: Q105553568 }
        rotten_tomatoes_id: { type: string, nullable: true, example: tv/wednesday }
        netflix_id: { type: string, nullable: true, example: "81231974" }
        justwatch_id: { type: string, nullable: true, example: ts307468 }
        metacritic_id: { type: string, nullable: true }
        letterboxd_id: { type: string, nullable: true }
        flixpatrol_slugs: { type: array, items: { type: string } }
        netflix_top10_titles: { type: array, items: { type: string }, description: "Names in Netflix's official Top 10" }
        sources:
          type: object
          description: "Where each ID came from, keyed by imdb, wikidata, rotten_tomatoes, metacritic, letterboxd, netflix, justwatch (IDs with a recorded source)"
          additionalProperties: { type: string, enum: [manual, tmdb, wikidata, match, netflix] }
          example: { imdb: tmdb, wikidata: wikidata, netflix: wikidata }

    NetflixWeekRow:
      type: object
      properties:
        week: { type: string, format: date, description: Sunday the Monday–Sunday week ends on }
        country: { type: string }
        category: { type: string }
        rank: { type: integer }
        show_title: { type: string }
        season_title: { type: string, nullable: true }
        season_number: { type: integer, nullable: true, description: TMDB season number of season_title (TV) }
        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
        hours_viewed: { type: integer, nullable: true }
        runtime_hours: { type: number, nullable: true }
        views: { type: integer, nullable: true }
        cumulative_weeks: { type: integer, nullable: true }
        kind: { type: string, description: "movie | tv_show: the TMDB namespace of tmdb_id when mapped (a special in the TV list can be a movie), else Netflix's list" }
        tmdb_id: { type: string, nullable: true }
        imdb_id: { type: string, nullable: true }
        netflix_title_id: { type: integer, format: int64 }

    NetflixSeasonSource:
      type: string
      nullable: true
      description: >
        How season_number was found. parsed - the season title says it
        ("Season 2", "S3", "Limited Series"); tmdb_name - it names a TMDB
        season; number - "Part 2", "Volume 4", "Stranger Things 5";
        tmdb_air_date - the TMDB season that aired just before it charted;
        tmdb_single - the show has one season; manual - set by an admin.
      enum: [parsed, tmdb_name, number, tmdb_air_date, tmdb_single, manual]

    RankingSeasonSource:
      type: string
      description: >
        How a TV ranking's season_number was found. chart - the chart name
        said so; netflix - the best-ranked season of the show in Netflix's
        official Top 10 that week (the country's list, else global; Netflix
        charts only); tmdb_air_date - the latest season TMDB lists as aired
        by that date.
      enum: [chart, netflix, tmdb_air_date]

    NetflixSeasonSummary:
      type: object
      properties:
        season_number: { type: integer, nullable: true }
        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
        season_title: { type: string }
        weeks_in_global_top10: { type: integer }
        best_global_rank: { type: integer, nullable: true }
        total_views: { type: integer }
        total_hours_viewed: { type: integer }
        first_week: { type: string, format: date }
        last_week: { type: string, format: date }
        countries: { type: integer, description: Countries whose Top 10 it entered (imported countries only) }

    NetflixWeekResponse:
      type: object
      properties:
        week: { type: string, format: date }
        country: { type: string, nullable: true }
        category: { type: string, nullable: true }
        items: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }

    AnalyticsResult:
      type: object
      description: >
        Every analytics response echoes the resolved filter (from, to, country,
        provider, category, kind) plus endpoint-specific fields; see the
        endpoint description.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
      additionalProperties: true

    ReadinessReport:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, error] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error] }
              error: { type: string }
              required: { type: boolean }

    StatusResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required: [status]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required: [username, password]

    LoginResult:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Session token (mrs_...); shown only here
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry; the session also ends after the idle timeout without use
        user:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            role:
              type: string
              enum: [admin, reader]
          required: [id, username, role]
      required: [token, expires_at, user]

    Principal:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [api_key, user]
        id:
          type: integer
          format: int64
        name:
          type: string
          description: API key name or username
        role:
          type: string
          enum: [admin, reader]
          description: Users only
      required: [kind]

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

    TitleResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rt_url:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        last_ranked_on:
          type: string
          format: date
          description: List responses only
        rankings_count:
          type: integer
          description: List responses only
        ids:
          $ref: "#/components/schemas/TitleExternalIDs"
          description: Every ID of its TMDB title, with sources (the same for every title mapped to it); single-title responses of mapped titles only
        netflix_links:
          type: array
          description: Netflix official Top 10 titles linked to it (they share its TMDB mapping); single-title responses only
          items:
            type: object
            properties:
              netflix_title_id: { type: integer, format: int64 }
              show_title: { type: string }
              list: { type: string, enum: [movie, tv_show] }
              tmdb_kind: { type: string, enum: [movie, tv], nullable: true }
              tmdb_id: { type: string, nullable: true }
              match_status: { type: string }
        match_status:
          type: string
          enum: [pending, matched, unmatched, manual]
          description: >
            pending = not tried yet; unmatched = no confident TMDB match (retried
            after 1, 3, 7, then every 30 days); manual = corrected in the admin
            console (never changed automatically)
        match_source:
          type: string
          description: justwatch_path, justwatch_search, tmdb_search, manual or legacy
        matched_name:
          type: string
        matched_year:
          type: integer
        match_attempts:
          type: integer
        next_match_at:
          type: string
          format: date-time
        justwatch_id:
          type: string
        wikidata_id:
          type: string
        flixpatrol:
          type: object
          description: What the FlixPatrol title page said (once read)
          properties:
            name: { type: string, nullable: true }
            kind: { type: string, nullable: true }
            premiere_date: { type: string, nullable: true }
            country: { type: string, nullable: true }
      required: [id, slug, name, kind, updated_at, match_status, match_attempts]

    TitlesPageResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleResponse"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
      required: [items, total, limit, offset]

    Top10Result:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Chart date of this entry
        rank:
          type: integer
          format: int64
        previous_rank:
          type: integer
          format: int64
          nullable: true
          description: >
            Rank on this chart's previous scraped date (not necessarily the
            previous calendar day); null if the title was not on that chart.
        days_in_top10:
          type: integer
          format: int64
          description: Number of dates the title has been on this chart, up to and including date
        provider:
          type: string
        title_id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [movie, tv_show]
          description: >
            What the title is (the TMDB namespace of tmdb_id). It can differ
            from the chart category, e.g. a stand-up special in the TV chart
            is a movie.
        tmdb_id:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        rotten_tomatoes_url:
          type: string
          nullable: true
        poster_path:
          type: string
          example: /x9a8tZ3cAqkR1sQpQWz6Vt1mJcE.jpg
          description: >
            TMDB poster path, not a URL; build one as
            https://image.tmdb.org/t/p/{size}{poster_path} (e.g. w342).
            Omitted until the title has TMDB metadata.
        season_number:
          type: integer
          description: TV only, when known
        season_source:
          $ref: "#/components/schemas/RankingSeasonSource"
        origin:
          $ref: "#/components/schemas/OriginInfo"
      required: [date, rank, previous_rank, days_in_top10, provider, slug, name, kind]

    Top10Response:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Requested date, or the newest item date when date was omitted
        country:
          type: string
        category:
          type: string
        provider:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Top10Result"
      required: [date, country, category, items]

    TitleRankingsResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv]
        tmdb_id:
          type: string
        titles:
          type: array
          description: FlixPatrol titles mapped to this TMDB ID
          items:
            $ref: "#/components/schemas/RankedTitle"
        charts:
          type: array
          description: One summary per country / provider / category the title charted on
          items:
            $ref: "#/components/schemas/ChartSummary"
        rankings:
          type: array
          description: Every chart appearance in the requested range, oldest first
          items:
            $ref: "#/components/schemas/RankingSnapshot"
      required: [kind, tmdb_id, titles, charts, rankings]

    RankedTitle:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        imdb_id:
          type: string
        rotten_tomatoes_url:
          type: string
      required: [slug, name]

    ChartSummary:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        provider:
          type: string
        category:
          type: string
        days_in_top10:
          type: integer
          format: int64
          description: Dates on this chart within the requested range
        best_rank:
          type: integer
          format: int64
        first_date:
          type: string
          format: date
        last_date:
          type: string
          format: date
        last_rank:
          type: integer
          format: int64
          description: Rank on last_date
      required: [country, provider, category, days_in_top10, best_rank, first_date, last_date, last_rank]

    RankingSnapshot:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        country:
          type: string
        provider:
          type: string
        category:
          type: string
        rank:
          type: integer
          format: int64
        slug:
          type: string
        season_number:
          type: integer
          description: TV only, when known
        season_source:
          $ref: "#/components/schemas/RankingSeasonSource"
      required: [date, country, provider, category, rank, slug]

    TitleRankingsBatchResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TitleRankingsResponse"
        not_found:
          type: array
          description: Requested kind:tmdb_id pairs with no mapped title
          items:
            type: string
      required: [items, not_found]

    RatingsResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [movie, tv]
        tmdb_id:
          type: string
        imdb_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        imdb:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IMDbRating"
        rotten_tomatoes:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RottenTomatoesRating"
        sources:
          type: array
          description: Every rating each provider returned
          items:
            $ref: "#/components/schemas/RatingSource"
        refreshed_at:
          type: string
          format: date-time
        cached:
          type: boolean
          description: Served from the database without refreshing
        stale:
          type: boolean
          description: A refresh was due but failed; the data is older than RATINGS_TTL
      required: [kind, tmdb_id, imdb_id, title, year, imdb, rotten_tomatoes, sources, refreshed_at, cached, stale]

    IMDbRating:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: number
          description: 0-10
        votes:
          type: integer
          nullable: true
        url:
          type: string
          nullable: true
        source:
          type: string
          enum: [imdb_dataset, justwatch, mdblist]
          description: >
            Provider the value came from. imdb_dataset (IMDb's own daily
            dataset, imported by the imdb.ratings.import job) wins when present.
      required: [rating, votes, url, source]

    RottenTomatoesRating:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          nullable: true
        critics_score:
          type: integer
          nullable: true
          description: Tomatometer, 0-100
        critics_rating:
          type: string
          nullable: true
          enum: [Certified Fresh, Fresh, Rotten]
        certified_fresh:
          type: boolean
          nullable: true
          description: Movies only
        critics_source:
          type: string
          nullable: true
          enum: [rottentomatoes, justwatch, mdblist]
        audience_score:
          type: integer
          nullable: true
          description: Popcornmeter, 0-100
        audience_rating:
          type: string
          nullable: true
          enum: [Upright, Spilled]
        audience_source:
          type: string
          nullable: true
          enum: [rottentomatoes, justwatch, mdblist]
      required: [url, critics_score, critics_rating, certified_fresh, critics_source, audience_score, audience_rating, audience_source]

    RatingSource:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [justwatch, mdblist, rottentomatoes, imdb_dataset]
        source:
          type: string
          description: >
            e.g. imdb, tomatoes (RT critics), popcorn (RT audience),
            tomatoes_certified (1/0), tmdb, tmdb_popularity, justwatch,
            metacritic, letterboxd, trakt, mdblist, mdblist_average
        value:
          type: number
          description: On the provider's own scale for this source
        votes:
          type: integer
        url:
          type: string
        fetched_at:
          type: string
          format: date-time
      required: [provider, source, value, fetched_at]

    ReleaseService:
      type: object
      additionalProperties: false
      properties:
        requested:
          type: string
        justwatch_package:
          type: string
          example: nfx
        name:
          type: string
          example: Netflix
      required: [requested, justwatch_package, name]

    ServicesResponse:
      type: object
      additionalProperties: false
      properties:
        country:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseService"
      required: [country, services]

    ReleasesResponse:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [new, upcoming]
        country:
          type: string
        service:
          $ref: "#/components/schemas/ReleaseService"
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        count:
          type: integer
        truncated:
          type: boolean
          description: JustWatch had more than 1000 titles for a day (new) or in total (upcoming)
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseItem"
      required: [type, country, service, from, to, count, truncated, items]

    ReleaseItem:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          nullable: true
          description: Date added to the service (new), or release date on the service (upcoming; null if not dated yet)
        kind:
          type: string
          enum: [movie, tv]
        title:
          type: string
          description: Movie title, or the show title for a season
        season_number:
          type: integer
        season_title:
          type: string
        year:
          type: integer
          nullable: true
        original_release_date:
          type: string
          format: date
          nullable: true
        tmdb_id:
          type: string
          nullable: true
          description: Movie or show TMDB ID (use with /api/v1/titles/tmdb/{movie|tv}/{id}/...)
        imdb_id:
          type: string
          nullable: true
        justwatch_id:
          type: string
        justwatch_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        runtime_minutes:
          type: integer
          nullable: true
        genres:
          type: array
          items:
            type: string
        poster_url:
          type: string
          nullable: true
        imdb_rating:
          type: number
          nullable: true
        imdb_votes:
          type: integer
          nullable: true
        tomatometer:
          type: integer
          nullable: true
        certified_fresh:
          type: boolean
          nullable: true
        offer:
          type: object
          description: New titles only
          additionalProperties: false
          properties:
            url:
              type: string
              nullable: true
              description: Deep link on the service
            monetization_type:
              type: string
              nullable: true
              example: FLATRATE
            presentation_type:
              type: string
              nullable: true
              example: HD
        release_type:
          type: string
          description: Upcoming titles only, e.g. DIGITAL
      required: [date, kind, title, year, original_release_date, tmdb_id, imdb_id, justwatch_id, justwatch_url, description, runtime_minutes, genres, poster_url, imdb_rating, imdb_votes, tomatometer, certified_fresh]
