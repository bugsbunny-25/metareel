    PeopleResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        role: { type: string }
        total: { type: integer }
        people:
          type: array
          items:
            type: object
            properties:
              person_id: { type: integer }
              name: { type: string }
              profile_path: { type: string, nullable: true }
              points: { type: integer }
              titles: { type: integer }
              best_rank: { type: integer }
              top_titles:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
