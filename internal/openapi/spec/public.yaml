                    title: { type: string }
                    points: { type: integer }
    CountryReleases:
      type: object
      properties:
        country: { type: string }
        premiere: { type: string, format: date, nullable: true }
        theatrical_limited: { type: string, format: date, nullable: true }
        theatrical: { type: string, format: date, nullable: true }
        digital: { type: string, format: date, nullable: true, description: PVOD / EST }
        physical: { type: string, format: date, nullable: true }
        tv: { type: string, format: date, nullable: true }
        notes: { type: object, additionalProperties: { type: string }, description: TMDB notes by release kind (e.g. a festival) }
        streaming:
          type: object
          nullable: true
          description: First observed streaming arrival (an upper bound)
          properties:
            date: { type: string, format: date }
            basis: { type: string, enum: [offer_added, first_chart] }
            provider: { type: string, description: TMDB provider name (offer_added) or FlixPatrol service (first_chart) }
            provider_id: { type: integer, description: TMDB provider id (offer_added) }
            monetization: { type: string, enum: [flatrate, free, ads] }
        streaming_now:
          type: array
          items:
            type: object
            properties:
              provider_id: { type: integer }
              provider_name: { type: string }
              monetization: { type: string, enum: [flatrate, free, ads] }
        windows:
          type: object
          description: Days between releases (null when a date is missing; negative when the later one came first)
          properties:
            theatrical_basis: { type: string, enum: [wide, limited], nullable: true }
            theatrical_to_digital: { type: integer, nullable: true }
            theatrical_to_streaming: { type: integer, nullable: true }
            digital_to_streaming: { type: integer, nullable: true }
    TitleReleasesResponse:
      type: object
      properties:
        kind: { type: string, enum: [movie] }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        release_date: { type: string, format: date, nullable: true, description: "TMDB's primary release date" }
        countries: { type: array, items: { $ref: "#/components/schemas/CountryReleases" } }
    WindowStats:
      allOf:
        - $ref: "#/components/schemas/LagSummary"
        - type: object
          properties:
            within_days:
              type: object
              description: Movies whose window was at most N days (keys 17, 31, 45, 90)
              additionalProperties: { type: integer }
            missing: { type: integer, description: Movies in the range without the later date }
    ReleaseWindowsResponse:
      type: object
      properties:
        country: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        movies: { type: integer }
        theatrical_to_digital: { $ref: "#/components/schemas/WindowStats" }
        theatrical_to_streaming: { $ref: "#/components/schemas/WindowStats" }
        digital_to_streaming: { $ref: "#/components/schemas/WindowStats" }
        streaming_by_provider:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              basis: { type: string, enum: [offer_added, first_chart] }
              lag: { $ref: "#/components/schemas/LagSummary" }
        items_total: { type: integer }
        items:
          type: array
          description: Newest theatrical release first
          items:
            allOf:
              - $ref: "#/components/schemas/CountryReleases"
              - type: object
                properties:
                  tmdb_id: { type: string }
                  title: { type: string }
                  poster_path: { type: string, nullable: true }
    OriginsResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        interval: { type: string, enum: [week, month] }
        providers:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              points: { type: integer }
              origins:
                type: object
                description: original, in_house, licensed, unknown
                additionalProperties:
                  type: object
                  properties:
                    points: { type: integer }
                    share: { type: number, description: "of the provider's points" }
                    titles: { type: integer }
              series:
                type: array
                items:
                  type: object
                  properties:
                    period: { type: string, format: date, description: "first day of the week (Monday) or month" }
                    points: { type: integer }
                    shares: { type: object, additionalProperties: { type: number } }
              suppliers:
                type: array
                description: Owners of licensed titles by points
                items:
                  type: object
                  properties:
                    owner: { type: string, description: '"" = independent or not recognised' }
                    name: { type: string }
                    points: { type: integer }
                    share: { type: number, description: "of the provider's licensed points" }
                    titles: { type: integer }
              top:
                type: object
                description: Up to 5 titles per origin
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      kind: { type: string }
                      tmdb_id: { type: string }
                      points: { type: integer }
                      owner: { type: string }
                      reason: { type: string }
    OfferEvent:
      type: object
      properties:
        id: { type: integer }
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, description: "TMDB title (feed only)" }
        release_date: { type: string, description: "feed only" }
        poster_path: { type: string, description: "feed only" }
        country: { type: string }
        monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
        provider_id: { type: integer }
        provider_name: { type: string }
        event: { type: string, enum: [added, removed] }
        previous_check_at: { type: string, description: "UTC YYYY-MM-DD HH:MM:SS; the change happened after this" }
        observed_at: { type: string, description: "UTC YYYY-MM-DD HH:MM:SS; the change was seen at this refresh" }
    RatingPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
        votes: { type: integer, nullable: true }
    TitleTimelineResponse:
      type: object
      properties:
        kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        country: { type: string, nullable: true }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        total: { type: integer, description: Matching events before the limit }
        counts:
          type: object
          description: Matching events per type
          additionalProperties: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
    TimelineEvent:
      type: object
      required: [type, date, summary]
      properties:
        type:
          type: string
          enum: [chart_debut, chart_peak, chart_number_one, chart_reentry, availability_added, availability_removed,
            rating_changed, pageview_spike, netflix_top10_week, netflix_engagement, season_premiere, release, netflix_premiere]
        date: { type: string, format: date, description: "UTC; a span's first day" }
        end_date: { type: string, format: date, description: "A span's last day (#1 runs, spikes, Netflix weeks, report periods)" }
        summary: { type: string, example: "Debuted at #3 on netflix TV shows (US)" }
        chart:
          type: object
          description: chart_* events
          properties:
            country: { type: string }
            provider: { type: string }
            category: { type: string, enum: [movies, tv_shows] }
            rank: { type: integer }
            season_number: { type: integer }
            days: { type: integer, description: "chart_number_one: days at #1; chart_peak: days after the debut; chart_reentry: days away" }
        availability:
          type: object
          description: availability_* events
          properties:
            provider_id: { type: integer }
            provider_name: { type: string }
            monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
            countries: { type: array, items: { type: string } }
        rating:
          type: object
          description: rating_changed
          properties:
            provider: { type: string, example: imdb_dataset }
            source: { type: string, example: imdb }
            value: { type: number }
            previous_value: { type: number, description: The previous displayed (rounded) value }
            votes: { type: integer }
        pageviews:
          type: object
          description: pageview_spike
          properties:
            peak_day: { type: string, format: date }
            peak_views: { type: integer }
            baseline_views: { type: integer, description: Median daily views of the 28 days before the spike }
            ratio: { type: number }
            days: { type: integer }
        netflix:
          type: object
          description: netflix_top10_week (date = Monday, end_date = week = Sunday)
          properties:
            week: { type: string, format: date }
            category: { type: string }
            global_rank: { type: integer, nullable: true, description: null when only in country lists that week }
            season_title: { type: string }
            season_number: { type: integer }
            hours_viewed: { type: integer }
            views: { type: integer }
            cumulative_weeks: { type: integer }
            countries: { type: integer, description: Country Top 10s it was in that week }
            country_rank: { type: integer, description: Rank in the requested country }
        engagement:
          type: object
          description: netflix_engagement
          properties:
            period_start: { type: string, format: date }
            period_end: { type: string, format: date }
            title: { type: string }
            hours_viewed: { type: integer, nullable: true }
            views: { type: integer, nullable: true }
            runtime_minutes: { type: integer, nullable: true }
            season_number: { type: integer }
            available_globally: { type: boolean, nullable: true }
        season:
          type: object
          description: season_premiere
          properties:
            season_number: { type: integer }
            name: { type: string }
            episode_count: { type: integer }
    TitleHistoryResponse:
      type: object
