openapi: 3.0.3
info:
  title: metareel Public API
  version: "1.0.0"
  description: >
    Every /api/v1 endpoint needs credentials (unless keys are turned off in
    the admin console), either an API key or a signed-in user's session.
    API keys (`mr_...`) are sent as `X-API-Key: <key>` or
    `Authorization: Bearer <key>`, and are created and rotated in the admin
    console under Settings & API keys. Users sign in with
    POST /api/v1/auth/login and send the session token (`mrs_...`) as
    `Authorization: Bearer <token>`, or let the browser send the
    metareel_session cookie. Header credentials win over the cookie, and a
    credential that is sent must be valid. Requests are rate limited per key
    or per user; over the limit the API returns 429 with Retry-After.
    Missing or invalid credentials get 401.
servers:
  - url: /
security:
  - ApiKeyHeader: []
  - BearerKey: []
  - SessionCookie: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Readiness probe
      description: >
        Checks the database and Redis (required: 503 when either is down) and
        FlixPatrol's fetch backend, e.g. FlareSolverr (reported only: status
        "degraded" when down).
      responses:
        "200":
          description: Ready (status ok or degraded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "503":
          description: A required dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"

  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      summary: Sign in with a username and password
      description: >
        Starts a session. Sets the metareel_session cookie (HttpOnly,
        SameSite=Strict, Secure over HTTPS) and returns the session token
        once, for clients that send it as a Bearer token. Attempts are rate
        limited per client IP and failed attempts per username (429 with
        Retry-After). Cross-site browser requests are refused (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: metareel_session=<token>
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid username or password (also for unknown or disabled users)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-site browser request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: []
      summary: End the current session
      description: >
        Ends the session of the Bearer session token or cookie sent, and
        clears the cookie. Succeeds also when there is no session.
      responses:
        "204":
          description: Signed out
  /api/v1/auth/session:
    get:
      operationId: authSession
      security: []
      summary: Whether the admin console needs a sign-in, and who is signed in
      description: >
        Used by the admin console. Never 401: user is null without a valid
        session cookie or Bearer session token.
      responses:
        "200":
          description: Sign-in state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  admin_login_required:
                    type: boolean
                    description: The server runs with AUTH_REQUIRE_ADMIN_LOGIN
                  user:
                    type: object
                    nullable: true
                    additionalProperties: false
                    properties:
                      id: { type: integer, format: int64 }
                      username: { type: string }
                      role: { type: string, enum: [admin, reader] }
                    required: [id, username, role]
                required: [admin_login_required, user]
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Who the request is authenticated as (user or API key)
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: No or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/test:
    get:
      operationId: test
      summary: Test endpoint
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /api/v1/titles:
    get:
      operationId: listTitles
      summary: List titles (paged)
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv_show]
        - name: q
          in: query
          required: false
          schema:
            type: string
            description: Name or slug substring
        - name: missing
          in: query
          required: false
          schema:
            type: string
            enum: [tmdb, imdb, rt]
            description: Only titles without this ID
        - name: match_status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, matched, unmatched, manual]
            description: Only titles in this matching state (the admin review queue uses unmatched)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id_desc, id_asc, name_asc, name_desc, updated_desc, updated_asc, last_ranked_desc, last_ranked_asc, rankings_desc, rankings_asc]
            description: Default id_desc (newest first)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Titles page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlesPageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/{id}:
    get:
      operationId: getTitle
      summary: Get one scraped title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/{id}/rankings:
    get:
      operationId: getTitleRankingsById
      summary: Ranking history of one scraped title (mapped to TMDB or not)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/rankings:
    get:
      operationId: getTitleRankings
      summary: Ranking history of one title, looked up by TMDB ID
      description: >
        Every Top 10 chart appearance of the title, oldest first, plus a
        per-chart summary. All FlixPatrol titles mapped to the TMDB ID are
        included. Returns 404 if no scraped title is mapped to the TMDB ID.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: TMDB ID (numeric)
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No title mapped to this TMDB ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/ratings:
    get:
      operationId: getTitleRatings
      summary: IMDb and Rotten Tomatoes ratings of a title, looked up by TMDB ID
      description: >
        Served from the database when refreshed within RATINGS_TTL (12h by
        default), otherwise refreshed from JustWatch, MDBList (when
        MDBLIST_API_KEY is set) and Rotten Tomatoes' own search index. Rotten
        Tomatoes scores come from RT directly when it has a match (by stored
        slug, MDBList's RT link, or a title + year search), else from MDBList /
        JustWatch. Every rating each provider returned is listed in sources.
        If a refresh fails, the previous ratings are returned with stale=true.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: TMDB ID (numeric)
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            description: Refresh from the providers even if the stored ratings are fresh
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No provider knows this TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Every provider failed and nothing was stored yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/rankings:
    get:
      operationId: getTitleRankingsBatch
      summary: Ranking history of several titles, looked up by TMDB ID
      description: >
        Batch version of getTitleRankings. Items come back in request order;
        IDs with no mapped title are listed in not_found.
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
            example: movie:425,tv:154385
            description: Comma-separated kind:tmdb_id pairs (kind is movie or tv), at most 50
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Ranking histories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleRankingsBatchResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/new/{country}/{service}:
    get:
      operationId: getNewTitles
      summary: Titles added to a streaming service, per day (live from JustWatch)
      description: >
        One JustWatch query per day from `from` to `to` (default: the last 7
        days, at most 31). Newest day first. Seasons are listed under their
        show. Nothing is stored.
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            description: ISO country code (e.g. US)
        - name: service
          in: path
          required: true
          schema:
            type: string
            description: >
              FlixPatrol slug (netflix, hbo-max, disney, amazon-prime,
              paramount-plus, peacock, apple-tv; resolved to the country's
              JustWatch code) or any JustWatch package short / technical name
              from /api/v1/services/{country} (e.g. nfx, ppa)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
            description: 2-letter language for titles, descriptions and genres
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Default today (UTC)
      responses:
        "200":
          description: New titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/upcoming/{country}/{service}:
    get:
      operationId: getUpcomingTitles
      summary: Titles announced for a streaming service (live from JustWatch)
      description: >
        Soonest first. date is the title's release date on this service
        (digital release preferred), not its theatrical or original premiere.
        Titles without a date on the service come last, and only when no
        from / to range is given. Nothing is stored.
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
            description: ISO country code (e.g. US)
        - name: service
          in: path
          required: true
          schema:
            type: string
            description: >
              FlixPatrol slug (netflix, hbo-max, disney, amazon-prime,
              paramount-plus, peacock, apple-tv; resolved to the country's
              JustWatch code) or any JustWatch package short / technical name
              from /api/v1/services/{country} (e.g. nfx, ppa)
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: en
            description: 2-letter language for titles, descriptions and genres
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Earliest release date on the service
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            description: Latest release date on the service
      responses:
        "200":
          description: Upcoming titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/services/{country}:
    get:
      operationId: listServices
      summary: Streaming services JustWatch knows in a country
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"
        "400":
          description: Validation error (country, service, dates, type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: JustWatch request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/movies/{country}:
    get:
      operationId: getTop10MoviesAllProviders
      summary: Get Top 10 movies across all providers
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/movies/{country}/{provider}:
    get:
      operationId: getTop10MoviesByProvider
      summary: Get Top 10 movies for a provider
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/tv-shows/{country}:
    get:
      operationId: getTop10TVShowsAllProviders
      summary: Get Top 10 TV shows across all providers
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/tv-shows/{country}/{provider}:
    get:
      operationId: getTop10TVShowsByProvider
      summary: Get Top 10 TV shows for a provider
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Top 10 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Response"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/top10/{country}:
    get:
      operationId: getCountryTop10
      summary: Every provider's movie and TV Top 10 of a country in one response
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Charts (each provider's latest chart unless date is given)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10Combined"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/top10/global/{provider}:
    get:
      operationId: getGlobalTop10
      summary: A provider's titles ranked across every country by chart points
      description: >
        Points are FlixPatrol-style (rank 1 = 10 points … rank 10 = 1) summed
        over every stored country chart of the day. Titles mapped to the same
        TMDB title are one entry.
      parameters:
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/DateParam"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Leaderboard of one day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/top10/movies/{country}/{provider}/history:
    get:
      operationId: getMovieChartHistory
      summary: One movie chart over a date range
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      description: Defaults to the last 7 days; at most 92 days. Only stored dates are listed.
      responses:
        "200":
          description: Chart per stored date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/top10/tv-shows/{country}/{provider}/history:
    get:
      operationId: getTVChartHistory
      summary: One TV chart over a date range
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      description: Defaults to the last 7 days; at most 92 days. Only stored dates are listed.
      responses:
        "200":
          description: Chart per stored date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/charts:
    get:
      operationId: listCharts
      summary: Every stored chart with its date range and freshness
      parameters:
        - name: country
          in: query
          schema: { type: string, description: ISO country code }
        - name: provider
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Chart catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCatalogResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/charts/{country}/{provider}/dates:
    get:
      operationId: listChartDates
      summary: Dates stored for a chart, newest first
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/ProviderParam"
        - $ref: "#/components/parameters/CategoryQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 366 }
      responses:
        "200":
          description: Stored dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  country: { type: string }
                  provider: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        category: { type: string, enum: [movies, tv_shows] }
                        entries: { type: integer }
                        scraped_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/changes:
    get:
      operationId: listChartChanges
      summary: Charts stored or re-scraped after a time (poll this instead of every chart)
      description: >
        Pass the response's `next` as `since` on the next call. Default since:
        24 hours ago.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time, example: "2026-10-09T12:00:00Z" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Changed charts, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartChangesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/availability/changes:
    get:
      operationId: listAvailabilityChanges
      summary: Titles that arrived on or left a service (across titles)
      description: >-
        Watch provider changes observed since `since` (default: 7 days ago),
        newest first, with the TMDB title. See the per-title
        `/availability/history` for how changes are detected.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time, example: "2026-11-01T00:00:00Z" }
        - name: country
          in: query
          schema: { type: string, example: US }
        - name: event
          in: query
          schema: { type: string, enum: [added, removed] }
        - name: monetization
          in: query
          schema: { type: string, enum: [flatrate, free, ads, rent, buy] }
        - name: provider_id
          in: query
          description: TMDB watch provider ID (e.g. 8 = Netflix)
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Offer changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  since: { type: string, format: date-time }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OfferEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/movers:
    get:
      operationId: getMovers
      summary: Climbers, fallers, debuts, re-entries and exits of a chart
      description: >
        Compares the chart on `date` (default: the latest stored date) with
        the stored date before it. Debuts are titles not on the chart in the
        previous 90 days.
      parameters:
        - name: country
          in: query
          required: true
          schema: { type: string }
        - name: provider
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/DateParam"
      responses:
        "200":
          description: Movers per category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoversResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/breakouts:
    get:
      operationId: getBreakouts
      summary: Titles rising in the Top 10 in several countries at once
      description: >-
        Compares each chart's latest stored date (on `date`, or the day before
        when today's chart isn't stored yet) with its stored date `window`
        days earlier (or the closest stored date up to 7 days before that). A
        title is rising on a chart when it entered it since then, or climbed
        at least `min_climb` places; per country its best chart counts. A
        breakout rises in at least `min_countries` countries. Sorted by rising
        countries, then score (chart points gained, rank 1 = 10 ... rank 10 =
        1). Stale charts (latest date more than a day before `date`) are left
        out; `countries_checked` lists the countries that could be compared.
        Webhooks can subscribe to `title.breakout` (admin API) to get each new
        breakout with the default settings.
      parameters:
        - $ref: "#/components/parameters/DateParam"
        - name: window
          in: query
          description: Days to compare over (1 to 14)
          schema: { type: integer, minimum: 1, maximum: 14, default: 3 }
        - name: min_countries
          in: query
          description: Countries a title must be rising in
          schema: { type: integer, minimum: 1, maximum: 250, default: 2 }
        - name: min_climb
          in: query
          description: Places a title already on a chart must climb to count as rising
          schema: { type: integer, minimum: 1, maximum: 9, default: 3 }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Breakouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/discover/{country}/hidden-gems:
    get:
      operationId: getHiddenGems
      summary: Highly rated titles streamable in a country that weren't in its Top 10 lately
      description: >-
        Titles metareel knows (charting and Netflix Top 10 titles) with an IMDb
        rating (IMDb's dataset) of at least `min_rating` from at least
        `min_votes` votes, a subscription, free or ads offer in the country
        (TMDB watch providers; `provider_id` = only that service), and no
        FlixPatrol Top 10 points in the country over the last `days` days.
        Sorted by `score`, the rating pulled toward 6.5 by 25,000 votes (a
        Bayesian average), so ratings from few votes rank lower.
        `points_elsewhere` / `charted_in` show where it charted meanwhile.
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - name: kind
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: provider_id
          in: query
          description: TMDB watch provider ID (e.g. 8 = Netflix)
          schema: { type: integer, minimum: 1 }
        - name: min_rating
          in: query
          schema: { type: number, minimum: 1, maximum: 10, default: 7.5 }
        - name: min_votes
          in: query
          schema: { type: integer, minimum: 1, default: 5000 }
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 180, default: 90 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Hidden gems
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HiddenGemsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/discover/{country}/elsewhere:
    get:
      operationId: getElsewhere
      summary: Titles trending in other countries that can't be streamed in this one
      description: >-
        Titles in other countries' FlixPatrol Top 10s over the last `days`
        days (default 7) that have no subscription, free or ads offer in the
        country (TMDB watch providers), the most charted first, with where
        they chart and any rent / buy offers here. Titles charting in the
        country too, streamable here, or without TMDB offers fetched yet are
        counted in `skipped`. Only countries metareel scrapes are checked
        (`countries_checked`).
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - name: kind
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Trending elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElsewhereResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/discover/{country}/rotation:
    get:
      operationId: getRotation
      summary: Which streaming services to pay for this month in a country
      description: >-
        Ranks the country's subscription services by `score`. A service
        groups its TMDB plans and channels (e.g. Netflix Standard with Ads,
        HBO Max Amazon Channel; `provider_ids`) with `flatrate` or `ads`
        offers of at least `min_titles` titles metareel knows. By default only
        Netflix, Prime Video, Apple TV, Disney+, HBO Max, Paramount+, Peacock
        and Hulu; `include_other=true` adds every other provider on its own
        (live-TV bundles, niche services). `score` = Top 10 points its titles earned over the past
        `days` days (in the country; every country when the country has no
        charts, see `chart_basis`) + 10 per show with episodes in the coming
        `days` days + 3 per title that arrived in the past window + 1 per title
        rated 7.5+ on IMDb (5,000+ votes). The top `slots` services are
        `subscribe`, the rest `skip`; with `subscribed` (the services paid for
        now, any plan's provider ID): `keep` / `pause` for those, `add` / `skip` for the others.
        `highlights` names the top charting titles, upcoming shows and
        arrivals. Offer arrivals are only known since metareel started
        following offers.
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - name: subscribed
          in: query
          description: Comma-separated TMDB provider IDs paid for now (at most 20)
          schema: { type: string, example: "8,9" }
        - name: slots
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 2 }
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
        - name: min_titles
          in: query
          schema: { type: integer, minimum: 1, default: 10 }
        - name: include_other
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Services, best first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/leaderboards:
    get:
      operationId: getLeaderboard
      summary: Titles ranked by chart points over a period
      description: >
        Points per chart per day: rank 1 = 10 … rank 10 = 1. Omit country /
        provider to sum over all. period=week (default) is the 7 days ending
        on `date` (default: the current chart date); custom uses from/to (at
        most 366 days).
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, custom], default: week }
        - $ref: "#/components/parameters/DateParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/export/rankings:
    get:
      operationId: exportRankings
      summary: Chart entries over a range as CSV or NDJSON
      description: Defaults to the last 30 days; at most 366 days.
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - name: provider
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/CategoryQuery"
        - name: format
          in: query
          schema: { type: string, enum: [csv, ndjson], default: csv }
      responses:
        "200":
          description: >
            Columns / fields: date, country, provider, category, rank,
            season_number, title_id, slug, name, kind, tmdb_id, imdb_id,
            season_source (chart | netflix | tmdb_air_date)
          content:
            text/csv: {}
            application/x-ndjson: {}
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/countries:
    get:
      operationId: listCountries
      summary: Countries FlixPatrol charts can be scraped for
      responses:
        "200":
          description: Countries by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, example: US }
                    slug: { type: string, example: united-states }
                    name: { type: string }

  /api/v1/providers:
    get:
      operationId: listProviders
      summary: Chart providers and the countries they have stored charts in
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug: { type: string, example: netflix }
                    countries: { type: array, items: { type: string } }

  /api/v1/search:
    get:
      operationId: searchTitles
      summary: Find titles by name
      description: >-
        Searches every title metareel has chart data for (one result per TMDB
        title) by any name it goes by: TMDB's title and original title, and
        the FlixPatrol and Netflix Top 10 names mapped to it. Case, accents
        and punctuation are ignored and words may be prefixes ("strang thin"
        finds Stranger Things). Results are ordered by match quality (`score`:
        100 the whole name, 85 the name starts with the query, 70 / 60 every
        word starts a word of the name in / out of order, 40 the query inside
        the name), then by when the title last charted.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: kind
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching titles, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [movie, tv] }
                        tmdb_id: { type: string }
                        title: { type: string }
                        original_title: { type: string }
                        year: { type: integer }
                        poster_path: { type: string }
                        matched: { type: string, description: The name that matched }
                        sources: { type: array, items: { type: string, enum: [flixpatrol, netflix] } }
                        last_charted: { type: string, format: date }
                        score: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/lookup:
    get:
      operationId: lookupTitle
      summary: Find a title by IMDb ID, TMDB ID, FlixPatrol slug or Netflix ID
      parameters:
        - name: imdb
          in: query
          schema: { type: string, example: tt12300742 }
        - name: tmdb
          in: query
          schema: { type: string, example: "movie:701387" }
        - name: slug
          in: query
          schema: { type: string, example: bugonia }
        - name: netflix
          in: query
          schema: { type: string, example: "81231974", description: "Netflix title ID (netflix.com/title/<id>), from Wikidata or Tudum's Top 10" }
      description: Give exactly one of imdb, tmdb, slug or netflix.
      responses:
        "200":
          description: TMDB titles and FlixPatrol titles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [movie, tv] }
                        tmdb_id: { type: string }
                  flixpatrol_titles:
                    type: array
                    items: { $ref: "#/components/schemas/RankedTitle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/ratings:
    get:
      operationId: getTitleRatingsBatch
      summary: Ratings of several titles, looked up by TMDB ID
      description: >
        Stored ratings within RATINGS_TTL are returned as is; up to 10 expired
        or unrated titles per request are refreshed from the providers. Titles
        still without ratings are listed in missing (the ratings pre-warm job
        keeps charting titles fresh).
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string, example: "movie:425,tv:154385", description: At most 50 kind:tmdb_id pairs }
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RatingsResponse" }
                  missing: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/tmdb/{kind}/{id}:
    get:
      operationId: getTitleOverview
      summary: Everything about a title in one call
      description: >
        TMDB metadata, chart stats, current chart positions, ratings, where to
        watch and Netflix's official numbers. `include` picks sections
        (default: all). Ratings may be refreshed from the providers if expired.
        Sections that fail are named in `errors`; the rest are still returned.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: include
          in: query
          schema: { type: string, example: "metadata,stats,current,ratings,availability,netflix" }
        - name: country
          in: query
          schema: { type: string, description: Limit availability and current positions to a country }
      responses:
        "200":
          description: Title overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleOverview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/stats:
    get:
      operationId: getTitleStats
      summary: Chart performance of a title
      description: >
        Points, days on charts, peak rank, days at #1, debut, longest streak
        and how it spread across countries.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleStats"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/availability:
    get:
      operationId: getTitleAvailability
      summary: Where a title can be watched, per country (TMDB, data by JustWatch)
      description: >-
        Watch providers per country, grouped by monetization. Each provider has
        `url`, the title's page on that service (e.g. https://www.netflix.com/title/81231974),
        when JustWatch lists it; `link` per country is TMDB's watch page for the
        title. Stored by the titles.metadata job, refreshed with the providers.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: country
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Offers per country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: TMDB metadata not fetched yet (needs TMDB_API_KEY and the metadata job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/availability/history:
    get:
      operationId: getTitleAvailabilityHistory
      summary: When a title arrived on or left each service, per country
      description: >-
        Watch provider offers that appeared (`added`) or disappeared
        (`removed`) between two TMDB refreshes of the title (titles.metadata,
        charting titles every 3 days). The change happened after
        `previous_check_at` and by `observed_at` (UTC). A title's first
        refresh is the baseline and records nothing. Newest first, up to 500.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: country
          in: query
          schema: { type: string, example: US }
      responses:
        "200":
          description: Offer changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  tmdb_id: { type: string }
                  country: { type: string, nullable: true }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/OfferEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/history:
    get:
      operationId: getTitleHistory
      summary: A title's ratings and TMDB popularity over time
      description: >-
        `imdb` (IMDb's daily dataset) and `ratings` (per provider and source,
        from ratings refreshes) hold a point whenever a value changed, so each
        is a step function; the first point may be before `from` (the value in
        effect at `from`). `popularity` has a point per day of TMDB's daily
        export (tmdb.popularity.import), `wikipedia` the English article's daily
        views (wikipedia.pageviews.import, 90 days back on its first import).
        History starts when this version was deployed. Default range: the last 90 days; at most 366 days.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleHistoryResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/titles/tmdb/{kind}/{id}/credits:
    get:
      operationId: getTitleCredits
      summary: A title's top-billed cast and key crew (TMDB)
      description: >-
        The top 25 cast by billing order and the directors, writers
        (screenplay, writer, story, novel, teleplay, characters), creators, music
        composers and cinematographers, from TMDB (movie credits; for TV the
        aggregate credits of every season, with `episodes`, and the show's
        creators). Stored by the tmdb.credits.refresh job; empty until it has
        fetched the title.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
      responses:
        "200":
          description: Credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleCreditsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/people/{id}:
    get:
      operationId: getPerson
      summary: A person (TMDB) and their titles metareel knows, with each title's chart record
      description: >-
        The person's credits on the titles metareel knows (`roles`: "as
        <character>" for cast, else the job) with each title's FlixPatrol
        record over every stored chart (points, days, best rank, countries,
        first and last day), most charted first.
      parameters:
        - name: id
          in: path
          required: true
          description: TMDB person ID
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/releases:
    get:
      operationId: getTitleReleases
      summary: A movie's theatrical, digital, physical, TV and streaming dates per country, and the windows between them
      description: >-
        Release dates from TMDB (earliest of each type per country, refreshed
        with the title's metadata): premiere (1), theatrical_limited (2),
        theatrical (3), digital (4, PVOD / EST), physical (5), tv (6). TMDB has
        no streaming type, so `streaming` is observed: the first time a
        subscription, free or ads offer was seen arriving (`offer_added`,
        between two metadata refreshes; offers already there at a title's
        first refresh have no arrival) or the movie's first FlixPatrol chart
        day in the country when that chart was stored on most of the 14 days
        before (`first_chart`), whichever is earlier and not before the
        theatrical release. Both are upper bounds. `streaming_now` lists the
        current offers. Windows (days) start at the wide theatrical date, or
        the limited one without it. Movies only (kind=tv is a 400).
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: country
          in: query
          description: One country (ISO 3166-1 alpha-2); default every country with a date or an offer
          schema: { type: string, example: US }
      responses:
        "200":
          description: Releases per country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleReleasesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/tmdb/{kind}/{id}/timeline:
    get:
      operationId: getTitleTimeline
      summary: A title's dated events from every source, newest first
      description: >-
        One feed of what happened to a title. Chart events per chart (country
        x provider x category): `chart_debut`, `chart_peak` (first day at its
        best rank, when after the debut; `days` = days after the debut),
        `chart_number_one` (a run of days at #1; `days` = length) and
        `chart_reentry` (back after at least 7 days away, only when the chart
        was stored without the title in between; `days` = days away).
        `availability_added` / `availability_removed`: watch provider changes,
        one event per day, provider and offer type with every country.
        `rating_changed`: a rating source's displayed value changed (one
        decimal on 0-10 scales, whole numbers on 0-100; the first value is the
        baseline; IMDb from IMDb's dataset when known, other sources from
        Rotten Tomatoes, then MDBList, then JustWatch).
        `pageview_spike`: days in a row with at least 1,000 English Wikipedia
        views and 3x the median of the previous 28 days.
        `netflix_top10_week`: a week (and season) in Netflix's global or
        country Top 10s. `netflix_engagement`: a "What We Watched" report row.
        `season_premiere` (may be upcoming), `release` (movie release / TV
        first air date) and `netflix_premiere` (Netflix originals) from TMDB
        and Netflix's reports. Spans (`end_date`) are kept when they overlap
        `from`..`to`. `country` limits charts, availability and Netflix weeks
        (adding `country_rank`); the other events are worldwide and always
        kept. Exactly one detail object is set per event, by type group.
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
        - name: types
          in: query
          description: Comma-separated event types (default all)
          schema: { type: string, example: "chart_debut,chart_number_one,availability_added" }
        - name: country
          in: query
          schema: { type: string, example: US }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: Newest events to return (default 200, also used for 0; at most 1000); `total` counts all matches
          schema: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleTimelineResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Unknown TMDB title (no metadata and no chart entries)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/calendar/{country}:
    get:
      operationId: getCalendar
      summary: Upcoming episodes of shows streamable in a country
      description: >-
        Episodes airing between `from` and `to` (default: today and the next 13
        days; at most 62 days) of the TV shows metareel knows that have a
        subscription, free or ad-supported offer in the country (TMDB, data by
        JustWatch). One entry per show, season and date, so a binge release is
        one entry with every episode. Air dates are TMDB's (usually the
        original network or service release, not per country), and offers are
        the show's current ones in the country. Episodes are refreshed by the
        tmdb.episodes.refresh job (airing shows daily).
      parameters:
        - name: country
          in: path
          required: true
          schema: { type: string, example: US }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: provider_id
          in: query
          description: Only shows with an offer from this TMDB watch provider (e.g. 8 = Netflix)
          schema: { type: integer }
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/titles/tmdb/{kind}/{id}/netflix:
    get:
      operationId: getTitleNetflix
      summary: A title's weeks in Netflix's official Top 10
      parameters:
        - $ref: "#/components/parameters/TmdbKindParam"
        - $ref: "#/components/parameters/TmdbIDParam"
      responses:
        "200":
          description: Global and per-country weeks
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  tmdb_id: { type: string }
                  weeks_in_global_top10: { type: integer }
                  best_global_rank: { type: integer, nullable: true }
                  total_views: { type: integer }
                  total_hours_viewed: { type: integer }
                  countries: { type: array, items: { type: string } }
                  seasons: { type: array, items: { $ref: "#/components/schemas/NetflixSeasonSummary" } }
                  global: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }
                  country_weeks: { type: array, items: { $ref: "#/components/schemas/NetflixWeekRow" } }
                  engagement:
                    type: array
                    description: >-
                      The title's rows in Netflix's "What We Watched" engagement reports
                      (every title watched 50k+ hours in a six-month period), newest
                      period first; release_date is given for Netflix originals only.
                    items:
                      type: object
                      properties:
                        period_start: { type: string, format: date }
                        period_end: { type: string, format: date }
                        kind: { type: string, enum: [movie, tv_show] }
                        title: { type: string }
                        available_globally: { type: boolean, nullable: true }
                        release_date: { type: string, format: date }
                        hours_viewed: { type: integer, nullable: true }
                        runtime_minutes: { type: integer, nullable: true }
                        views: { type: integer, nullable: true }
                        season_number: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/top10:
    get:
      operationId: getNetflixGlobalTop10
      summary: Netflix's official global weekly Top 10
      description: >
        Imported from https://www.netflix.com/tudum/top10. Weeks run Monday to
        Sunday; `week` may be any date in the week (default: the latest).
      parameters:
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema: { type: string, enum: ["Films (English)", "Films (Non-English)", "TV (English)", "TV (Non-English)"] }
      responses:
        "200":
          description: Week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixWeekResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/top10/{country}:
    get:
      operationId: getNetflixCountryTop10
      summary: Netflix's official weekly Top 10 of a country
      description: Only countries imported (NETFLIX_TOP10_COUNTRIES) are available.
      parameters:
        - $ref: "#/components/parameters/CountryParam"
        - name: week
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema: { type: string, enum: [Films, TV] }
      responses:
        "200":
          description: Week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflixWeekResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/netflix/most-popular:
    get:
      operationId: getNetflixMostPopular
      summary: Netflix's all-time most popular lists (views in the first 91 days)
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        rank: { type: integer }
                        show_title: { type: string }
                        season_title: { type: string, nullable: true }
                        season_number: { type: integer, nullable: true }
                        season_source: { $ref: "#/components/schemas/NetflixSeasonSource" }
                        hours_viewed_first_91_days: { type: integer, nullable: true }
                        runtime_hours: { type: number, nullable: true }
                        views_first_91_days: { type: integer, nullable: true }
                        kind: { type: string }
                        tmdb_id: { type: string, nullable: true }
                        imdb_id: { type: string, nullable: true }
                        netflix_title_id: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/analytics/decay:
    get:
      operationId: getDecay
      summary: How titles fade after debuting on a chart
      description: >
        Follows every chart debut in the range (default: last 60 days) for 30
        days: retention (share still charting) and average rank per day since
        debut. Days whose chart was not stored are not counted.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Decay curve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/country-similarity:
    get:
      operationId: getCountrySimilarity
      summary: Which countries watch alike (overlap of charting titles)
      description: Jaccard overlap of each pair of countries' charting titles in the range (default 30 days).
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Country pairs, most similar first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/release-lag:
    get:
      operationId: getReleaseLag
      summary: Days from release to first chart appearance
      description: >
        Uses the title's digital release date in the chart's country from TMDB
        when known, else TMDB's release / first air date. Needs TMDB metadata
        (titles.metadata job). Range default: last 90 days. `items` lists the
        newest first chart appearances, at most `limit`; `items_total` and the
        summaries cover all of them.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        "200":
          description: Per-title lags with median / quartiles overall and per provider (`summary`, `by_provider`, `items_total`, `items`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/ratings-vs-popularity:
    get:
      operationId: getRatingsVsPopularity
      summary: Chart points against IMDb and Rotten Tomatoes ratings
      description: >
        Pearson correlation of points with IMDb rating (IMDb dataset first,
        then stored provider ratings) and RT critics score, plus acclaimed but
        under-watched (IMDb ≥ 7.5, points below median) and popular but poorly
        rated (top-quartile points, IMDb < 6) lists. Only stored ratings are
        used. Range default: last 30 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Titles with points and ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/genres:
    get:
      operationId: getGenres
      summary: Chart points by TMDB genre
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Genres by points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/origins:
    get:
      operationId: getOrigins
      summary: Each service's chart points by origin (original, in-house, licensed)
      description: >-
        Splits every provider's chart points (rank 1 = 10 … rank 10 = 1) by
        where the titles come from: `original` (made for the service: its own
        network, its studio, or a film it released with no theatrical studio
        involved), `in_house` (the parent company's studios and channels,
        e.g. a Marvel film on Disney+, a CBS show on Paramount+), `licensed`
        (another company or an independent) and `unknown` (no TMDB metadata,
        or nothing says who made it). Computed from TMDB networks and
        production companies and Wikidata distributors, per week or month,
        with the owners of licensed titles (`suppliers`) and the top titles of
        each origin. Charts of different providers are separate, so compare
        shares rather than points across providers. Default range: the last
        90 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: interval
          in: query
          schema: { type: string, enum: [week, month], default: week }
      responses:
        "200":
          description: Origin mix per provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/release-patterns:
    get:
      operationId: getReleasePatterns
      summary: How long TV seasons stay in the Top 10 by release pattern (binge, batch, weekly)
      description: >-
        Classifies each TV season premiering between `from` and `to` (default:
        the last 365 days) by its TMDB episode air dates: `binge` (every
        episode on one day), `batch` (2 to 4 drops averaging 2+ episodes, e.g.
        volumes), `weekly` (drops 5 to 9 days apart, median), `daily` (at most
        2 days apart) or `irregular`. Then measures each chart run (season x
        FlixPatrol TV chart) over `window` days from the premiere: days in the
        Top 10, the last day charting, best rank and points, aggregated per
        pattern. A chart counts only when stored from the premiere to the end of
        the window; the window stops before the next season premieres; rankings
        count when tagged with the season or untagged. Seasons with unaired
        episodes, a single episode, no chart run yet (`in_progress`) or none at
        all (`uncharted`) are counted in `excluded`. Only shows metareel knows
        (charting titles) have episodes, and TMDB air dates are the original
        release, not per country.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - name: window
          in: query
          description: Days after each premiere to measure (30 to 180)
          schema: { type: integer, minimum: 30, maximum: 180, default: 60 }
      responses:
        "200":
          description: Release patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasePatternsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/spread-lag:
    get:
      operationId: getSpreadLag
      summary: How quickly titles spread from the country they first chart in to others
      description: >-
        A title's debut is its first FlixPatrol chart appearance in any
        country between `from` and `to` (default: the last 90 days, at most
        180), with none
        from 30 days before `from`; the countries it charted in that day are
        its origins. Every other country is followed for `window` days: the
        lag is the days until the title first charts there. A country counts
        for a title only when its charts were stored for the 30 days before
        the debut, and a title debuting in a country without that history is
        left out (an earlier appearance could be missing). `country` keeps titles that
        debuted there; `provider`, `category` and `kind` filter the charts and
        titles. Countries are only those metareel scrapes.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - name: country
          in: query
          description: Only titles that debuted in this country (ISO 3166-1 alpha-2)
          schema: { type: string }
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: window
          in: query
          description: Days after the debut to follow the other countries (7 to 90)
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        "200":
          description: Spread lag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadLagResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/release-windows:
    get:
      operationId: getReleaseWindows
      summary: How long after a theatrical release movies reach digital (PVOD) and streaming
      description: >-
        Movies metareel knows (charting or Netflix titles) released in
        theaters in `country` (default US) between `from` and `to` (default:
        the last 365 days; the wide date, or the limited one without it).
        Summaries of the theatrical-to-digital, theatrical-to-streaming and
        digital-to-streaming windows (median and quartiles in days, how many
        were at most 17 / 31 / 45 / 90 days, and movies without the later
        date), theatrical-to-streaming per first service, and each movie's
        dates (as in /titles/tmdb/movie/{id}/releases). Streaming dates are
        observed (offer arrivals since metareel started following offers,
        and first chart days), so many movies have none.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - name: country
          in: query
          schema: { type: string, default: US }
        - name: limit
          in: query
          description: Movies to list (default and at most 500); `items_total` counts all
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Release windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWindowsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/people:
    get:
      operationId: getPeopleAnalytics
      summary: People ranked by the Top 10 points their titles earned
      description: >-
        For a `role` (actor: billed in a title's top 10; director, writer,
        creator, composer, cinematographer: the crew jobs stored), each
        person's titles' FlixPatrol chart points in the range (default: the
        last 90 days; `country`, `provider`, `category`, `kind` filter the
        charts), each title counted in full for everyone credited and once
        per person. With the number of their titles that charted, their best
        rank and their top three titles.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/ProviderQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/KindQuery"
        - name: role
          in: query
          schema: { type: string, enum: [actor, director, writer, creator, composer, cinematographer], default: actor }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: People, most points first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/analytics/netflix-calibration:
    get:
      operationId: getNetflixCalibration
      summary: Netflix's official weekly views against FlixPatrol Netflix chart points
      description: >
        For each Netflix global Top 10 entry, the FlixPatrol Netflix chart
        points the same title earned that week (in `country`, or summed over
        countries), with Pearson r and the median views per point. Range
        default: last 84 days.
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/HistoryCountryParam"
        - $ref: "#/components/parameters/KindQuery"
      responses:
        "200":
          description: Calibration rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/titles/search:
    get:
      operationId: searchTrackedTitles
      tags: [Tracking]
      summary: Search TMDB for a movie or show to track
      description: >
        Searches TMDB directly, so anything on TMDB can be tracked, not only
        the titles metareel knows from a chart. Needs a signed-in user and a
        TMDB key on the server.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: Search text }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [movie, tv] }, description: Limit to movies or shows }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        "200":
          description: Search hits, most relevant first
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/TitleSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "502":
          description: TMDB is unavailable or no TMDB key is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/me/titles:
    get:
      operationId: listTrackedTitles
      tags: [Tracking]
      summary: The signed-in user's tracked titles
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/TrackingStatus" } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [movie, tv] } }
        - { name: favorite, in: query, required: false, schema: { type: boolean }, description: Only favourites }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [position_asc, rating_desc, watched_desc, title_asc] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: A page of tracked titles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedTitlePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/titles/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
      - { name: id, in: path, required: true, schema: { type: string }, description: "TMDB ID (numeric)" }
    get:
      operationId: getTrackedTitle
      tags: [Tracking]
      summary: The user's state for one title, with its TMDB metadata
      description: >
        Resolves the title from TMDB and caches its display metadata the first
        time it is asked for, so later reads need no TMDB call.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: Title metadata and the user's state (state is null when they track nothing on it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedTitleResponse" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setTrackedTitle
      tags: [Tracking]
      summary: Set a title's status, favourite flag or watchlist note
      description: >
        A rating is not accepted here: a user's rating is the rating on their
        most recent watch, so ratings are set by logging or editing a watch.
        Moving a title onto the watchlist puts it at the end of the list.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackedTitleUpdate" }
      responses:
        "200":
          description: The stored state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedTitleResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTrackedTitle
      tags: [Tracking]
      summary: Clear the user's state for a title
      description: Watches are kept; only the status, favourite flag and watchlist note go.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/watchlist:
    get:
      operationId: getWatchlist
      tags: [Tracking]
      summary: The user's watchlist, in list order
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [movie, tv] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [position_asc, rating_desc, watched_desc, title_asc] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: A page of the watchlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedTitlePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/watchlist/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
      - { name: id, in: path, required: true, schema: { type: string }, description: "TMDB ID (numeric)" }
    put:
      operationId: addToWatchlist
      tags: [Tracking]
      summary: Put a title on the watchlist
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                watchlist_note: { type: string, nullable: true }
      responses:
        "200":
          description: The stored state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedTitleResponse" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeFromWatchlist
      tags: [Tracking]
      summary: Take a title off the watchlist
      description: Keeps any favourite flag and every watch; only the watchlist status goes.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/watches:
    get:
      operationId: listWatches
      tags: [Tracking]
      summary: The user's watch log (diary), newest day first
      description: >
        Paged by cursor: pass the `next_cursor` of a response back as
        `cursor` for the following page. The last page has no `next_cursor`.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: tmdb_kind, in: query, required: false, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdb_id, in: query, required: false, schema: { type: string }, description: Only watches of this title }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: "Earliest local day (YYYY-MM-DD)" }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: "Latest local day (YYYY-MM-DD)" }
        - { name: rated, in: query, required: false, schema: { type: boolean }, description: Only watches that carry a rating }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: The next_cursor of the previous page }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: A page of the diary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
    post:
      operationId: logWatch
      tags: [Tracking]
      summary: Log a watch
      description: >
        Records one watch. A rewatch is another watch, with its own rating and
        tags, so this is called again rather than updating the first.
        Sending the same `client_key` twice returns the watch stored the first
        time with 200 instead of creating a duplicate, which makes a retried
        request safe.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchInput" }
      responses:
        "201":
          description: The watch that was stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchEntry" }
        "200":
          description: This client_key was already used; the existing watch is returned unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "403": { $ref: "#/components/responses/TrackingCrossSite" }
        "404":
          description: TMDB has no such title
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/me/watches/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getWatch
      tags: [Tracking]
      summary: One of the user's watches
      description: Another user's watch is reported as missing, not as forbidden, so ids do not leak.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: The watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchEntry" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateWatch
      tags: [Tracking]
      summary: Replace the contents of a watch
      description: >
        The title of a watch cannot be changed; delete it and log another.
        `tmdb_kind` and `tmdb_id` in the body are ignored.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchInput" }
      responses:
        "200":
          description: The updated watch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWatch
      tags: [Tracking]
      summary: Delete a watch
      description: Permanent, there is no trash. The title's rating and watch count are recomputed.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/tags:
    get:
      operationId: listWatchTags
      tags: [Tracking]
      summary: The user's tags, with how many watches carry each
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: The user's tags, by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/WatchTag" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteWatchTag
      tags: [Tracking]
      summary: Delete a tag and detach it from every watch
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/shows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "TMDB TV show ID (numeric)" }
      - { name: include_specials, in: query, required: false, schema: { type: boolean, default: false }, description: Count season 0 towards progress }
    get:
      operationId: getShow
      tags: [Tracking]
      summary: A show with the user's progress through it
      description: >
        Caches every season of the show from TMDB the first time it is asked
        for, so progress can be counted against the whole show rather than
        the recent seasons the chart jobs keep.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: The show, the user's state, their progress and the seasons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShowPage" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/shows/{id}/watched:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: "TMDB TV show ID (numeric)" }
    post:
      operationId: markEpisodes
      tags: [Tracking]
      summary: Mark episodes watched
      description: >
        Marks every episode the scope selects that has aired and that the user
        has not already seen, so marking a season never piles rewatches onto
        the episodes they have. One time applies to all of them, which is why
        the precision defaults to a whole day; log episodes one at a time
        through POST /api/v1/me/watches when the exact times matter.
        Marking also moves the show between "watching" and "completed"; a
        status the user chose (dropped, on_hold, not_interested) is left alone.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkEpisodesInput" }
      responses:
        "200":
          description: How many were marked, with the show's new progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ShowPage"
                  - type: object
                    properties:
                      marked: { type: integer, description: How many episodes were newly marked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "403": { $ref: "#/components/responses/TrackingCrossSite" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unmarkEpisodes
      tags: [Tracking]
      summary: Unmark episodes
      description: >
        Deletes every watch of the episodes the scope selects, permanently.
        Unlike marking, this covers episodes whether or not they have aired.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [episode, season, up_to, all], default: episode } }
        - { name: season, in: query, required: false, schema: { type: integer }, description: Required for every scope but all }
        - { name: episode, in: query, required: false, schema: { type: integer }, description: Required for the episode and up_to scopes }
        - { name: include_specials, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: How many watches were removed, with the show's new progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ShowPage"
                  - type: object
                    properties:
                      removed: { type: integer, description: How many watches were deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/up-next:
    get:
      operationId: upNext
      tags: [Tracking]
      summary: The next episode to watch of each show in progress
      description: >
        The first aired, unwatched episode of every show the user has started
        and not finished, most recently aired first. Specials are left out,
        and rewatching an episode already seen does not move the queue on.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: One episode per show in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  episodes:
                    type: array
                    items: { $ref: "#/components/schemas/UpNextEpisode" }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/formats:
    get:
      operationId: listTrackingFormats
      tags: [Tracking]
      summary: The premium formats a watch can carry
      description: >
        One screening mixes independent things -- a brand, a projection, a
        sound system, a motion rig, 2D or 3D -- so a watch can carry several,
        and each format says which axis it is on. Retired formats are left
        out here; admins still see them.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: The formats on offer, in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  formats:
                    type: array
                    items: { $ref: "#/components/schemas/WatchFormat" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/venues:
    get:
      operationId: listVenues
      tags: [Tracking]
      summary: Search cinemas
      description: >
        Venues are shared reference data rather than per-user rows: a cinema
        is a place, not an opinion, and one row per cinema is what keeps a
        diary from filling with near-duplicates.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: Matches name, chain or city }
        - { name: country, in: query, required: false, schema: { type: string }, description: ISO 3166-1 alpha-2 }
        - { name: include_closed, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matching cinemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items: { $ref: "#/components/schemas/Venue" }
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
    post:
      operationId: createVenue
      tags: [Tracking]
      summary: Add a cinema
      description: >
        A cinema already stored under the same outside id is refused with 409
        rather than added twice. Only Google's place id may be kept
        indefinitely under their terms, which is why no other Google place
        data is stored here.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "201":
          description: The stored cinema with its screens, former names and outside ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenuePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "403": { $ref: "#/components/responses/TrackingCrossSite" }
        "409":
          description: A cinema with one of those outside ids is already stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/me/venues/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getVenue
      tags: [Tracking]
      summary: A cinema with its screens, former names and outside ids
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "200":
          description: The cinema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenuePage" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateVenue
      tags: [Tracking]
      summary: Correct a cinema
      description: >
        Watches keep the name and city they were logged with, so a rename
        here never rewrites what the diary says you went to.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: The updated cinema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenuePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteVenue
      tags: [Tracking]
      summary: Remove a cinema nothing points at
      description: >
        A cinema watches happened at is refused with 409; set its status to
        closed instead, so the diary keeps its meaning.
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Watches happened at this cinema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/me/venues/{id}/aliases:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: addVenueAlias
      tags: [Tracking]
      summary: Record a name a cinema used to have
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                from_date: { type: string, format: date, nullable: true }
                to_date: { type: string, format: date, nullable: true }
      responses:
        "201":
          description: The former name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAlias" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/venues/{id}/aliases/{alias_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: alias_id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteVenueAlias
      tags: [Tracking]
      summary: Remove a former name
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/venues/{id}/screens:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: createScreen
      tags: [Tracking]
      summary: Add an auditorium
      description: >
        Screen geometry belongs to the screen, not to each visit, so it is
        entered once and screens can be compared. A screen that is later
        retrofitted gets effective dates rather than a rewrite.
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreenInput" }
      responses:
        "201":
          description: The auditorium
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueScreen" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/venues/{id}/screens/{screen_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: screen_id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      operationId: updateScreen
      tags: [Tracking]
      summary: Edit an auditorium
      security:
        - BearerSession: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreenInput" }
      responses:
        "200":
          description: The auditorium
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueScreen" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScreen
      tags: [Tracking]
      summary: Remove an auditorium
      security:
        - BearerSession: []
        - SessionCookie: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/stats/summary:
    get:
      operationId: getStatsSummary
      tags: [Tracking]
      summary: Headline totals, where you watched, in what formats and at what cost
      description: >
        How long a watch was is not stored on every row -- runtime_minutes_used
        is only set when a start was derived from it -- so time is counted
        from the episode's runtime, then the title's. An imprecise watch
        still counts towards the total.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Earliest local day }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Latest local day }
      responses:
        "200":
          description: Totals with breakdowns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/stats/calendar:
    get:
      operationId: getStatsCalendar
      tags: [Tracking]
      summary: The day-by-day heatmap, and the streaks that come out of it
      description: >
        A streak that ran to yesterday still counts as current, so it does
        not look broken all morning.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Earliest local day }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Latest local day }
      responses:
        "200":
          description: One row per day watched, with streaks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsCalendar" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/stats/year:
    get:
      operationId: getStatsYear
      tags: [Tracking]
      summary: The look back over one year
      description: >
        Months, weekdays, hours, venues, formats, spend, genres, countries,
        decades, languages, the people behind it all and the most-watched
        titles. Genres, countries and languages come from tmdb_titles, which
        metareel fills for titles it has charted, so a title known only from
        the on-demand cache contributes nothing to those three. Decades use
        the release date, which the cache does store, so every tracked title
        counts. The people breakdowns need credits, which only charted titles
        have.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer }, description: Defaults to the current year }
      responses:
        "200":
          description: The year in review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsYear" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/stats/ratings:
    get:
      operationId: getStatsRatings
      tags: [Tracking]
      summary: How you rate, and how that compares with the crowd
      description: >
        A rating is 1-10 half-stars, which is already a 0-10 scale, so TMDB
        and IMDb compare directly and a Rotten Tomatoes percentage is divided
        by ten. A title nobody has scored is left out of the comparison
        rather than counted as a zero, which would drag every gap upwards.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Earliest local day }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Latest local day }
      responses:
        "200":
          description: The distribution, the comparison and every rated title
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsRatings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/stats/spend:
    get:
      operationId: getStatsSpend
      tags: [Tracking]
      summary: Money, per currency, per cinema and per format
      description: >
        Amounts are minor units and are never converted between currencies:
        there is no rate stored to do it honestly with.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Earliest local day }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Latest local day }
      responses:
        "200":
          description: Spend broken down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSpend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/stats/people:
    get:
      operationId: getStatsPeople
      tags: [Tracking]
      summary: The people behind what you watched
      description: >
        Only titles metareel has credits for can appear, and credits are
        fetched for charted titles, so this is a view of the charted part of
        a diary rather than all of it.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: job, in: query, required: false, schema: { type: string }, description: 'Empty for cast, or a crew job such as Director or Screenplay' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10, maximum: 25 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: Earliest local day }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: Latest local day }
      responses:
        "200":
          description: People ranked by how many of your titles they worked on
          content:
            application/json:
              schema:
                type: object
                properties:
                  range: { $ref: "#/components/schemas/StatsRangeEcho" }
                  job: { type: string }
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/PersonStat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

  /api/v1/me/watchlist/insights:
    get:
      operationId: getWatchlistInsights
      tags: [Tracking]
      summary: What your watchlist is doing in metareel's chart and availability data
      description: >
        The join that only works because the charts and the watchlist live in
        one database: which of the titles you mean to watch have charted,
        which you can stream now, and which have come off a service.
        "Leaving soon" is deliberately absent: metareel records availability
        changes it has observed, not departures a service has scheduled, so
        the honest version of that question is what has already gone.
      security:
        - BearerSession: []
        - SessionCookie: []
      parameters:
        - { name: country, in: query, required: true, schema: { type: string }, description: ISO 3166-1 alpha-2 }
        - { name: days, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 }, description: How far back to look }
      responses:
        "200":
          description: Watchlist crossovers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistInsights" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TrackingUnauthorized" }

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    BearerKey:
      type: http
      scheme: bearer
      description: 'An API key (mr_...) or a session token from /api/v1/auth/login (mrs_...), as "Authorization: Bearer <value>"'
    SessionCookie:
      type: apiKey
      in: cookie
      name: metareel_session
      description: Session cookie set by POST /api/v1/auth/login
    BearerSession:
      type: http
      scheme: bearer
      description: 'A session token from /api/v1/auth/login (mrs_...). The tracking API accepts only this and the session cookie, never an API key.'
  responses:
    TrackingUnauthorized:
      description: >
        No signed-in user. The tracking API needs a user's session; an API key
        identifies an integration, not a person, so it is refused here even
        though it opens the rest of the public API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TrackingCrossSite:
      description: >
        A write from another site. Tracking writes are authenticated by the
        session cookie, so they must come from the same origin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TmdbIDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        description: TMDB ID (numeric)
    CategoryQuery:
      name: category
      in: query
      required: false
      schema:
        type: string
        enum: [movies, tv_shows]
        description: Omit for both
    KindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [movie, tv_show]
        description: What the title is (can differ from the chart's category)
    ProviderQuery:
      name: provider
      in: query
      required: false
      schema:
        type: string
        description: Provider slug; omit for all
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Range start (YYYY-MM-DD); ranges are at most 366 days
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Range end (YYYY-MM-DD); default the current chart date
    CountryParam:
      name: country
      in: path
      required: true
      schema:
        type: string
        description: ISO country code (e.g. US)
    ProviderParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        description: Provider slug
    DateParam:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
        description: >
          Chart date in YYYY-MM-DD. Omit for the latest scraped chart; on the
          all-providers endpoints that is each provider's own latest chart
          (see the per-item date).
    TmdbKindParam:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [movie, tv]
        description: TMDB namespace of the ID
    HistoryCountryParam:
      name: country
      in: query
      required: false
      schema:
        type: string
        description: ISO country code (e.g. US); omit for all countries
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
        description: First chart date to include (YYYY-MM-DD)
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
        description: Last chart date to include (YYYY-MM-DD)

  schemas:
    StatsRangeEcho:
      type: object
      description: The range the figures cover; absent bounds mean unbounded.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    StatsTotals:
      type: object
      properties:
        watches: { type: integer }
        movie_watches: { type: integer }
        episode_watches: { type: integer }
        rewatches: { type: integer }
        distinct_titles: { type: integer }
        minutes: { type: integer, description: Counted from the stored runtime, else the episode's, else the title's }
        hours: { type: number }
        days: { type: integer, description: Days with at least one watch }
        rated: { type: integer }
        liked: { type: integer }
    LabelledStat:
      type: object
      properties:
        label: { type: string }
        watches: { type: integer }
        minutes: { type: integer }
    FormatStat:
      type: object
      properties:
        slug: { type: string }
        label: { type: string }
        category: { type: string }
        watches: { type: integer }
        minutes: { type: integer }
    CurrencySpend:
      type: object
      description: Money in one currency. Currencies are never converted into one another.
      properties:
        currency: { type: string }
        price_minor: { type: integer }
        fees_minor: { type: integer }
        concessions_minor: { type: integer }
        total_minor: { type: integer }
        watches: { type: integer }
        tickets: { type: integer }
    VenueSpend:
      type: object
      properties:
        venue: { type: string, description: The cinema's name as it was on the night }
        currency: { type: string }
        watches: { type: integer }
        total_minor: { type: integer }
    PersonStat:
      type: object
      properties:
        person_id: { type: integer }
        name: { type: string }
        profile_path: { type: string }
        titles: { type: integer, description: Distinct titles of yours they worked on }
        watches: { type: integer }
    StatsSummary:
      type: object
      properties:
        range: { $ref: "#/components/schemas/StatsRangeEcho" }
        totals: { $ref: "#/components/schemas/StatsTotals" }
        by_venue:
          type: array
          description: Cinema, streaming, home; watches with no venue kind are grouped as "unspecified".
          items: { $ref: "#/components/schemas/LabelledStat" }
        formats:
          type: array
          items: { $ref: "#/components/schemas/FormatStat" }
        spend:
          type: array
          items: { $ref: "#/components/schemas/CurrencySpend" }
    DayStat:
      type: object
      properties:
        day: { type: string, format: date }
        watches: { type: integer }
        minutes: { type: integer }
    StatsCalendar:
      type: object
      properties:
        range: { $ref: "#/components/schemas/StatsRangeEcho" }
        days:
          type: array
          description: Only days with a watch appear; the client fills the gaps.
          items: { $ref: "#/components/schemas/DayStat" }
        streaks:
          type: object
          properties:
            longest: { type: integer }
            longest_ended: { type: string, format: date }
            current: { type: integer, description: Counts a streak that ran to yesterday }
            days_watched: { type: integer }
    RatingBucket:
      type: object
      properties:
        rating: { type: integer, description: 1-10 half-stars }
        stars: { type: number, description: The same value in stars out of five }
        watches: { type: integer }
    RatingComparison:
      type: object
      description: One title you rated, with the crowd's scores on the same 0-10 scale. A score is absent where nobody has given one.
      properties:
        tmdb_kind: { type: string }
        tmdb_id: { type: string }
        title: { type: string }
        user_rating: { type: integer }
        tmdb_rating: { type: number }
        imdb_rating: { type: number }
        rt_rating: { type: number, description: The Rotten Tomatoes percentage divided by ten }
    CrowdGap:
      type: object
      properties:
        compared: { type: integer, description: Titles where both you and this source have a score }
        above_the_crowd: { type: integer }
        average_gap: { type: number, description: Your score minus theirs, averaged. Absent with nothing to compare. }
    StatsRatings:
      type: object
      properties:
        range: { $ref: "#/components/schemas/StatsRangeEcho" }
        rated: { type: integer }
        average: { type: number }
        distribution:
          type: array
          items: { $ref: "#/components/schemas/RatingBucket" }
        vs_crowd:
          type: object
          properties:
            tmdb: { $ref: "#/components/schemas/CrowdGap" }
            imdb: { $ref: "#/components/schemas/CrowdGap" }
            rotten_tomatoes: { $ref: "#/components/schemas/CrowdGap" }
        titles:
          type: array
          items: { $ref: "#/components/schemas/RatingComparison" }
    StatsSpend:
      type: object
      properties:
        range: { $ref: "#/components/schemas/StatsRangeEcho" }
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/CurrencySpend" }
        by_venue:
          type: array
          items: { $ref: "#/components/schemas/VenueSpend" }
        by_format:
          type: array
          items: { $ref: "#/components/schemas/FormatStat" }
    TasteCount:
      type: object
      description: One genre, country, decade or language, with how many of your titles it covers.
      properties:
        titles: { type: integer }
    WatchedTitleStat:
      type: object
      properties:
        tmdb_kind: { type: string }
        tmdb_id: { type: string }
        title: { type: string }
        watches: { type: integer }
        minutes: { type: integer }
        release_date: { type: string }
        genres:
          type: array
          items: { type: string }
        countries:
          type: array
          items: { type: string }
        language: { type: string }
    StatsYear:
      type: object
      properties:
        year: { type: integer }
        range: { $ref: "#/components/schemas/StatsRangeEcho" }
        totals: { $ref: "#/components/schemas/StatsTotals" }
        by_month:
          type: array
          items: { $ref: "#/components/schemas/LabelledStat" }
        by_weekday:
          type: array
          items:
            type: object
            properties:
              weekday: { type: string, description: 0 is Sunday }
              name: { type: string }
              watches: { type: integer }
        by_hour:
          type: array
          description: The local hour a watch ended, from the offset stored with it. Only watches logged to the minute can be placed in an hour.
          items: { $ref: "#/components/schemas/LabelledStat" }
        by_venue:
          type: array
          items: { $ref: "#/components/schemas/LabelledStat" }
        formats:
          type: array
          items: { $ref: "#/components/schemas/FormatStat" }
        spend:
          type: array
          items: { $ref: "#/components/schemas/CurrencySpend" }
        genres:
          type: array
          items: { $ref: "#/components/schemas/TasteCount" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/TasteCount" }
        decades:
          type: array
          items: { $ref: "#/components/schemas/TasteCount" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/TasteCount" }
        people:
          type: object
          properties:
            cast:
              type: array
              items: { $ref: "#/components/schemas/PersonStat" }
            directors:
              type: array
              items: { $ref: "#/components/schemas/PersonStat" }
            writers:
              type: array
              items: { $ref: "#/components/schemas/PersonStat" }
        most_watched:
          type: array
          items: { $ref: "#/components/schemas/WatchedTitleStat" }
        streaks:
          type: object
          properties:
            longest: { type: integer }
            longest_ended: { type: string }
            days_watched: { type: integer }
    WatchlistInsights:
      type: object
      properties:
        country: { type: string }
        days: { type: integer }
        charting:
          type: array
          description: Watchlist titles that have been on a Top 10 in the window.
          items:
            type: object
            properties:
              tmdb_kind: { type: string }
              tmdb_id: { type: string }
              title: { type: string }
              country: { type: string }
              provider: { type: string }
              category: { type: string }
              best_rank: { type: integer }
              ranked_on: { type: string }
        streaming_now:
          type: array
          description: Watchlist titles on a subscription service in that country now.
          items:
            type: object
            properties:
              tmdb_kind: { type: string }
              tmdb_id: { type: string }
              title: { type: string }
              provider_id: { type: integer }
              provider_name: { type: string }
              monetization: { type: string }
              link: { type: string }
        recently_left:
          type: array
          description: >
            Watchlist titles observed coming off a service. These have
            already gone: metareel has no schedule of future departures.
          items:
            type: object
            properties:
              tmdb_kind: { type: string }
              tmdb_id: { type: string }
              title: { type: string }
              provider_name: { type: string }
              monetization: { type: string }
              country: { type: string }
              observed_at: { type: string }
    WatchFormat:
      type: object
      description: One premium format. category is the axis it sits on, which is what keeps "all my 70mm screenings" answerable.
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: Stable identifier used when logging a watch, e.g. imax-70mm }
        label: { type: string }
        category: { type: string, enum: [brand, projection, sound, motion, dimension] }
        note: { type: string, nullable: true }
        sort_order: { type: integer }
        active: { type: boolean, description: Retired formats stay on the watches that carry them but cannot be chosen for new ones }
        created_at: { type: string }
        updated_at: { type: string }
    Venue:
      type: object
      description: A cinema. Shared reference data, not a per-user row.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        chain: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        country: { type: string, nullable: true, description: ISO 3166-1 alpha-2, stored uppercase }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        timezone: { type: string, nullable: true, description: IANA zone; a watch here takes it when the client sends none }
        opened_on: { type: string, nullable: true }
        closed_on: { type: string, nullable: true }
        status: { type: string, enum: [open, closed, renamed, rebuilt] }
        replaced_by_venue_id: { type: integer, format: int64, nullable: true, description: The cinema that took this one's place }
        note: { type: string, nullable: true }
        created_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
        screen_count: { type: integer }
    VenueInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        chain: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        country: { type: string, nullable: true, description: ISO 3166-1 alpha-2 }
        latitude: { type: number, nullable: true, description: Goes together with longitude }
        longitude: { type: number, nullable: true }
        timezone: { type: string, nullable: true, description: IANA zone name }
        opened_on: { type: string, format: date, nullable: true }
        closed_on: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, closed, renamed, rebuilt] }
        replaced_by_venue_id: { type: integer, format: int64, nullable: true }
        note: { type: string, nullable: true }
        refs:
          type: object
          additionalProperties: { type: string }
          description: >
            This cinema's ids in outside catalogues, keyed by source:
            google_place_id, osm_id, wikidata_id, fsq_id, overture_id.
            Google's place id may be stored indefinitely; its other place
            data may not, so none of it is kept here.
    VenueAlias:
      type: object
      description: A name a cinema used to have, so an old watch can still be explained.
      properties:
        id: { type: integer, format: int64 }
        venue_id: { type: integer, format: int64 }
        name: { type: string }
        from_date: { type: string, nullable: true }
        to_date: { type: string, nullable: true }
    VenueRef:
      type: object
      properties:
        source: { type: string, enum: [google_place_id, osm_id, wikidata_id, fsq_id, overture_id] }
        ref: { type: string }
    VenueScreen:
      type: object
      properties:
        id: { type: integer, format: int64 }
        venue_id: { type: integer, format: int64 }
        name: { type: string }
        number: { type: integer, nullable: true }
        seats: { type: integer, nullable: true }
        width: { type: number, nullable: true, description: As entered, in dim_unit }
        height: { type: number, nullable: true }
        dim_unit: { type: string, nullable: true, enum: [m, ft] }
        width_m: { type: number, nullable: true, description: Normalised to metres so screens compare }
        height_m: { type: number, nullable: true }
        aspect_ratio: { type: number, nullable: true, description: 1.9 for a 1.90:1 screen }
        effective_from: { type: string, nullable: true }
        effective_to: { type: string, nullable: true, description: Set when a screen is retrofitted rather than rewriting it }
        note: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    ScreenInput:
      type: object
      properties:
        name: { type: string }
        number: { type: integer, nullable: true }
        seats: { type: integer, nullable: true }
        width: { type: number, nullable: true, description: Needs dim_unit }
        height: { type: number, nullable: true }
        dim_unit: { type: string, enum: [m, ft], nullable: true }
        aspect_ratio: { type: string, nullable: true, description: 'As written: "1.43:1", "16:9" or "1.9"' }
        effective_from: { type: string, format: date, nullable: true }
        effective_to: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true }
    VenuePage:
      type: object
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        screens:
          type: array
          items: { $ref: "#/components/schemas/VenueScreen" }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/VenueAlias" }
        refs:
          type: array
          items: { $ref: "#/components/schemas/VenueRef" }
        watch_count: { type: integer, description: How many watches point at this cinema }
    WatchContext:
      type: object
      description: >
        Where and how a watch happened. These fields sit at the top level of
        a watch and of the body that logs one; all of them are optional.
      properties:
        venue_id: { type: integer, format: int64, nullable: true }
        screen_id: { type: integer, format: int64, nullable: true, description: Must belong to venue_id }
        venue_name_at_watch:
          type: string
          nullable: true
          description: >
            The cinema's name on the night, snapshotted when the watch is
            stored, so a later rename cannot rewrite the diary. Read only.
        venue_city_at_watch: { type: string, nullable: true, description: Read only }
        seat: { type: string, nullable: true }
        screening_type: { type: string, nullable: true, enum: [regular, preview, premiere, festival, press, rerelease, marathon] }
        event_name: { type: string, nullable: true }
        with_qa: { type: boolean }
        price_minor:
          type: integer
          nullable: true
          description: Ticket price in minor units (paise, cents) so money is never a float. Needs currency.
        fees_minor: { type: integer, nullable: true, description: Booking fees, separate from the ticket }
        concessions_minor: { type: integer, nullable: true }
        currency: { type: string, nullable: true, description: ISO 4217, stored uppercase. Required when an amount is given. }
        tickets_count: { type: integer, nullable: true }
        booking_source: { type: string, nullable: true }
        provider_id: { type: integer, nullable: true, description: TMDB / JustWatch provider id, so a streaming watch lines up with availability data }
        provider_name: { type: string, nullable: true }
        monetization: { type: string, nullable: true, enum: [flatrate, free, ads, rent, buy] }
        media: { type: string, nullable: true, enum: [bluray_4k, bluray, dvd, vhs, digital_file, 35mm, 70mm] }
        edition: { type: string, nullable: true, description: 'Which cut: theatrical, extended, directors, ...' }
        device: { type: string, nullable: true }
        dimension: { type: string, nullable: true, enum: [2d, 3d, 3d_hfr] }
        resolution: { type: string, nullable: true, enum: [sd, hd, fhd, 4k, 8k] }
        hdr: { type: string, nullable: true, enum: [none, hdr10, hdr10_plus, dolby_vision, hlg] }
        audio_format: { type: string, nullable: true }
        frame_rate: { type: number, nullable: true }
        audio_language: { type: string, nullable: true }
        subtitle_language: { type: string, nullable: true }
        content_aspect_ratio:
          type: string
          nullable: true
          description: >
            What the film looked like, as written ("1.90:1", "16:9", "1.9").
            TMDB has no aspect-ratio data, so this is the viewer's own. On a
            stored watch it comes back as content_aspect_ratio_text plus a
            number in content_aspect_ratio.
        content_aspect_ratio_text: { type: string, nullable: true, description: Read only, as written }
        content_aspect_variable: { type: boolean, description: For the films that change ratio part way through }
        screen_aspect_ratio: { type: string, nullable: true, description: Defaults to the screen's own when one is given }
        screen_width: { type: number, nullable: true, description: Needs screen_dim_unit; defaults to the screen's own }
        screen_height: { type: number, nullable: true }
        screen_dim_unit: { type: string, nullable: true, enum: [m, ft] }
        screen_width_m: { type: number, nullable: true, description: Read only, normalised to metres }
        screen_height_m: { type: number, nullable: true, description: Read only }
    TrackedEpisode:
      type: object
      properties:
        season_number: { type: integer, description: 0 is specials }
        episode_number: { type: integer }
        tmdb_episode_id: { type: string, nullable: true, description: Stable across TMDB renumbering }
        name: { type: string }
        air_date: { type: string, nullable: true, description: "YYYY-MM-DD; null means TBA, which counts as not aired" }
        episode_type: { type: string, nullable: true, enum: [standard, finale, mid_season] }
        runtime: { type: integer, nullable: true, description: Minutes }
        watch_count: { type: integer, description: How often this user has watched it }
        last_watched_at: { type: string, nullable: true }
    ShowSeason:
      type: object
      properties:
        season_number: { type: integer }
        total_episodes: { type: integer }
        watched_episodes: { type: integer }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/TrackedEpisode" }
    ShowProgress:
      type: object
      description: >
        Progress is counted against the episodes that have aired, and that
        denominator moves as a show airs: 100% today can be 96% next week.
      properties:
        total_episodes: { type: integer }
        aired_episodes: { type: integer }
        watched_episodes: { type: integer, description: Distinct episodes seen at least once; a rewatch is not extra progress }
        percent: { type: integer, description: watched_episodes against aired_episodes, rounded down }
        include_specials: { type: boolean }
        next_air_date: { type: string, description: The next episode's air date, absent when nothing is scheduled }
    ShowPage:
      type: object
      properties:
        title: { $ref: "#/components/schemas/TrackedTitleMeta" }
        state: { $ref: "#/components/schemas/TrackedTitleState" }
        progress: { $ref: "#/components/schemas/ShowProgress" }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/ShowSeason" }
    MarkEpisodesInput:
      type: object
      properties:
        scope:
          type: string
          enum: [episode, season, up_to, all]
          default: episode
          description: >
            episode marks just this one; season marks this whole season;
            up_to marks everything up to and including it, across earlier
            seasons; all marks the whole show.
        season_number: { type: integer, nullable: true, description: Required for every scope but all }
        episode_number: { type: integer, nullable: true, description: Required for the episode and up_to scopes }
        include_specials: { type: boolean, default: false }
        ended_at: { type: string, format: date-time, description: UTC instant; defaults to now }
        tz: { type: string, nullable: true, description: IANA zone deciding the local day }
        utc_offset_minutes: { type: integer, nullable: true }
        time_precision:
          type: string
          enum: [minute, day, month, year]
          default: day
          description: A bulk mark says which day, not which minute, so this defaults to day.
        rating: { type: integer, nullable: true, minimum: 1, maximum: 10, description: Applied to every episode marked }
        liked: { type: boolean }
        notes: { type: string, nullable: true }
        venue_kind: { type: string, nullable: true, enum: [theater, streaming, physical, broadcast, other] }
    UpNextEpisode:
      type: object
      properties:
        tmdb_id: { type: string, description: The show }
        show_title: { type: string }
        poster_path: { type: string }
        season_number: { type: integer }
        episode_number: { type: integer }
        name: { type: string }
        air_date: { type: string, nullable: true }
        episode_type: { type: string, nullable: true }
        runtime: { type: integer, nullable: true }
    TrackingStatus:
      type: string
      description: >
        What a user is doing with a title. An empty string means they track
        it without a status (for example they have only watched it).
      enum: ["", watchlist, watching, completed, dropped, on_hold, not_interested]
    TitleSearchResult:
      type: object
      properties:
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        release_date: { type: string, description: "YYYY-MM-DD, empty when TMDB has no date" }
        poster_path: { type: string }
    TrackedTitleMeta:
      type: object
      description: What is known about a title, from metareel when it has charted, else from TMDB on demand.
      properties:
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string }
        release_date: { type: string }
        poster_path: { type: string }
        runtime: { type: integer, description: "Minutes; for a show, a typical episode" }
        number_of_seasons: { type: integer }
        number_of_episodes: { type: integer }
        charted: { type: boolean, description: Whether metareel knows this title from a chart }
    TrackedTitleState:
      type: object
      nullable: true
      description: One user's state for one title. The watch roll-up is derived from their watches.
      properties:
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        status: { $ref: "#/components/schemas/TrackingStatus" }
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: >
            The rating on the user's most recent rated watch, in half-stars
            out of five (1 = half a star, 10 = five stars).
        favorite: { type: boolean }
        watchlist_position: { type: integer, nullable: true }
        watchlist_note: { type: string, nullable: true }
        first_watched_at: { type: string, nullable: true, description: "UTC, YYYY-MM-DD HH:MM:SS" }
        last_watched_at: { type: string, nullable: true, description: "UTC, YYYY-MM-DD HH:MM:SS" }
        watch_count: { type: integer, description: Watches, rewatches included }
        episodes_watched:
          type: integer
          description: >
            Distinct episodes of a show seen at least once, so a rewatch is
            not extra progress. 0 for a movie.
        created_at: { type: string }
        updated_at: { type: string }
        title: { type: string, description: Display metadata, on list responses only }
        release_date: { type: string }
        poster_path: { type: string }
        runtime: { type: integer }
    TrackedTitleResponse:
      type: object
      properties:
        title: { $ref: "#/components/schemas/TrackedTitleMeta" }
        state: { $ref: "#/components/schemas/TrackedTitleState" }
    TrackedTitlePage:
      type: object
      properties:
        titles:
          type: array
          items: { $ref: "#/components/schemas/TrackedTitleState" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    TrackedTitleUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/TrackingStatus" }
        favorite: { type: boolean }
        watchlist_note: { type: string, nullable: true }
    WatchInput:
      type: object
      required: [tmdb_kind, tmdb_id, ended_at]
      properties:
        client_key:
          type: string
          nullable: true
          description: >
            An idempotency key chosen by the client. Sending the same one
            again returns the watch stored the first time, so a retry cannot
            create a duplicate. A rewatch is a new watch with a new key.
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string, description: "TMDB ID (numeric); for a show, the show's ID" }
        season_number:
          type: integer
          nullable: true
          description: Required with tmdb_kind tv (0 is specials). A show is watched one episode at a time.
        episode_number:
          type: integer
          nullable: true
          description: Required with tmdb_kind tv.
        ended_at:
          type: string
          format: date-time
          description: >
            When the watch ended, as an RFC 3339 instant in UTC, e.g.
            2026-11-12T23:00:00Z. This is the time clients log.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional. When given it is stored and used as the start; when not,
            the start is taken as ended_at minus the title's runtime.
        tz:
          type: string
          nullable: true
          description: >
            The IANA time zone the watch happened in, e.g. America/New_York.
            It decides which local day the watch belongs to, and the UTC
            offset in force at that instant is derived from it and stored.
        utc_offset_minutes:
          type: integer
          nullable: true
          description: >
            Used only when tz is absent. Prefer tz: an offset alone cannot be
            recomputed after an edit that crosses a daylight-saving change.
        time_precision:
          type: string
          enum: [minute, day, month, year]
          default: minute
          description: >
            How precisely the time is known. Anything less precise than a
            minute is stored at the earliest instant it could mean (1 January,
            the 1st, 00:00 local) and no runtime is subtracted from it.
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: Half-stars out of five (1 = half a star, 10 = five stars), or null for unrated.
        liked: { type: boolean }
        notes: { type: string, nullable: true }
        venue_kind:
          type: string
          nullable: true
          enum: [theater, streaming, physical, broadcast, other]
        tags:
          type: array
          description: Tags for this watch; a rewatch can carry different ones. Created on first use.
          items: { type: string }
        formats:
          type: array
          description: >
            Premium-format slugs from GET /api/v1/me/formats. Several are
            allowed, because a screening mixes a brand, a projection, a
            sound system and a motion rig.
          items: { type: string }
      allOf:
        - $ref: "#/components/schemas/WatchContext"
    WatchEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        client_key: { type: string, nullable: true }
        subject_kind: { type: string, enum: [movie, episode] }
        tmdb_kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        season_number: { type: integer, nullable: true }
        episode_number: { type: integer, nullable: true }
        ended_at: { type: string, description: "UTC, YYYY-MM-DD HH:MM:SS" }
        started_at: { type: string, nullable: true, description: Stored only when the client sent one }
        runtime_minutes_used:
          type: integer
          nullable: true
          description: The runtime used to derive a start, kept so the chosen day can be explained.
        runtime_source: { type: string, nullable: true, enum: [tmdb_title, tmdb_episode, user, unknown] }
        tz: { type: string, nullable: true }
        utc_offset_minutes: { type: integer, nullable: true }
        watched_on:
          type: string
          format: date
          description: >
            The local day the watch belongs to, from the local day of its
            start. Computed once when the watch is written and then fixed, so
            a later TMDB runtime change cannot move it to another day.
        time_precision: { type: string, enum: [minute, day, month, year] }
        rating: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        liked: { type: boolean }
        is_rewatch: { type: boolean }
        watch_number: { type: integer, description: 1 for the first watch of this title, 2 for the next, and so on }
        notes: { type: string, nullable: true }
        venue_kind: { type: string, nullable: true }
        source: { type: string, description: How the watch got here, e.g. manual }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        formats:
          type: array
          description: The premium formats on this watch.
          items: { $ref: "#/components/schemas/WatchFormat" }
        title: { type: string, description: Display metadata, on diary responses only }
        release_date: { type: string }
        poster_path: { type: string }
      allOf:
        - $ref: "#/components/schemas/WatchContext"
    DiaryPage:
      type: object
      properties:
        watches:
          type: array
          items: { $ref: "#/components/schemas/WatchEntry" }
        limit: { type: integer }
        next_cursor:
          type: string
          description: Pass back as `cursor` for the next page. Absent on the last page.
    WatchTag:
