    ChartMoment:
      type: object
      properties:
        date: { type: string, format: date }
        country: { type: string }
        provider: { type: string }
        category: { type: string }
        rank: { type: integer }

    TitleStats:
      type: object
      properties:
        kind: { type: string }
        tmdb_id: { type: string }
        titles: { type: array, items: { $ref: "#/components/schemas/RankedTitle" } }
        total_points: { type: integer }
        days_on_charts: { type: integer }
        appearances: { type: integer }
        peak_rank: { type: integer, nullable: true }
        days_at_number_1: { type: integer }
        debut: { $ref: "#/components/schemas/ChartMoment" }
        last_seen: { $ref: "#/components/schemas/ChartMoment" }
        longest_streak_days: { type: integer }
        countries: { type: array, items: { type: string } }
        providers: { type: array, items: { type: string } }
        spread:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              first_date: { type: string, format: date }
              days_after_debut: { type: integer }
        charts: { type: array, items: { $ref: "#/components/schemas/ChartSummary" } }

    WatchProvider:
      type: object
      properties:
        country: { type: string }
        monetization: { type: string, enum: [flatrate, free, ads, rent, buy] }
        provider_id: { type: integer }
        provider_name: { type: string }
        logo_path: { type: string, nullable: true, description: "TMDB image path (https://image.tmdb.org/t/p/w92{logo_path})" }
        display_priority: { type: integer, nullable: true }
        url:
          type: string
          nullable: true
          description: "The title's page on this service (JustWatch's link; may carry JustWatch's affiliate tag). Null when JustWatch has no matching offer."
          example: https://www.netflix.com/title/81231974
        link: { type: string, nullable: true, description: "Always null here; see the country's link" }
        fetched_at: { type: string, format: date-time }

    OriginInfo:
      type: object
      description: >-
        Where a title on this provider's chart comes from (see
        /api/v1/analytics/origins). `owner` is the media group the title
        belongs to (netflix, amazon, apple, disney, wbd, nbcu, paramount,
        sony, lionsgate, a24; absent = independent or not recognised);
        `reason` is the brand that decided it.
      properties:
        origin: { type: string, enum: [original, in_house, licensed, unknown] }
        owner: { type: string, example: wbd }
        reason: { type: string, example: "network: HBO" }
    CalendarResponse:
      type: object
      properties:
        country: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        provider_id: { type: integer, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              air_date: { type: string, format: date }
              tmdb_id: { type: string }
              title: { type: string }
              poster_path: { type: string, nullable: true }
              season_number: { type: integer }
              season_premiere: { type: boolean, description: Includes episode 1 }
              season_finale: { type: boolean, description: "Includes TMDB's finale episode" }
              episodes:
                type: array
                items:
                  type: object
                  properties:
                    episode_number: { type: integer }
                    name: { type: string }
                    episode_type: { type: string, description: "TMDB: standard | finale | mid_season" }
                    runtime: { type: integer, description: Minutes }
              offers:
                type: array
                description: The show's subscription, free and ad-supported offers in the country
                items:
                  type: object
                  properties:
                    provider_id: { type: integer }
                    provider_name: { type: string }
                    monetization: { type: string, enum: [flatrate, free, ads] }
                    url: { type: string }
    ReleasePatternsResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        window_days: { type: integer }
        patterns:
          type: array
          items:
            type: object
            properties:
              pattern: { type: string, enum: [binge, batch, weekly, daily, irregular] }
              seasons: { type: integer }
              chart_runs: { type: integer, description: Season x chart pairs with at least one day in the Top 10 }
              median_days_in_top10: { type: number }
              mean_days_in_top10: { type: number }
              median_last_day: { type: number, description: Days from the premiere to the last day in the Top 10 }
              share_still_charting_day_28: { type: number, description: Share of chart runs still in the Top 10 on or after day 28 }
              median_best_rank: { type: number }
              median_points: { type: number, description: "Chart points per run (rank 1 = 10 ... rank 10 = 1)" }
        seasons:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [tv] }
              tmdb_id: { type: string }
              title: { type: string }
              season_number: { type: integer }
              pattern: { type: string }
              premiere: { type: string, format: date }
              last_episode: { type: string, format: date }
              episodes: { type: integer }
              drops: { type: integer, description: Release dates }
              charts: { type: integer }
              median_days_in_top10: { type: number }
              median_last_day: { type: number }
              best_rank: { type: integer }
        excluded:
          type: object
          properties:
            unaired: { type: integer }
            single: { type: integer }
            in_progress: { type: integer }
            uncharted: { type: integer }
    LagSummary:
      type: object
      properties:
        titles: { type: integer }
        median_days: { type: number, nullable: true }
        p25_days: { type: number, nullable: true }
        p75_days: { type: number, nullable: true }
    SpreadArrival:
      type: object
      properties:
        country: { type: string }
        provider: { type: string, description: Chart of the first appearance (best rank that day) }
        category: { type: string, enum: [movies, tv_shows] }
        first_date: { type: string, format: date }
        lag_days: { type: integer, description: Days after the debut (0 = an origin) }
        rank: { type: integer }
    SpreadLagResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        country: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        category: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        window: { type: integer }
        titles: { type: integer, description: Debuts in the range with at least one other country followed }
        multi_country: { type: integer, description: Titles that charted in two or more countries within the window }
        simultaneous: { type: integer, description: Titles that debuted in several countries on the same day }
        summary:
          allOf:
            - $ref: "#/components/schemas/LagSummary"
          description: Lags of every arrival after the first country (0 for the extra origins of a simultaneous debut)
        countries:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              origin: { type: integer, description: Titles that debuted here (alone or with other countries) }
              arrived: { type: integer, description: Titles that charted here after debuting elsewhere, within the window }
              arrival_lag: { $ref: "#/components/schemas/LagSummary" }
              not_reached: { type: integer, description: Titles followed here for the whole window that never charted }
        pairs:
          type: array
          description: Routes from a single-origin debut country to another country
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              reached: { type: integer }
              not_reached: { type: integer }
              lag: { $ref: "#/components/schemas/LagSummary" }
        items_total: { type: integer }
        items:
          type: array
          description: Titles that charted in two or more countries, newest debut first (at most 200)
          items:
            allOf:
              - $ref: "#/components/schemas/ChartTitle"
              - type: object
                properties:
                  debut_date: { type: string, format: date }
                  origins: { type: array, items: { type: string } }
                  arrivals: { type: array, items: { $ref: "#/components/schemas/SpreadArrival" } }
                  not_reached: { type: array, items: { type: string } }
                  pending: { type: array, items: { type: string }, description: Not charted yet; the window is not over }
    TitleCreditsResponse:
      type: object
      properties:
        kind: { type: string, enum: [movie, tv] }
        tmdb_id: { type: string }
        title: { type: string, nullable: true }
        cast:
          type: array
          items:
            type: object
