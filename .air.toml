root = "."
tmp_dir = "tmp"

[build]
# Deprecated: keep this file as the default run profile for tools that
# implicitly look for ".air.toml". Use ".air.run.toml" and ".air.debug.toml"
# explicitly via Make targets for predictable local workflows.
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "tmp/server"
full_bin = "./tmp/server"
include_ext = ["go", "tpl", "tmpl", "html", "sql", "yaml", "yml"]
include_dir = ["cmd", "internal", "db", "tools"]
exclude_dir = ["tmp", "bin", ".tools", "vendor", "web/node_modules", "web/dist", ".git"]
delay = 500
stop_on_error = true

[log]
time = true
