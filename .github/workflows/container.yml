name: container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release images are built through release.yml.
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        required: true
        type: string
      version:
        description: "Release tag to publish the image as (e.g. v0.2.0-alpha)"
        required: true
        type: string
    outputs:
      image_name:
        description: "Image repository the build was pushed to"
        value: ${{ jobs.build-scan-publish.outputs.image_name }}
      digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build-scan-publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  security-events: write

# Main builds queue instead of overlapping, so an older build never finishes
# (and cleans up) after a newer one. PR builds are superseded by new pushes.
concurrency:
  group: container-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-scan-publish:
    name: build-scan-publish
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      digest: ${{ steps.build_push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/metareel" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Releases are tagged with their version only; main builds get `main` and
      # `sha-<commit>`, which is what cleanup-main-images keys on.
      - name: Compute publish tags
        if: github.event_name != 'pull_request'
        id: tags
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${VERSION}" ]]; then
            echo "tags=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA="$(git rev-parse HEAD)"
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:main"
              echo "${IMAGE_NAME}:sha-${SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for PR
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: metareel:ci-${{ github.sha }}
          platforms: linux/amd64

      - name: Build and push image
        if: github.event_name != 'pull_request'
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64

      - name: Trivy scan (PR image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: metareel:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan (published image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_name }}@${{ steps.build_push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generate SBOM (PR image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: metareel:ci-${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Generate SBOM (published image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_name }}@${{ steps.build_push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # Runs only once the main image built, passed Trivy and got its SBOM, then
  # deletes every older main image so GHCR keeps a single one for main.
  # Release images (v* tags) are never touched.
  cleanup-main-images:
    name: cleanup-main-images
    needs: build-scan-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous main images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: metareel
          KEEP_DIGEST: ${{ needs.build-scan-publish.outputs.digest }}
        run: .github/scripts/cleanup-main-images.sh
