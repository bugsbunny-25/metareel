name: codeql

# Go code scanning when Go code changes. Release tags are not scanned again:
# a release is a commit main already analysed.
on:
  push:
    branches: [main]
    paths: &go-paths
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths: *go-paths

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
