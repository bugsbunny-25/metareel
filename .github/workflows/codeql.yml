name: codeql

# Go code scanning; the job runs when Go code changes. Release tags are not scanned again:
# a release is a commit main already analysed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

# A new push to a PR supersedes its running checks; main and release runs
# (inputs.ref) are never cancelled.
concurrency:
  group: codeql-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which files changed, so the jobs below can skip themselves. The workflow
  # itself always runs: its jobs are required checks on main (ruleset
  # main-pr), and a job skipped by its `if` counts as passed while a workflow
  # that never started blocks the merge.
  # If this job fails, everything runs.
  changes:
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'tools/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/codeql.yml'

  analyze:
    name: analyze
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
