name: mobile

# Checks for the React Native app in mobile/ (docs/mobile-app-plan.md):
# typecheck, lint, unit tests, generated-file drift, expo-doctor, prebuild, and
# Metro export. On main, publishes JS to the EAS Update "preview" channel when
# EXPO_TOKEN is set, and runs unsigned Android/iOS native builds on GitHub
# runners when native-affecting files change (preserving the EAS Free tier
# quota for releases). Signed release builds run on EAS through release.yml
# (mobile-release.yml), so signing keys never reach GitHub.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml runs the checks on the commit it releases.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

# A new push to a PR supersedes its running checks; main and release runs
# (inputs.ref) are never cancelled.
concurrency:
  group: mobile-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which files changed, so the jobs below can skip themselves. The workflow
  # itself always runs: its jobs are required checks on main (ruleset
  # main-pr), and a job skipped by its `if` counts as passed while a workflow
  # that never started blocks the merge. Called by release.yml (inputs.ref
  # set), everything runs.
  # If this job fails, everything runs.
  changes:
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'internal/openapi/spec/public.yaml'
              - 'app/src/tokens.css'
              - '.github/actions/setup-mobile/**'
              - '.github/workflows/mobile.yml'
            native:
              - 'mobile/package.json'
              - 'mobile/package-lock.json'
              - 'mobile/app.config.ts'
              - 'mobile/version.ts'
              - 'mobile/eas.json'
              - 'mobile/plugins/**'
              - 'mobile/modules/**'
              - 'mobile/assets/**'
              - '.github/actions/setup-mobile/**'
              - '.github/workflows/mobile.yml'

  checks:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-mobile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Generated files are up to date
        run: npm run check:generated
      - name: Expo project health
        run: npx --yes expo-doctor
      - name: Prebuild config plugins
        run: npx expo prebuild --no-install --clean
      - name: Bundle JS for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"

  # Unsigned native builds on main when native-affecting files change. Runs on
  # GitHub-hosted runners so native compilation, Gradle/R8, Pods, Swift/Kotlin
  # modules and extensions are verified before a release without consuming EAS
  # Build quota or requiring signing secrets.
  native-android:
    needs: [changes, checks]
    if: ${{ needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compile unsigned release APK (arm64-v8a)
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

  native-ios:
    needs: [changes, checks]
    if: ${{ needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        working-directory: mobile/ios
        env:
          LANG: en_US.UTF-8
        run: pod install
      - name: Compile iOS simulator release build
        run: >-
          xcodebuild
          -workspace ios/metareel.xcworkspace
          -scheme metareel
          -configuration Release
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  update:
    # Only on main, never for pull requests or releases (forks get no secrets anyway).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: EXPO_TOKEN is not set
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::EXPO_TOKEN is not set; skipping the EAS Update publish."
      - uses: actions/checkout@v7
        if: env.EXPO_TOKEN != ''
      - uses: ./.github/actions/setup-mobile
        if: env.EXPO_TOKEN != ''
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish to the preview channel
        if: env.EXPO_TOKEN != ''
        run: eas update --channel preview --environment preview --message "${{ github.sha }}" --non-interactive
