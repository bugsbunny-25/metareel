name: ci

# Go only: the server, its tests and govulncheck. The jobs run when Go code,
# the schema/queries or the build tooling change (the UIs are built by
# container.yml, the mobile app by mobile.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release tags run CI through release.yml.
  workflow_call:
    inputs:
      ref:
        description: "Commit to test"
        required: true
        type: string
      artifacts:
        description: "Also upload the HTML/JUnit/JSON report bundle"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes its running checks; main and release runs
# (inputs.ref) are never cancelled.
concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which files changed, so the jobs below can skip themselves. The workflow
  # itself always runs: its jobs are required checks on main (ruleset
  # main-pr), and a job skipped by its `if` counts as passed while a workflow
  # that never started blocks the merge. Called by release.yml (inputs.ref
  # set), everything runs.
  # If this job fails, everything runs.
  changes:
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'db/**'
              - 'tools/**'
              - 'go.mod'
              - 'go.sum'
              - 'sqlc.yaml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  go-quality:
    name: go-quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Run local CI parity checks
        run: make ci-local

      - name: Generate additional CI artifacts (HTML/JUnit/JSON)
        if: inputs.artifacts
        run: make ci-artifacts

      - name: Coverage summary
        run: |
          TOTAL="$(make -s coverage-total)"
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total coverage: ${TOTAL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: error

      - name: Upload CI artifacts bundle
        if: inputs.artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: tmp/ci-artifacts
          if-no-files-found: error

  integration:
    name: integration
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      DATABASE_URL: file:./tmp/integration.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)
      DATABASE_MIGRATIONS_DIR: db/migrations
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Prepare runtime directories
        run: mkdir -p tmp data

      - name: Run integration-oriented test suite
        run: make integration-local

  govulncheck:
    name: govulncheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Run govulncheck
        run: make security-local
