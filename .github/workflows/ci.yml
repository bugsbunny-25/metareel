name: ci

# Go only: the server, its tests and govulncheck. The jobs run when Go code,
# the schema/queries or the build tooling change (the UIs are built by
# container.yml, the mobile app by mobile.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Release tags run CI through release.yml.
  workflow_call:
    inputs:
      ref:
        description: "Commit to test"
        required: true
        type: string
      artifacts:
        description: "Also upload the HTML/JUnit/JSON report bundle"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes its running checks; main and release runs
# (inputs.ref) are never cancelled.
concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which files changed, so the jobs below can skip themselves. The workflow
  # itself always runs: its jobs are required checks on main (ruleset
  # main-pr), and a job skipped by its `if` counts as passed while a workflow
  # that never started blocks the merge. Called by release.yml (inputs.ref
  # set), everything runs.
  # If this job fails, everything runs.
  changes:
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file counts when it matches the allow-list and isn't Markdown, so
          # docs, agent skills (.claude/) and READMEs never start this workflow.
          predicate-quantifier: every
          filters: |
            go:
              - '{cmd/**,internal/**,db/**,tools/**,go.mod,go.sum,sqlc.yaml,Makefile,.github/workflows/ci.yml}'
              - '!**/*.md'

  go-quality:
    name: go-quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Run local CI parity checks
        if: ${{ !inputs.artifacts }}
        run: make ci-local

      # Releases: the same checks, with the race tests run once under
      # gotestsum so the coverage, JUnit and JSON reports come from one run.
      # (govulncheck runs once, in its own job, which keeps its report.)
      - name: Run local CI parity checks with the report bundle (HTML/JUnit/JSON)
        if: inputs.artifacts
        run: make ci-artifacts

      - name: Coverage summary
        run: |
          TOTAL="$(make -s coverage-total)"
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total coverage: ${TOTAL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: error

      - name: Upload CI artifacts bundle
        if: inputs.artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: tmp/ci-artifacts
          if-no-files-found: error

  govulncheck:
    name: govulncheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache: true

      - name: Run govulncheck
        if: ${{ !inputs.artifacts }}
        run: make security-local

      # Releases: the same scan, once, with its verbose report kept.
      - name: Run govulncheck with the verbose report
        if: inputs.artifacts
        run: make govulncheck-report

      - name: Upload govulncheck report
        if: ${{ !cancelled() && inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck
          path: tmp/ci-artifacts/govulncheck.txt
          if-no-files-found: error
