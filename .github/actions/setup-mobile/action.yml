name: setup-mobile
description: >-
  Node (with the npm cache), EAS CLI when an Expo token is given, and the
  mobile app's dependencies (npm ci in mobile/). Shared by the mobile jobs so
  each sets up the same way. Expects the repo to be checked out.
inputs:
  expo-token:
    description: EXPO_TOKEN; when empty, EAS CLI is not installed
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Read the exact Node version from mobile/eas.json so GitHub Actions and
    # EAS Build cloud workers always run the same Node and npm versions.
    - id: node-version
      shell: bash
      working-directory: mobile
      run: |
        v="$(jq -r '.build.base.node // empty' eas.json)"
        test -n "$v" || { echo "::error::mobile/eas.json build.base.node is not set"; exit 1; }
        echo "version=$v" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        cache: npm
        cache-dependency-path: mobile/package-lock.json
    - if: inputs.expo-token != ''
      uses: expo/expo-github-action@9.0.2
      with:
        eas-version: latest
        token: ${{ inputs.expo-token }}
    - shell: bash
      working-directory: mobile
      run: npm ci
