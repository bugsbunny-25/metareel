root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -gcflags='all=-N -l' -o ./tmp/server ./cmd/server"
bin = "tmp/server"
full_bin = ".tools/bin/dlv exec --headless --listen=127.0.0.1:2345 --api-version=2 --accept-multiclient --continue ./tmp/server"
include_ext = ["go", "tpl", "tmpl", "html", "sql", "yaml", "yml"]
include_dir = ["cmd", "internal", "db", "tools"]
exclude_dir = ["tmp", "bin", ".tools", "vendor", "web/node_modules", "web/dist", ".git"]
delay = 500
stop_on_error = true

[log]
time = true
